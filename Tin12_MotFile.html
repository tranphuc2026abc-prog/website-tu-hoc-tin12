(255,0,0)`"],["4","Blue (Xanh dương)","`#0000FF`","`rgb(0,0,255)`"]]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở tệp `style.css`."},{"x":"**B2:** Đặt màu nền cho toàn bộ trang `body { background-color: #f4f4f4; }`."},{"x":"**B3:** Định dạng thẻ `h1 { color: #800000; background-color: #ffe6e6; }`."},{"x":"**B4:** Lưu tệp và kiểm tra độ tương phản giữa màu chữ và màu nền trên trình duyệt."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi thiếu dấu `#` trước mã màu Hex:** Viết `color: FF0000;` khiến trình duyệt bỏ qua quy tắc CSS này."},{"x":"**Khắc phục:** Luôn ghi đúng cú pháp `#` trước chuỗi 6 ký tự Hex (VD: `#FF0000`)."}]}],"rem":[{"t":"ul","i":[{"x":"Màu sắc trong CSS biểu diễn qua Tên màu, Mã Hex (`#RRGGBB`) hoặc `rgb(r,g,b)`; `color` chỉnh màu chữ, `background-color` chỉnh màu nền."}]}]},"terms":[{"t":"color / background-color","d":"Thuộc tính màu chữ / màu nền."},{"t":"Hex Color Code (#RRGGBB)","d":"Mã màu hệ 16."},{"t":"RGB Color (rgb(r,g,b))","d":"Hệ màu đỏ-xanh lá-xanh dương."},{"t":"Child Selector (E > F)","d":"Bộ chọn con trực tiếp."}],"txt":"**Kiến thức:** Sử dụng được các thuộc tính CSS thiết lập màu cho chữ, màu nền và ảnh nền; nắm vững 3 hệ thống biểu diễn màu sắc trong CSS (Tên màu, HEX, RGB). **Năng lực:** Pho phối màu sắc hài hòa, độ tương phản tốt cho trang web. **Phẩm chất:** Tinh tế trong nghệ thuật kết hợp màu sắc trang web. **3 cách biểu diễn màu sắc trong CSS:** **Tên màu tiếng Anh (Color Name):** Sử dụng các tên màu chuẩn (VD: `red`, `blue`, `green`, `yellow`, `black`, `white`, `silver`). **Mã màu Hexadecimal (Hex Code):** Bắt đầu bằng dấu `#` theo sau là 6 ký tự lục phân đại diện cho ba màu Red-Green-Blue (VD: `#FF0000` là màu đỏ, `#000000` là màu đen, `#FFFFFF` là màu trắng). **Giá trị RGB (Red, Green, Blue):** Sử dụng cú pháp `rgb(r, g, b)` với giá trị từ 0 đến 255 (VD: `rgb(255, 0, 0)` là màu đỏ) hoặc phần trăm `rgb(100%, 0%, 0%)`. **Các thuộc tính màu và nền trong CSS:** `color`: Thiết lập màu cho chữ. `background-color`: Thiết lập màu nền cho phần tử hoặc toàn bộ trang web. `background-image`: Đặt hình ảnh làm nền (`url('background.jpg')`). `border-color`: Thiết lập màu sắc cho đường viền phần tử. **Bộ chọn quan hệ con trực tiếp (`E > F`) và anh em liền kề (`E + F`):** `E > F`: Áp dụng cho F là con trực tiếp cấp 1 của E. `E + F`: Áp dụng cho F là phần tử anh em đứng ngay liền sau E. `color / background-color`: Thuộc tính màu chữ / màu nền. `Hex Color Code (#RRGGBB)`: Mã màu hệ 16. `RGB Color (rgb(r,g,b))`: Hệ màu đỏ-xanh lá-xanh dương. `Child Selector (E > F)`: Bộ chọn con trực tiếp. **B1:** Mở tệp `style.css`. **B2:** Đặt màu nền cho toàn bộ trang `body { background-color: #f4f4f4; }`. **B3:** Định dạng thẻ `h1 { color: #800000; background-color: #ffe6e6; }`. **B4:** Lưu tệp và kiểm tra độ tương phản giữa màu chữ và màu nền trên trình duyệt. **Lỗi thiếu dấu `#` trước mã màu Hex:** Viết `color: FF0000;` khiến trình duyệt bỏ qua quy tắc CSS này. **Khắc phục:** Luôn ghi đúng cú pháp `#` trước chuỗi 6 ký tự Hex (VD: `#FF0000`). Màu sắc trong CSS biểu diễn qua Tên màu, Mã Hex (`#RRGGBB`) hoặc `rgb(r,g,b)`; `color` chỉnh màu chữ, `background-color` chỉnh màu nền."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B16"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Hiểu mô hình hộp (Box Model); sử dụng CSS định dạng kích thước khung (`width`, `height`), đường viền (`border`), vùng đệm (`padding`), khoảng cách lề (`margin`); phân biệt phần tử dạng khối (Block) và nội tuyến (Inline); sử dụng bộ chọn `id` (`#idname`) và `class` (`.classname`)."},{"x":"**Năng lực:** Lập bố cục khung hiển thị cho các phần tử trang web."},{"x":"**Phẩm chất:** Cẩn thận, chính xác trong tính toán kích thước phần tử."}]}],"key":[{"t":"ul","i":[{"x":"**Mô hình hộp trong CSS (CSS Box Model):**"}]},{"t":"p","x":"Mỗi phần tử HTML được coi như một hộp hình chữ nhật bao gồm 4 lớp từ trong ra ngoài:"},{"t":"ul","i":[{"x":"**Content (Nội dung):** Vùng chứa văn bản/hình ảnh (`width`, `height`)."},{"x":"**Padding (Vùng đệm):** Khoảng cách giữa nội dung và đường viền."},{"x":"**Border (Đường viền):** Đường viền bao quanh vùng đệm (`border-style`, `border-width`, `border-color`)."},{"x":"**Margin (Khoảng cách lề):** Khoảng cách trống ngoài đường viền phân cách với các phần tử xung quanh."},{"x":"**Phân biệt Phần tử khối (Block) và Nội tuyến (Inline):**","c":[{"x":"**Block element (`<div>`, `<p>`, `<h1>`-`<h6>`, `<ul>`, `<table>`):** Bắt đầu trên một dòng mới, chiếm toàn bộ chiều rộng màn hình. Áp dụng được đầy đủ `width`, `height`, `margin`, `padding`."},{"x":"**Inline element (`<span>`, `<a>`, `<b>`, `<i>`, `<img>`):** Hiển thị trên cùng một dòng với văn bản, chiều rộng vừa đủ chứa nội dung. Không áp dụng được `width`, `height`."}]},{"x":"**Bộ chọn Lớp (`Class`) và Định danh (`ID`):**","c":[{"x":"**Bộ chọn ID (`#idname`):** Duy nhất cho một phần tử trên trang web."},{"x":"**Bộ chọn Class (`.classname`):** Áp dụng chung cho nhiều phần tử có cùng nhóm kiểu dáng."}]}]}],"terms":[{"t":"ul","i":[{"x":"`CSS Box Model`: Mô hình hộp (Content, Padding, Border, Margin)."},{"x":"`Block Elements vs Inline Elements`: Phần tử dạng khối vs Phần tử nội tuyến."},{"x":"`Class Selector (.class)`: Bộ chọn lớp."},{"x":"`ID Selector (#id)`: Bộ chọn mã định danh."}]}],"ex":[{"t":"code","l":"css","x":"/* Định dạng khung hộp có id=\"box1\" */\n#box1 {\n    width: 300px;\n    height: 150px;\n    padding: 15px;\n    border: 2px solid navy;\n    margin: 20px auto;\n    background-color: lightyellow;\n}"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở tệp HTML, gán `class=\"thong_bao\"` cho các đoạn văn cần đóng khung."},{"x":"**B2:** Trong tệp CSS, định nghĩa `.thong_bao { border: 1px dashed red; padding: 10px; margin: 10px 0; }`."},{"x":"**B3:** Quan sát sự thay đổi khoảng cách lề trong và lề ngoài của khung trên trình duyệt."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi tổng kích thước khung bị phình to hơn dự tính:** Do `width` chưa tính thêm `padding` và `border`."},{"x":"**Khắc phục:** Thêm thuộc tính `box-sizing: border-box;` vào CSS để giữ nguyên kích thước tổng khung."}]}],"rem":[{"t":"ul","i":[{"x":"Box Model gồm Content, Padding, Border, Margin; phần tử Block chiếm nguyên dòng, Inline ở trên cùng dòng; bộ chọn ID dùng `#`, Class dùng `.`."}]}]},"terms":[{"t":"CSS Box Model","d":"Mô hình hộp (Content, Padding, Border, Margin)."},{"t":"Block Elements vs Inline Elements","d":"Phần tử dạng khối vs Phần tử nội tuyến."},{"t":"Class Selector (.class)","d":"Bộ chọn lớp."},{"t":"ID Selector (#id)","d":"Bộ chọn mã định danh."}],"txt":"**Kiến thức:** Hiểu mô hình hộp (Box Model); sử dụng CSS định dạng kích thước khung (`width`, `height`), đường viền (`border`), vùng đệm (`padding`), khoảng cách lề (`margin`); phân biệt phần tử dạng khối (Block) và nội tuyến (Inline); sử dụng bộ chọn `id` (`#idname`) và `class` (`.classname`). **Năng lực:** Lập bố cục khung hiển thị cho các phần tử trang web. **Phẩm chất:** Cẩn thận, chính xác trong tính toán kích thước phần tử. **Mô hình hộp trong CSS (CSS Box Model):** Mỗi phần tử HTML được coi như một hộp hình chữ nhật bao gồm 4 lớp từ trong ra ngoài: **Content (Nội dung):** Vùng chứa văn bản/hình ảnh (`width`, `height`). **Padding (Vùng đệm):** Khoảng cách giữa nội dung và đường viền. **Border (Đường viền):** Đường viền bao quanh vùng đệm (`border-style`, `border-width`, `border-color`). **Margin (Khoảng cách lề):** Khoảng cách trống ngoài đường viền phân cách với các phần tử xung quanh. **Phân biệt Phần tử khối (Block) và Nội tuyến (Inline):** **Block element (`<div>`, `<p>`, `<h1>`-`<h6>`, `<ul>`, `<table>`):** Bắt đầu trên một dòng mới, chiếm toàn bộ chiều rộng màn hình. Áp dụng được đầy đủ `width`, `height`, `margin`, `padding`. **Inline element (`<span>`, `<a>`, `<b>`, `<i>`, `<img>`):** Hiển thị trên cùng một dòng với văn bản, chiều rộng vừa đủ chứa nội dung. Không áp dụng được `width`, `height`. **Bộ chọn Lớp (`Class`) và Định danh (`ID`):** **Bộ chọn ID (`#idname`):** Duy nhất cho một phần tử trên trang web. **Bộ chọn Class (`.classname`):** Áp dụng chung cho nhiều phần tử có cùng nhóm kiểu dáng. `CSS Box Model`: Mô hình hộp (Content, Padding, Border, Margin). `Block Elements vs Inline Elements`: Phần tử dạng khối vs Phần tử nội tuyến. `Class Selector (.class)`: Bộ chọn lớp. `ID Selector (#id)`: Bộ chọn mã định danh. /* Định dạng khung hộp có id=\"box1\" */\n#box1 {\n    width: 300px;\n    height: 150px;\n    padding: 15px;\n    border: 2px solid navy;\n    margin: 20px auto;\n    background-color: lightyellow;\n} **B1:** Mở tệp HTML, gán `class=\"thong_bao\"` cho các đoạn văn cần đóng khung. **B2:** Trong tệp CSS, định nghĩa `.thong_bao { border: 1px dashed red; padding: 10px; margin: 10px 0; }`. **B3:** Quan sát sự thay đổi khoảng cách lề trong và lề ngoài của khung trên trình duyệt. **Lỗi tổng kích thước khung bị phình to hơn dự tính:** Do `width` chưa tính thêm `padding` và `border`. **Khắc phục:** Thêm thuộc tính `box-sizing: border-box;` vào CSS để giữ nguyên kích thước tổng khung. Box Model gồm Content, Padding, Border, Margin; phần tử Block chiếm nguyên dòng, Inline ở trên cùng dòng; bộ chọn ID dùng `#`, Class dùng `.`."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B17"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Hiểu và tính toán được trọng số mức ưu tiên của các bộ chọn CSS; biết cách sử dụng lớp giả (Pseudo-class) và phần tử giả (Pseudo-element) để tạo hiệu ứng tương tác."},{"x":"**Năng lực:** Xử lý xung đột định dạng CSS, tạo hiệu ứng chuyển động tương tác người dùng."},{"x":"**Phẩm chất:** Tư duy phân tích logic kĩ thuật cao."}]}],"key":[{"t":"ul","i":[{"x":"**Quy tắc trọng số ưu tiên trong CSS (CSS Specificity):**"}]},{"t":"p","x":"Khi có nhiều quy tắc CSS cùng tác động lên một phần tử, quy tắc có trọng số cao hơn sẽ được áp dụng:"},{"t":"ul","i":[{"x":"**Loại 1 (ID Selector `#id`):** Trọng số = 100."},{"x":"**Loại 2 (Class Selector `.class`, Pseudo-class `:hover`):** Trọng số = 10."},{"x":"**Loại 3 (Element Selector `p`, `h1`, Pseudo-element `::first-line`):** Trọng số = 1."},{"x":"**Bộ chọn toàn cục (`*`):** Trọng số = 0."},{"x":"**Nguyên tắc Cascading (Thứ tự ghi sau):** Nếu các bộ chọn có trọng số bằng nhau, quy tắc CSS nằm ở vị trí cuối cùng trong tệp sẽ được áp dụng."},{"x":"**Lớp giả (Pseudo-class):** Dùng để định dạng phần tử khi ở một trạng thái nhất định.","c":[{"x":"`:hover`: Khi di chuyển con trỏ chuột lên phần tử (VD: `a:hover { color: red; }`)."},{"x":"`:link`, `:visited`, `:active`: Trạng thái của đường liên kết."}]},{"x":"**Phần tử giả (Pseudo-element):** Dùng để định dạng một phần cụ thể của phần tử.","c":[{"x":"`::first-line`: Định dạng dòng đầu tiên của đoạn văn."},{"x":"`::first-letter`: Định dạng chữ cái đầu tiên của đoạn văn (tạo chữ thả Drop-cap)."},{"x":"`::selection`: Định dạng phần văn bản được người dùng bôi đen chọn."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Specificity Weight`: Trọng số ưu tiên bộ chọn (100 - 10 - 1)."},{"x":"`Pseudo-class (:hover, :active)`: Lớp giả quy định trạng thái tương tác."},{"x":"`Pseudo-element (::first-line, ::first-letter)`: Phần tử giả định dạng thành phần nhỏ."},{"x":"`Cascading Rule`: Nguyên tắc áp dụng quy tắc viết sau cùng."}]}],"ex":[{"t":"ul","i":[{"x":"Tính trọng số bộ chọn:","c":[{"x":"`a:link ~ p#info`: 1 ID (100) + 1 Pseudo-class (10) + 2 Element (2) = Trọng số 112."},{"x":"`p.description::first-line`: 1 Class (10) + 1 Element (1) + 1 Pseudo-element (1) = Trọng số 12."}]}]}],"steps":[{"t":"ul","i":[{"x":"**Nhiệm vụ 1:** Tạo nút bấm có `id=\"btnSubmit\"`."},{"x":"**Nhiệm vụ 2:** Trong CSS, viết `#btnSubmit { background-color: blue; color: white; }`."},{"x":"**Nhiệm vụ 3:** Thêm hiệu ứng di chuột: `#btnSubmit:hover { background-color: darkblue; cursor: pointer; }`."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi nhầm lẫn giữa một dấu hai chấm `:` và hai dấu hai chấm `::`:**"},{"x":"**Khắc phục:** Theo chuẩn CSS3: Cú pháp `:pseudo-class` dùng 1 dấu hai chấm (VD: `:hover`); cú pháp `::pseudo-element` dùng 2 dấu hai chấm (VD: `::first-line`)."}]}],"rem":[{"t":"ul","i":[{"x":"Trọng số ưu tiên CSS: ID (100) > Class/Pseudo-class (10) > Element/Pseudo-element (1); `:hover` định dạng khi rê chuột, `::first-line` định dạng dòng đầu."}]}]},"terms":[{"t":"Specificity Weight","d":"Trọng số ưu tiên bộ chọn (100 - 10 - 1)."},{"t":"Pseudo-class (:hover, :active)","d":"Lớp giả quy định trạng thái tương tác."},{"t":"Pseudo-element (::first-line, ::first-letter)","d":"Phần tử giả định dạng thành phần nhỏ."},{"t":"Cascading Rule","d":"Nguyên tắc áp dụng quy tắc viết sau cùng."}],"txt":"**Kiến thức:** Hiểu và tính toán được trọng số mức ưu tiên của các bộ chọn CSS; biết cách sử dụng lớp giả (Pseudo-class) và phần tử giả (Pseudo-element) để tạo hiệu ứng tương tác. **Năng lực:** Xử lý xung đột định dạng CSS, tạo hiệu ứng chuyển động tương tác người dùng. **Phẩm chất:** Tư duy phân tích logic kĩ thuật cao. **Quy tắc trọng số ưu tiên trong CSS (CSS Specificity):** Khi có nhiều quy tắc CSS cùng tác động lên một phần tử, quy tắc có trọng số cao hơn sẽ được áp dụng: **Loại 1 (ID Selector `#id`):** Trọng số = 100. **Loại 2 (Class Selector `.class`, Pseudo-class `:hover`):** Trọng số = 10. **Loại 3 (Element Selector `p`, `h1`, Pseudo-element `::first-line`):** Trọng số = 1. **Bộ chọn toàn cục (`*`):** Trọng số = 0. **Nguyên tắc Cascading (Thứ tự ghi sau):** Nếu các bộ chọn có trọng số bằng nhau, quy tắc CSS nằm ở vị trí cuối cùng trong tệp sẽ được áp dụng. **Lớp giả (Pseudo-class):** Dùng để định dạng phần tử khi ở một trạng thái nhất định. `:hover`: Khi di chuyển con trỏ chuột lên phần tử (VD: `a:hover { color: red; }`). `:link`, `:visited`, `:active`: Trạng thái của đường liên kết. **Phần tử giả (Pseudo-element):** Dùng để định dạng một phần cụ thể của phần tử. `::first-line`: Định dạng dòng đầu tiên của đoạn văn. `::first-letter`: Định dạng chữ cái đầu tiên của đoạn văn (tạo chữ thả Drop-cap). `::selection`: Định dạng phần văn bản được người dùng bôi đen chọn. `Specificity Weight`: Trọng số ưu tiên bộ chọn (100 - 10 - 1). `Pseudo-class (:hover, :active)`: Lớp giả quy định trạng thái tương tác. `Pseudo-element (::first-line, ::first-letter)`: Phần tử giả định dạng thành phần nhỏ. `Cascading Rule`: Nguyên tắc áp dụng quy tắc viết sau cùng. Tính trọng số bộ chọn: `a:link ~ p#info`: 1 ID (100) + 1 Pseudo-class (10) + 2 Element (2) = Trọng số 112. `p.description::first-line`: 1 Class (10) + 1 Element (1) + 1 Pseudo-element (1) = Trọng số 12. **Nhiệm vụ 1:** Tạo nút bấm có `id=\"btnSubmit\"`. **Nhiệm vụ 2:** Trong CSS, viết `#btnSubmit { background-color: blue; color: white; }`. **Nhiệm vụ 3:** Thêm hiệu ứng di chuột: `#btnSubmit:hover { background-color: darkblue; cursor: pointer; }`. **Lỗi nhầm lẫn giữa một dấu hai chấm `:` và hai dấu hai chấm `::`:** **Khắc phục:** Theo chuẩn CSS3: Cú pháp `:pseudo-class` dùng 1 dấu hai chấm (VD: `:hover`); cú pháp `::pseudo-element` dùng 2 dấu hai chấm (VD: `::first-line`). Trọng số ưu tiên CSS: ID (100) > Class/Pseudo-class (10) > Element/Pseudo-element (1); `:hover` định dạng khi rê chuột, `::first-line` định dạng dòng đầu."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B18"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Tổng hợp toàn bộ kiến thức HTML và CSS từ Bài 7 đến Bài 17 để xây dựng hoàn chỉnh một trang web tĩnh có đầy đủ bố cục (Đầu trang, Thanh điều hướng, Thân trang, Chân trang, Biểu mẫu)."},{"x":"**Năng lực:** Lập trình thiết kế trang web tĩnh hoàn chỉnh."},{"x":"**Phẩm chất:** Tự tin, sáng tạo, tác phong làm việc chuẩn dự án phần mềm."}]}],"key":[{"t":"ul","i":[{"x":"**Quy trình tổng hợp thiết kế trang web bằng HTML/CSS:**","c":[{"x":"**Thiết kế cấu trúc khung HTML:** Sử dụng các thẻ khối `<div>` kết hợp với `class` hoặc `id` chia vùng trang web thành 4 phần chính:","c":[{"x":"`<div class=\"header\">`: Khung đầu trang (Logo, tiêu đề)."},{"x":"`<div class=\"nav\">`: Thanh điều hướng chứa các liên kết."},{"x":"`<div class=\"content\">`: Vùng nội dung chính (bài viết, danh sách, bảng, ảnh/video)."},{"x":"`<div class=\"footer\">`: Khung chân trang (Thông tin liên hệ, bản quyền)."}]},{"x":"**Viết tệp định dạng CSS tổng hợp (`style.css`):** Thiết lập màu sắc, phông chữ, khoảng cách lề, viền khung và hiệu ứng `:hover` cho thanh điều hướng."},{"x":"**Tạo trang phụ và liên kết:** Sao chép cấu trúc khung trang chủ để tạo các trang con (`dang_ki.html`, `thong_tin.html`) và liên kết qua lại."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Web Layout Design`: Thiết kế bố cục trang web bằng HTML/CSS."},{"x":"`Division Tag <div>`: Thẻ chia vùng cấu trúc trang web."},{"x":"`Header / Nav / Content / Footer`: 4 khối thành phần chuẩn của trang web."}]}],"ex":[{"t":"code","l":"html","x":"<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Website CLB Trường Nguyễn Bỉnh Khiêm</title>\n    <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n    <div class=\"header\"><h1>CÂU LẠC BỘ NGOẠI KHÓA</h1></div>\n    <div class=\"nav\">\n        <a href=\"index.html\">Trang chủ</a> | \n        <a href=\"dang_ki.html\">Đăng ký</a>\n    </div>\n    <div class=\"content\"><h2>Giới thiệu chung</h2><p>Nội dung câu lạc bộ...</p></div>\n    <div class=\"footer\"><p>&copy; 2024 Trường THPT Nguyễn Bỉnh Khiêm</p></div>\n</body>\n</html>"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Tạo thư mục dự án `Dự_án_Website_CLB`."},{"x":"**B2:** Soạn thảo tệp `index.html` xây dựng 4 khung khối `<div>`."},{"x":"**B3:** Soạn thảo `style.css` định dạng màu sắc, kích thước và căn lề cho các khối `<div>`."},{"x":"**B4:** Nhúng biểu mẫu đăng ký thành viên vào tệp `dang_ki.html`."},{"x":"**B5:** Kiểm tra và hoàn thiện toàn bộ liên kết trên trình duyệt."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi lệch bố cục các khối `<div>`:** Do chưa thiết lập xóa bộ nhớ lề mặc định của trình duyệt."},{"x":"**Khắc phục:** Thêm quy tắc xóa lề ở đầu tệp CSS: `* { margin: 0; padding: 0; box-sizing: border-box; }`."}]}],"rem":[{"t":"ul","i":[{"x":"Xây dựng trang web tĩnh chuẩn gồm phân chia các khối `<div>` bằng HTML và định dạng toàn bộ giao diện bằng tệp `style.css` tập trung."}]}]},"terms":[{"t":"Web Layout Design","d":"Thiết kế bố cục trang web bằng HTML/CSS."},{"t":"Division Tag <div>","d":"Thẻ chia vùng cấu trúc trang web."},{"t":"Header / Nav / Content / Footer","d":"4 khối thành phần chuẩn của trang web."}],"txt":"**Kiến thức:** Tổng hợp toàn bộ kiến thức HTML và CSS từ Bài 7 đến Bài 17 để xây dựng hoàn chỉnh một trang web tĩnh có đầy đủ bố cục (Đầu trang, Thanh điều hướng, Thân trang, Chân trang, Biểu mẫu). **Năng lực:** Lập trình thiết kế trang web tĩnh hoàn chỉnh. **Phẩm chất:** Tự tin, sáng tạo, tác phong làm việc chuẩn dự án phần mềm. **Quy trình tổng hợp thiết kế trang web bằng HTML/CSS:** **Thiết kế cấu trúc khung HTML:** Sử dụng các thẻ khối `<div>` kết hợp với `class` hoặc `id` chia vùng trang web thành 4 phần chính: `<div class=\"header\">`: Khung đầu trang (Logo, tiêu đề). `<div class=\"nav\">`: Thanh điều hướng chứa các liên kết. `<div class=\"content\">`: Vùng nội dung chính (bài viết, danh sách, bảng, ảnh/video). `<div class=\"footer\">`: Khung chân trang (Thông tin liên hệ, bản quyền). **Viết tệp định dạng CSS tổng hợp (`style.css`):** Thiết lập màu sắc, phông chữ, khoảng cách lề, viền khung và hiệu ứng `:hover` cho thanh điều hướng. **Tạo trang phụ và liên kết:** Sao chép cấu trúc khung trang chủ để tạo các trang con (`dang_ki.html`, `thong_tin.html`) và liên kết qua lại. `Web Layout Design`: Thiết kế bố cục trang web bằng HTML/CSS. `Division Tag <div>`: Thẻ chia vùng cấu trúc trang web. `Header / Nav / Content / Footer`: 4 khối thành phần chuẩn của trang web. <!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Website CLB Trường Nguyễn Bỉnh Khiêm</title>\n    <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n    <div class=\"header\"><h1>CÂU LẠC BỘ NGOẠI KHÓA</h1></div>\n    <div class=\"nav\">\n        <a href=\"index.html\">Trang chủ</a> | \n        <a href=\"dang_ki.html\">Đăng ký</a>\n    </div>\n    <div class=\"content\"><h2>Giới thiệu chung</h2><p>Nội dung câu lạc bộ...</p></div>\n    <div class=\"footer\"><p>&copy; 2024 Trường THPT Nguyễn Bỉnh Khiêm</p></div>\n</body>\n</html> **B1:** Tạo thư mục dự án `Dự_án_Website_CLB`. **B2:** Soạn thảo tệp `index.html` xây dựng 4 khung khối `<div>`. **B3:** Soạn thảo `style.css` định dạng màu sắc, kích thước và căn lề cho các khối `<div>`. **B4:** Nhúng biểu mẫu đăng ký thành viên vào tệp `dang_ki.html`. **B5:** Kiểm tra và hoàn thiện toàn bộ liên kết trên trình duyệt. **Lỗi lệch bố cục các khối `<div>`:** Do chưa thiết lập xóa bộ nhớ lề mặc định của trình duyệt. **Khắc phục:** Thêm quy tắc xóa lề ở đầu tệp CSS: `* { margin: 0; padding: 0; box-sizing: border-box; }`. Xây dựng trang web tĩnh chuẩn gồm phân chia các khối `<div>` bằng HTML và định dạng toàn bộ giao diện bằng tệp `style.css` tập trung."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B19"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Trình bày được thông tin hướng nghiệp của nghề sửa chữa và bảo trì máy tính (nhiệm vụ, kiến thức, kỹ năng); khảo sát nhu cầu nhân lực xã hội và các ngành học liên quan."},{"x":"**Năng lực:** Định hướng nghề nghiệp bản thân trong lĩnh vực phần cứng và dịch vụ CNTT."},{"x":"**Phẩm chất:** Chăm chỉ, trách nhiệm, có ý thức rèn luyện kỹ năng nghề nghiệp."}]}],"key":[{"t":"ul","i":[{"x":"**Mô tả công việc của nghề Sửa chữa và Bảo trì máy tính:**","c":[{"x":"Lắp đặt, cấu hình, kiểm tra và bảo dưỡng định kỳ hệ thống máy tính, mạng và thiết bị ngoại vi."},{"x":"Phát hiện, chẩn đoán sự cố phần cứng (hỏng RAM, ổ cứng, nguồn, mainboard) và tiến hành sửa chữa, thay thế linh kiện."},{"x":"Sửa chữa sự cố phần mềm: Cài đặt hệ điều hành, driver, ứng dụng văn phòng, diệt virus và khôi phục dữ liệu."},{"x":"Hỗ trợ kỹ thuật, hướng dẫn người dùng vận hành thiết bị an toàn."}]},{"x":"**Yêu cầu về kiến thức và kỹ năng:**","c":[{"x":"**Kiến thức:** Hiểu biết sâu về kiến trúc phần cứng, hệ điều hành, mạng máy tính cơ bản, an toàn điện."},{"x":"**Kỹ năng:** Kỹ năng chẩn đoán khắc phục sự cố, kỹ năng tự học cập nhật công nghệ mới, kỹ năng giao tiếp và quản lý thời gian làm việc."}]},{"x":"**Nhu cầu nhân lực & Ngành đào tạo:**","c":[{"x":"Nhu cầu nhân lực trình độ cao luôn tăng mạnh do sự bùng nổ thiết bị CNTT ở mọi cơ quan, doanh nghiệp."},{"x":"Ngành đào tạo: Kỹ thuật sửa chữa, lắp ráp máy tính; Công nghệ kỹ thuật phần cứng; Công nghệ thông tin (Bậc Trung cấp, Cổ đẳng, Đại học)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Computer Maintenance`: Bảo trì máy tính."},{"x":"`Hardware Repair`: Sửa chữa phần cứng."},{"x":"`Troubleshooting`: Chẩn đoán và xử lý sự cố."},{"x":"`IT Technical Support`: Hỗ trợ kỹ thuật CNTT."}]}],"ex":[{"t":"ul","i":[{"x":"Tình huống nhà hàng bị hỏng ổ cứng máy tính quản lý đơn hàng: Kỹ thuật viên phải có mặt xử lý thay ổ cứng, cài lại phần mềm và khôi phục dữ liệu backup cho nhà hàng."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Tra cứu thông tin tuyển dụng vị trí \"Nhân viên bảo trì máy tính / IT Support\" trên các trang tuyển dụng (TopCV, VietnamWorks)."},{"x":"**B2:** Đọc và phân tích yêu cầu công việc, trình độ học vấn, kỹ năng đòi hỏi."},{"x":"**B3:** Điền kết quả so sánh vào phiếu bài tập hướng nghiệp."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi coi nhẹ các kỹ năng mềm trong nghề bảo trì:** Cho rằng làm kỹ thuật chỉ cần giỏi phần cứng không cần giao tiếp."},{"x":"**Khắc phục:** Thực tế kỹ năng giao tiếp và lắng nghe giúp hiểu chính xác sự cố của khách hàng để xử lý hiệu quả."}]}],"rem":[{"t":"ul","i":[{"x":"Nghề sửa chữa bảo trì máy tính đảm bảo sự vận hành ổn định của phần cứng, phần mềm và mạng; đòi hỏi kiến thức chuyên môn và kỹ năng giao tiếp tốt."}]}]},"terms":[{"t":"Computer Maintenance","d":"Bảo trì máy tính."},{"t":"Hardware Repair","d":"Sửa chữa phần cứng."},{"t":"Troubleshooting","d":"Chẩn đoán và xử lý sự cố."},{"t":"IT Technical Support","d":"Hỗ trợ kỹ thuật CNTT."}],"txt":"**Kiến thức:** Trình bày được thông tin hướng nghiệp của nghề sửa chữa và bảo trì máy tính (nhiệm vụ, kiến thức, kỹ năng); khảo sát nhu cầu nhân lực xã hội và các ngành học liên quan. **Năng lực:** Định hướng nghề nghiệp bản thân trong lĩnh vực phần cứng và dịch vụ CNTT. **Phẩm chất:** Chăm chỉ, trách nhiệm, có ý thức rèn luyện kỹ năng nghề nghiệp. **Mô tả công việc của nghề Sửa chữa và Bảo trì máy tính:** Lắp đặt, cấu hình, kiểm tra và bảo dưỡng định kỳ hệ thống máy tính, mạng và thiết bị ngoại vi. Phát hiện, chẩn đoán sự cố phần cứng (hỏng RAM, ổ cứng, nguồn, mainboard) và tiến hành sửa chữa, thay thế linh kiện. Sửa chữa sự cố phần mềm: Cài đặt hệ điều hành, driver, ứng dụng văn phòng, diệt virus và khôi phục dữ liệu. Hỗ trợ kỹ thuật, hướng dẫn người dùng vận hành thiết bị an toàn. **Yêu cầu về kiến thức và kỹ năng:** **Kiến thức:** Hiểu biết sâu về kiến trúc phần cứng, hệ điều hành, mạng máy tính cơ bản, an toàn điện. **Kỹ năng:** Kỹ năng chẩn đoán khắc phục sự cố, kỹ năng tự học cập nhật công nghệ mới, kỹ năng giao tiếp và quản lý thời gian làm việc. **Nhu cầu nhân lực & Ngành đào tạo:** Nhu cầu nhân lực trình độ cao luôn tăng mạnh do sự bùng nổ thiết bị CNTT ở mọi cơ quan, doanh nghiệp. Ngành đào tạo: Kỹ thuật sửa chữa, lắp ráp máy tính; Công nghệ kỹ thuật phần cứng; Công nghệ thông tin (Bậc Trung cấp, Cổ đẳng, Đại học). `Computer Maintenance`: Bảo trì máy tính. `Hardware Repair`: Sửa chữa phần cứng. `Troubleshooting`: Chẩn đoán và xử lý sự cố. `IT Technical Support`: Hỗ trợ kỹ thuật CNTT. Tình huống nhà hàng bị hỏng ổ cứng máy tính quản lý đơn hàng: Kỹ thuật viên phải có mặt xử lý thay ổ cứng, cài lại phần mềm và khôi phục dữ liệu backup cho nhà hàng. **B1:** Tra cứu thông tin tuyển dụng vị trí \"Nhân viên bảo trì máy tính / IT Support\" trên các trang tuyển dụng (TopCV, VietnamWorks). **B2:** Đọc và phân tích yêu cầu công việc, trình độ học vấn, kỹ năng đòi hỏi. **B3:** Điền kết quả so sánh vào phiếu bài tập hướng nghiệp. **Lỗi coi nhẹ các kỹ năng mềm trong nghề bảo trì:** Cho rằng làm kỹ thuật chỉ cần giỏi phần cứng không cần giao tiếp. **Khắc phục:** Thực tế kỹ năng giao tiếp và lắng nghe giúp hiểu chính xác sự cố của khách hàng để xử lý hiệu quả. Nghề sửa chữa bảo trì máy tính đảm bảo sự vận hành ổn định của phần cứng, phần mềm và mạng; đòi hỏi kiến thức chuyên môn và kỹ năng giao tiếp tốt."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B20"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Trình bày được thông tin hướng nghiệp của nhóm nghề quản trị trong ngành CNTT (Quản trị mạng, Bảo mật hệ thống, Quản trị hệ thống); phân tích nhu cầu nhân lực và các ngành học liên quan."},{"x":"**Năng lực:** Hiểu rõ bức tranh nghề nghiệp hạ tầng số và an ninh mạng."},{"x":"**Phẩm chất:** Cẩn trọng, tuân thủ pháp luật và đạo đức an ninh thông tin."}]}],"key":[{"t":"ul","i":[{"x":"**Các nghề chính trong nhóm nghề Quản trị CNTT:**","c":[{"x":"**Quản trị mạng (Network Administrator):** Lắp đặt, cấu hình, theo dõi hiệu suất, bảo mật và duy trì hệ thống mạng máy tính (LAN/WAN/Wi-Fi) của tổ chức."},{"x":"**Bảo mật hệ thống thông tin (Information Security Specialist):** Triển khai các biện pháp an ninh mạng, giám sát phát hiện xâm nhập trái phép (IDS/IPS), xử lý các vụ tấn công mạng (DDoS, Malware, Ransomware)."},{"x":"**Quản trị và bảo trì hệ thống (System Administrator):** Quản lý, nâng cấp máy chủ (Server), cơ sở dữ liệu, dịch vụ đám mây (Cloud) và hệ điều hành doanh nghiệp."}]},{"x":"**Yêu cầu kiến thức và kỹ năng:**","c":[{"x":"Kiến thức vững chắc về giao thức mạng, an toàn thông tin, hệ điều hành Linux/Windows Server, điện toán đám mây và Pháp luật an ninh mạng."},{"x":"Kỹ năng giải quyết vấn đề phức tạp, tư duy phân tích hệ thống."}]},{"x":"**Nhu cầu nhân lực:** Tăng trưởng bùng nổ cùng quá trình Chuyển đổi số quốc gia và nguy cơ tấn công mạng ngày càng tinh vi (như sự cố mã độc WannaCry)."}]}],"terms":[{"t":"ul","i":[{"x":"`Network Administrator`: Quản trị mạng."},{"x":"`System Administrator (SysAdmin)`: Quản trị hệ thống."},{"x":"`Information Security / Cybersecurity`: An toàn an ninh thông tin."},{"x":"`IDS (Intrusion Detection System)`: Hệ thống phát hiện xâm nhập."},{"x":"`WannaCry / Ransomware`: Mã độc tống tiền mã hóa dữ liệu."}]}],"ex":[{"t":"ul","i":[{"x":"Phân tích sự cố tấn công mã độc WannaCry lây nhiễm qua lỗ hổng EternalBlue: Chuyên gia quản trị mạng phải nhanh chóng vá lỗi hệ thống và triển khai tường lửa ngăn chặn."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Thảo luận nhóm về tình huống công ty bán hàng trực tuyến bị tấn công mạng."},{"x":"**B2:** Đề xuất sự hỗ trợ từ các chuyên gia: Chuyên gia Quản trị mạng cấu hình lại Router/Firewall; Chuyên gia Bảo mật rà soát lỗ hổng."},{"x":"**B3:** Tra cứu các trường Đại học đào tạo ngành An toàn thông tin, Mạng máy tính tại địa phương."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi nhầm lẫn giữa Quản trị mạng và Lập trình phần mềm:**"},{"x":"**Khắc phục:** Phân biệt rõ: Lập trình viên viết ra phần mềm ứng dụng; Chuyên gia quản trị xây dựng và bảo vệ hạ tầng mạng/máy chủ cho phần mềm vận hành."}]}],"rem":[{"t":"ul","i":[{"x":"Nhóm nghề Quản trị CNTT đảm bảo hệ thống mạng và dữ liệu hoạt động an toàn, ổn định; nhu cầu nhân lực rất cao trong kỷ nguyên chuyển đổi số."}]}]},"terms":[{"t":"Network Administrator","d":"Quản trị mạng."},{"t":"System Administrator (SysAdmin)","d":"Quản trị hệ thống."},{"t":"Information Security / Cybersecurity","d":"An toàn an ninh thông tin."},{"t":"IDS (Intrusion Detection System)","d":"Hệ thống phát hiện xâm nhập."},{"t":"WannaCry / Ransomware","d":"Mã độc tống tiền mã hóa dữ liệu."}],"txt":"**Kiến thức:** Trình bày được thông tin hướng nghiệp của nhóm nghề quản trị trong ngành CNTT (Quản trị mạng, Bảo mật hệ thống, Quản trị hệ thống); phân tích nhu cầu nhân lực và các ngành học liên quan. **Năng lực:** Hiểu rõ bức tranh nghề nghiệp hạ tầng số và an ninh mạng. **Phẩm chất:** Cẩn trọng, tuân thủ pháp luật và đạo đức an ninh thông tin. **Các nghề chính trong nhóm nghề Quản trị CNTT:** **Quản trị mạng (Network Administrator):** Lắp đặt, cấu hình, theo dõi hiệu suất, bảo mật và duy trì hệ thống mạng máy tính (LAN/WAN/Wi-Fi) của tổ chức. **Bảo mật hệ thống thông tin (Information Security Specialist):** Triển khai các biện pháp an ninh mạng, giám sát phát hiện xâm nhập trái phép (IDS/IPS), xử lý các vụ tấn công mạng (DDoS, Malware, Ransomware). **Quản trị và bảo trì hệ thống (System Administrator):** Quản lý, nâng cấp máy chủ (Server), cơ sở dữ liệu, dịch vụ đám mây (Cloud) và hệ điều hành doanh nghiệp. **Yêu cầu kiến thức và kỹ năng:** Kiến thức vững chắc về giao thức mạng, an toàn thông tin, hệ điều hành Linux/Windows Server, điện toán đám mây và Pháp luật an ninh mạng. Kỹ năng giải quyết vấn đề phức tạp, tư duy phân tích hệ thống. **Nhu cầu nhân lực:** Tăng trưởng bùng nổ cùng quá trình Chuyển đổi số quốc gia và nguy cơ tấn công mạng ngày càng tinh vi (như sự cố mã độc WannaCry). `Network Administrator`: Quản trị mạng. `System Administrator (SysAdmin)`: Quản trị hệ thống. `Information Security / Cybersecurity`: An toàn an ninh thông tin. `IDS (Intrusion Detection System)`: Hệ thống phát hiện xâm nhập. `WannaCry / Ransomware`: Mã độc tống tiền mã hóa dữ liệu. Phân tích sự cố tấn công mã độc WannaCry lây nhiễm qua lỗ hổng EternalBlue: Chuyên gia quản trị mạng phải nhanh chóng vá lỗi hệ thống và triển khai tường lửa ngăn chặn. **B1:** Thảo luận nhóm về tình huống công ty bán hàng trực tuyến bị tấn công mạng. **B2:** Đề xuất sự hỗ trợ từ các chuyên gia: Chuyên gia Quản trị mạng cấu hình lại Router/Firewall; Chuyên gia Bảo mật rà soát lỗ hổng. **B3:** Tra cứu các trường Đại học đào tạo ngành An toàn thông tin, Mạng máy tính tại địa phương. **Lỗi nhầm lẫn giữa Quản trị mạng và Lập trình phần mềm:** **Khắc phục:** Phân biệt rõ: Lập trình viên viết ra phần mềm ứng dụng; Chuyên gia quản trị xây dựng và bảo vệ hạ tầng mạng/máy chủ cho phần mềm vận hành. Nhóm nghề Quản trị CNTT đảm bảo hệ thống mạng và dữ liệu hoạt động an toàn, ổn định; nhu cầu nhân lực rất cao trong kỷ nguyên chuyển đổi số."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B21"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Nêu được tên một số ngành nghề và lĩnh vực có sử dụng nhân lực CNTT; giải thích vai trò của chuyên viên CNTT trong Y tế, Sản xuất, Khoa học xã hội; thu thập thông tin đào tạo và tổ chức bài trình bày hội thảo."},{"x":"**Năng lực:** Thu thập, chọn lọc thông tin hướng nghiệp và thuyết trình báo cáo."},{"x":"**Phẩm chất:** Chủ động, tự tin, phát huy tinh thần hợp tác nhóm."}]}],"key":[{"t":"ul","i":[{"x":"**Ứng dụng nhân lực CNTT trong các ngành nghề xã hội:**","c":[{"x":"**Y tế:** Quản lý bệnh án điện tử (EMR), cổng thông tin y tế, vận hành thiết bị chẩn đoán hình ảnh số."},{"x":"**Sản xuất & Công nghiệp:** Triển khai hệ thống điều khiển tự động hóa, Internet vạn vật công nghiệp (IIoT), tối ưu hóa quy trình chuỗi cung ứng."},{"x":"**Khoa học xã hội & Nhân văn:** Phân tích dữ liệu lớn (Big Data) khảo sát dư luận xã hội, mô hình hóa hiện tượng nhân học."}]},{"x":"**Cấu trúc chuẩn của một bài trình bày Hội thảo Hướng nghiệp (10 phút):**","c":[{"x":"**Phần I (1 phút):** Giới thiệu lĩnh vực và tầm quan trọng của CNTT."},{"x":"**Phần II (2 phút):** Vai trò và công việc chính của chuyên viên CNTT trong lĩnh vực đó."},{"x":"**Phần III (2 phút):** Phân tích cơ hội việc làm và thách thức."},{"x":"**Phần IV (2 phút):** Chia sẻ thông tin cơ sở đào tạo và chương trình học uy tín."},{"x":"**Phần V (1 phút):** Kết luận và đề xuất phát triển."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Career Workshop`: Hội thảo hướng nghiệp."},{"x":"`Electronic Medical Record (EMR)`: Bệnh án điện tử."},{"x":"`Presentation Structure`: Dàn ý bài thuyết trình báo cáo."}]}],"ex":[{"t":"ul","i":[{"x":"Nhóm học sinh xây dựng bài trình chiếu Slide giới thiệu về \"Vai trò của Kỹ sư CNTT trong Y tế thông minh\" và báo cáo trước lớp."}]}],"steps":[{"t":"ul","i":[{"x":"**B1 (Lập dàn ý):** Phân công nhiệm vụ cho các thành viên trong nhóm."},{"x":"**B2 (Thu thập thông tin):** Tìm kiếm trên trang web chính thức của các trường Đại học (Bách Khoa, Quốc Gia) và tin tuyển dụng."},{"x":"**B3 (Tổng hợp & Thiết kế Slide):** Biên tập nội dung, chèn biểu đồ/ảnh minh họa vào phần mềm trình chiếu (PowerPoint/Google Slides)."},{"x":"**B4 (Báo cáo thử):** Thuyết trình thử nghiệm, góp ý và hoàn thiện bài báo cáo."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi Slide quá nhiều chữ, nói vượt quá thời lượng quy định:**"},{"x":"**Khắc phục:** Sử dụng sơ đồ, từ khóa ngắn gọn trên Slide và phân bổ thời gian chuẩn cho từng phần (1-2 phút/mục)."}]}],"rem":[{"t":"ul","i":[{"x":"Nhân lực CNTT hiện diện ở mọi lĩnh vực đời sống; kỹ năng thu thập thông tin và thuyết trình giúp định hướng nghề nghiệp hiệu quả."}]}]},"terms":[{"t":"Career Workshop","d":"Hội thảo hướng nghiệp."},{"t":"Electronic Medical Record (EMR)","d":"Bệnh án điện tử."},{"t":"Presentation Structure","d":"Dàn ý bài thuyết trình báo cáo."}],"txt":"**Kiến thức:** Nêu được tên một số ngành nghề và lĩnh vực có sử dụng nhân lực CNTT; giải thích vai trò của chuyên viên CNTT trong Y tế, Sản xuất, Khoa học xã hội; thu thập thông tin đào tạo và tổ chức bài trình bày hội thảo. **Năng lực:** Thu thập, chọn lọc thông tin hướng nghiệp và thuyết trình báo cáo. **Phẩm chất:** Chủ động, tự tin, phát huy tinh thần hợp tác nhóm. **Ứng dụng nhân lực CNTT trong các ngành nghề xã hội:** **Y tế:** Quản lý bệnh án điện tử (EMR), cổng thông tin y tế, vận hành thiết bị chẩn đoán hình ảnh số. **Sản xuất & Công nghiệp:** Triển khai hệ thống điều khiển tự động hóa, Internet vạn vật công nghiệp (IIoT), tối ưu hóa quy trình chuỗi cung ứng. **Khoa học xã hội & Nhân văn:** Phân tích dữ liệu lớn (Big Data) khảo sát dư luận xã hội, mô hình hóa hiện tượng nhân học. **Cấu trúc chuẩn của một bài trình bày Hội thảo Hướng nghiệp (10 phút):** **Phần I (1 phút):** Giới thiệu lĩnh vực và tầm quan trọng của CNTT. **Phần II (2 phút):** Vai trò và công việc chính của chuyên viên CNTT trong lĩnh vực đó. **Phần III (2 phút):** Phân tích cơ hội việc làm và thách thức. **Phần IV (2 phút):** Chia sẻ thông tin cơ sở đào tạo và chương trình học uy tín. **Phần V (1 phút):** Kết luận và đề xuất phát triển. `Career Workshop`: Hội thảo hướng nghiệp. `Electronic Medical Record (EMR)`: Bệnh án điện tử. `Presentation Structure`: Dàn ý bài thuyết trình báo cáo. Nhóm học sinh xây dựng bài trình chiếu Slide giới thiệu về \"Vai trò của Kỹ sư CNTT trong Y tế thông minh\" và báo cáo trước lớp. **B1 (Lập dàn ý):** Phân công nhiệm vụ cho các thành viên trong nhóm. **B2 (Thu thập thông tin):** Tìm kiếm trên trang web chính thức của các trường Đại học (Bách Khoa, Quốc Gia) và tin tuyển dụng. **B3 (Tổng hợp & Thiết kế Slide):** Biên tập nội dung, chèn biểu đồ/ảnh minh họa vào phần mềm trình chiếu (PowerPoint/Google Slides). **B4 (Báo cáo thử):** Thuyết trình thử nghiệm, góp ý và hoàn thiện bài báo cáo. **Lỗi Slide quá nhiều chữ, nói vượt quá thời lượng quy định:** **Khắc phục:** Sử dụng sơ đồ, từ khóa ngắn gọn trên Slide và phân bổ thời gian chuẩn cho từng phần (1-2 phút/mục). Nhân lực CNTT hiện diện ở mọi lĩnh vực đời sống; kỹ năng thu thập thông tin và thuyết trình giúp định hướng nghề nghiệp hiệu quả."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B22"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Kết nối được máy tính với một số thiết bị số thông dụng (Máy chiếu, Tivi, Điện thoại thông minh, Thiết bị nhà thông minh IoT) qua cổng kết nối có dây (HDMI, VGA, USB) và không dây (Bluetooth, Wi-Fi Direct, Miracast)."},{"x":"**Năng lực:** Kết nối và thao tác điều khiển thiết bị số thành thạo."},{"x":"**Phẩm chất:** Trách nhiệm, cẩn thận với thiết bị điện tử đắt tiền."}]}],"key":[{"t":"ul","i":[{"x":"**Các chuẩn kết nối có dây thông dụng:**","c":[{"x":"**HDMI / DisplayPort:** Truyền đồng thời cả hình ảnh chất lượng cao và âm thanh số."},{"x":"**VGA:** Chỉ truyền tín hiệu hình ảnh tương tự (Analog - cổng màu xanh lá/xanh dương cũ)."},{"x":"**USB / Type-C:** Truyền dữ liệu đa năng và cấp nguồn điện."}]},{"x":"**Kết nối không dây & Thiết bị nhà thông minh (Smart Home):**","c":[{"x":"**Miracast / AirPlay / Chromecast:** Trình chiếu màn hình máy tính/điện thoại không dây lên Tivi/Máy chiếu qua mạng Wi-Fi."},{"x":"**Thiết bị nhà thông minh (IoT):** Đèn thông minh, camera, cảm biến kết nối vào Wi-Fi gia đình và điều khiển từ xa qua ứng dụng di động hoặc đám mây (Cloud)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`HDMI / VGA / USB-C`: Các chuẩn cáp kết nối hiển thị và dữ liệu."},{"x":"`Wireless Display / Miracast`: Trình chiếu màn hình không dây."},{"x":"`Smart Home / IoT`: Nhà thông minh và kết nối Internet vạn vật."}]}],"ex":[{"t":"ul","i":[{"x":"Thực hành bấm tổ hợp phím `Windows + P` trên máy tính để chọn chế độ hiển thị màn hình mở rộng (Duplicate / Extend / Second screen only) lên Tivi qua cáp HDMI."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Cắm cáp HDMI nối từ máy tính sang Tivi/Máy chiếu."},{"x":"**B2:** Chọn đúng nguồn tín hiệu đầu vào (Input/Source: HDMI 1) trên Tivi."},{"x":"**B3:** Trên máy tính, nhấn `Windows + P` -> Chọn `Extend` (mở rộng không gian làm việc) hoặc `Duplicate` (sao chép màn hình)."},{"x":"**B4:** Tùy chỉnh độ phân giải màn hình trong `Display Settings` nếu cần."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi Tivi hiển thị hình ảnh nhưng không có tiếng:** Tín hiệu âm thanh chưa được chuyển hướng sang cổng HDMI."},{"x":"**Khắc phục:** Vào `Sound Settings` trên Windows -> Chọn Output Device là tên Tivi HDMI thay vì Speakers máy tính."}]}],"rem":[{"t":"ul","i":[{"x":"Kết nối thiết bị số bằng cáp (HDMI/VGA) hoặc không dây; dùng `Windows + P` để thiết lập chế độ trình chiếu màn hình."}]}]},"terms":[{"t":"HDMI / VGA / USB-C","d":"Các chuẩn cáp kết nối hiển thị và dữ liệu."},{"t":"Wireless Display / Miracast","d":"Trình chiếu màn hình không dây."},{"t":"Smart Home / IoT","d":"Nhà thông minh và kết nối Internet vạn vật."}],"txt":"**Kiến thức:** Kết nối được máy tính với một số thiết bị số thông dụng (Máy chiếu, Tivi, Điện thoại thông minh, Thiết bị nhà thông minh IoT) qua cổng kết nối có dây (HDMI, VGA, USB) và không dây (Bluetooth, Wi-Fi Direct, Miracast). **Năng lực:** Kết nối và thao tác điều khiển thiết bị số thành thạo. **Phẩm chất:** Trách nhiệm, cẩn thận với thiết bị điện tử đắt tiền. **Các chuẩn kết nối có dây thông dụng:** **HDMI / DisplayPort:** Truyền đồng thời cả hình ảnh chất lượng cao và âm thanh số. **VGA:** Chỉ truyền tín hiệu hình ảnh tương tự (Analog - cổng màu xanh lá/xanh dương cũ). **USB / Type-C:** Truyền dữ liệu đa năng và cấp nguồn điện. **Kết nối không dây & Thiết bị nhà thông minh (Smart Home):** **Miracast / AirPlay / Chromecast:** Trình chiếu màn hình máy tính/điện thoại không dây lên Tivi/Máy chiếu qua mạng Wi-Fi. **Thiết bị nhà thông minh (IoT):** Đèn thông minh, camera, cảm biến kết nối vào Wi-Fi gia đình và điều khiển từ xa qua ứng dụng di động hoặc đám mây (Cloud). `HDMI / VGA / USB-C`: Các chuẩn cáp kết nối hiển thị và dữ liệu. `Wireless Display / Miracast`: Trình chiếu màn hình không dây. `Smart Home / IoT`: Nhà thông minh và kết nối Internet vạn vật. Thực hành bấm tổ hợp phím `Windows + P` trên máy tính để chọn chế độ hiển thị màn hình mở rộng (Duplicate / Extend / Second screen only) lên Tivi qua cáp HDMI. **B1:** Cắm cáp HDMI nối từ máy tính sang Tivi/Máy chiếu. **B2:** Chọn đúng nguồn tín hiệu đầu vào (Input/Source: HDMI 1) trên Tivi. **B3:** Trên máy tính, nhấn `Windows + P` -> Chọn `Extend` (mở rộng không gian làm việc) hoặc `Duplicate` (sao chép màn hình). **B4:** Tùy chỉnh độ phân giải màn hình trong `Display Settings` nếu cần. **Lỗi Tivi hiển thị hình ảnh nhưng không có tiếng:** Tín hiệu âm thanh chưa được chuyển hướng sang cổng HDMI. **Khắc phục:** Vào `Sound Settings` trên Windows -> Chọn Output Device là tên Tivi HDMI thay vì Speakers máy tính. Kết nối thiết bị số bằng cáp (HDMI/VGA) hoặc không dây; dùng `Windows + P` để thiết lập chế độ trình chiếu màn hình."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B23"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Nhận thức được các thành phần chính của trang web (Header, Navigation, Body, Footer, Logo, Favicon); nắm vững các bước chuẩn bị và thiết kế một trang web."},{"x":"**Năng lực:** Khảo sát nhu cầu, định hình ý tưởng và phác thảo thiết kế website."},{"x":"**Phẩm chất:** Đam mê sáng tạo, tư duy tổ chức khoa học."}]}],"key":[{"t":"ul","i":[{"x":"**Các thành phần cấu tạo chính của trang web:**","c":[{"x":"**Phần đầu trang (Header):** Chứa Logo, tên trang web, khẩu hiệu (Slogan), Favicon (biểu tượng đại diện trên tab trình duyệt)."},{"x":"**Thanh điều hướng (Navigation Bar):** Bảng chọn liên kết đến các trang nội dung khác nhau."},{"x":"**Phần thân trang (Body / Content):** Chứa nội dung chính (văn bản, hình ảnh, video, bài viết)."},{"x":"**Phần chân trang (Footer):** Chứa thông tin bản quyền, cơ quan chủ quản, địa chỉ liên hệ, sơ đồ trang (Sitemap)."}]},{"x":"**Quy trình chuẩn bị xây dựng trang web (3 bước):**","c":[{"x":"**Bước 1: Định hình ý tưởng & Khảo sát nhu cầu:** Xác định rõ mục đích, đối tượng người dùng phục vụ và thông tin cốt lõi."},{"x":"**Bước 2: Thiết kế nội dung & Thiết kế mỹ thuật:** Lập sơ đồ kiến trúc trang, chọn bảng màu phối (Color Palette), phông chữ phù hợp (Sans-serif cho bảng chọn), phác thảo giao diện trên giấy."},{"x":"**Bước 3: Thu thập và chuẩn bị tư liệu:** Chuẩn bị sẵn tài nguyên văn bản, hình ảnh, video đã tối dung lượng."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Favicon`: Biểu tượng nhỏ hiển thị trước tiêu đề trang web trên tab trình duyệt."},{"x":"`Header / Footer / Navigation`: Các khối phần phần đầu, chân và thanh điều hướng."},{"x":"`Web Design Process`: Quy trình thiết kế website (Ý tưởng -> Thiết kế mỹ thuật -> Tư liệu -> Xây dựng)."}]}],"ex":[{"t":"ul","i":[{"x":"Phân tích giao diện website 24h hoặc Cổng thông tin Tổng cục Du lịch Việt Nam để chỉ ra chính xác vị trí Logo, Favicon, Thanh điều hướng và thông tin bản quyền Footer."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Lựa chọn đề tài dự án (VD: \"Những bài ca đi cùng năm tháng\")."},{"x":"**B2:** Xác định danh sách các trang con cần tạo (Trang chủ, Nhạc cách mạng, Nhạc trữ tình, Ca sĩ yêu thích)."},{"x":"**B3:** Vẽ sơ đồ phác thảo bố cục (Wireframe) trang chủ ra giấy."},{"x":"**B4:** Thu thập sẵn ảnh và bài viết lưu vào thư mục máy tính."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi bắt tay ngay vào làm trang web khi chưa chuẩn bị tư liệu:** Dẫn đến trang web bị ngắt quãng, thiếu nội dung và màu sắc rối mắt."},{"x":"**Khắc phục:** Bắt buộc hoàn thiện khâu phác thảo thiết kế và chuẩn bị đủ tư liệu trước khi mở phần mềm làm web."}]}],"rem":[{"t":"ul","i":[{"x":"Trang web gồm Header, Nav, Body, Footer; quy trình tạo web gồm Định hình ý tưởng -> Thiết kế mỹ thuật -> Thu thập tư liệu -> Xây dựng."}]}]},"terms":[{"t":"Favicon","d":"Biểu tượng nhỏ hiển thị trước tiêu đề trang web trên tab trình duyệt."},{"t":"Header / Footer / Navigation","d":"Các khối phần phần đầu, chân và thanh điều hướng."},{"t":"Web Design Process","d":"Quy trình thiết kế website (Ý tưởng -> Thiết kế mỹ thuật -> Tư liệu -> Xây dựng)."}],"txt":"**Kiến thức:** Nhận thức được các thành phần chính của trang web (Header, Navigation, Body, Footer, Logo, Favicon); nắm vững các bước chuẩn bị và thiết kế một trang web. **Năng lực:** Khảo sát nhu cầu, định hình ý tưởng và phác thảo thiết kế website. **Phẩm chất:** Đam mê sáng tạo, tư duy tổ chức khoa học. **Các thành phần cấu tạo chính của trang web:** **Phần đầu trang (Header):** Chứa Logo, tên trang web, khẩu hiệu (Slogan), Favicon (biểu tượng đại diện trên tab trình duyệt). **Thanh điều hướng (Navigation Bar):** Bảng chọn liên kết đến các trang nội dung khác nhau. **Phần thân trang (Body / Content):** Chứa nội dung chính (văn bản, hình ảnh, video, bài viết). **Phần chân trang (Footer):** Chứa thông tin bản quyền, cơ quan chủ quản, địa chỉ liên hệ, sơ đồ trang (Sitemap). **Quy trình chuẩn bị xây dựng trang web (3 bước):** **Bước 1: Định hình ý tưởng & Khảo sát nhu cầu:** Xác định rõ mục đích, đối tượng người dùng phục vụ và thông tin cốt lõi. **Bước 2: Thiết kế nội dung & Thiết kế mỹ thuật:** Lập sơ đồ kiến trúc trang, chọn bảng màu phối (Color Palette), phông chữ phù hợp (Sans-serif cho bảng chọn), phác thảo giao diện trên giấy. **Bước 3: Thu thập và chuẩn bị tư liệu:** Chuẩn bị sẵn tài nguyên văn bản, hình ảnh, video đã tối dung lượng. `Favicon`: Biểu tượng nhỏ hiển thị trước tiêu đề trang web trên tab trình duyệt. `Header / Footer / Navigation`: Các khối phần phần đầu, chân và thanh điều hướng. `Web Design Process`: Quy trình thiết kế website (Ý tưởng -> Thiết kế mỹ thuật -> Tư liệu -> Xây dựng). Phân tích giao diện website 24h hoặc Cổng thông tin Tổng cục Du lịch Việt Nam để chỉ ra chính xác vị trí Logo, Favicon, Thanh điều hướng và thông tin bản quyền Footer. **B1:** Lựa chọn đề tài dự án (VD: \"Những bài ca đi cùng năm tháng\"). **B2:** Xác định danh sách các trang con cần tạo (Trang chủ, Nhạc cách mạng, Nhạc trữ tình, Ca sĩ yêu thích). **B3:** Vẽ sơ đồ phác thảo bố cục (Wireframe) trang chủ ra giấy. **B4:** Thu thập sẵn ảnh và bài viết lưu vào thư mục máy tính. **Lỗi bắt tay ngay vào làm trang web khi chưa chuẩn bị tư liệu:** Dẫn đến trang web bị ngắt quãng, thiếu nội dung và màu sắc rối mắt. **Khắc phục:** Bắt buộc hoàn thiện khâu phác thảo thiết kế và chuẩn bị đủ tư liệu trước khi mở phần mềm làm web. Trang web gồm Header, Nav, Body, Footer; quy trình tạo web gồm Định hình ý tưởng -> Thiết kế mỹ thuật -> Thu thập tư liệu -> Xây dựng."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B24"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Hiểu cách tiếp cận và giao diện tương tác người dùng của Google Sites; khởi tạo tệp trang web trên Google Drive, làm phần đầu trang (Header), tải Logo, Favicon, xuất bản (Publish) và phân quyền làm việc nhóm."},{"x":"**Năng lực:** Sử dụng phần mềm Google Sites tạo phần đầu trang web chuẩn mỹ thuật."},{"x":"**Phẩm chất:** Tích cực hợp tác nhóm trực tuyến trên môi trường Google Drive."}]}],"key":[{"t":"ul","i":[{"x":"**Đặc điểm của Google Sites:** Công cụ tạo trang web trực tuyến miễn phí của Google, lưu trữ tự động trên Google Drive, giao diện kéo thả trực quan, tự động tối thích ứng giao diện (Responsive) trên điện thoại/máy tính bảng."},{"x":"**Các bước xây dựng phần đầu trang bằng Google Sites:**","c":[{"x":"Đăng nhập Google Drive -> Chọn `Mới` (New) -> `Ứng dụng khác` (More) -> `Google Sites`."},{"x":"Nhập tên tệp lưu trữ dự án trang web trên Google Drive."},{"x":"Nhập tên trang web (Site name) và Tiêu đề trang (Page title)."},{"x":"Tải lên ảnh Logo và ảnh Favicon trong mục `Cài đặt` (Settings) -> `Hình ảnh thương hiệu` (Brand images)."},{"x":"Thay đổi ảnh nền phần đầu trang (Header background image) và chọn loại biểu banner (`Chỉ tiêu đề`, `Biểu banner nhỏ`, `Biểu banner lớn`, `Bìa`)."}]},{"x":"**Xuất bản & Phân quyền hợp tác:**","c":[{"x":"**Chia sẻ hợp tác:** Thêm email bạn bè vào biểu tượng `Chia sẻ với người khác` để cùng thiết kế."},{"x":"**Xuất bản (Publish):** Đặt địa chỉ web (Web address) và bấm `Xuất bản` để công khai trang web lên Internet."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Google Sites`: Công cụ thiết kế trang web trực tuyến của Google."},{"x":"`Header Banner Types`: Các loại biểu banner đầu trang."},{"x":"`Publishing`: Công bố xuất bản trang web lên Internet."},{"x":"`Collaborative Editing`: Chế độ đồng chỉnh sửa trực tuyến qua Google Drive."}]}],"ex":[{"t":"ul","i":[{"x":"Xây dựng phần đầu trang cho dự án \"Những bài ca đi cùng năm tháng\": Tải ảnh hoa sen làm Logo, đặt tiêu đề \"NHỮNG BÀI CA ĐI CÙNG NĂM THÁNG\", chọn ảnh phong cảnh Việt Nam làm biểu banner lớn."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở Google Sites từ Google Drive."},{"x":"**B2:** Đặt tên tệp lưu trữ: `Nhung_bai_ca_nam_thang`."},{"x":"**B3:** Bấm `Thêm logo` -> Tải ảnh logo lên. Bấm `Cài đặt` -> `Favicon` -> Tải ảnh favicon."},{"x":"**B4:** Bấm `Thay đổi hình ảnh` phần Header -> Tải ảnh nền phù hợp."},{"x":"**B5:** Bấm nút `Xuất bản` -> Đặt tên miền con -> Bấm `Xuất bản`."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi người khác không truy cập được vào trang web đã xuất bản:** Do chưa phân quyền công khai cho mọi người."},{"x":"**Khắc phục:** Vào biểu tượng `Chia sẻ` -> Mục `Trang web đã xuất bản` -> Chuyển từ `Hạn chế` sang `Công khai` (Public)."}]}],"rem":[{"t":"ul","i":[{"x":"Google Sites tự động lưu trên Google Drive; phần đầu trang gồm Tên web, Logo, Favicon và Tiêu đề; bấm `Xuất bản` để công khai trang web."}]}]},"terms":[{"t":"Google Sites","d":"Công cụ thiết kế trang web trực tuyến của Google."},{"t":"Header Banner Types","d":"Các loại biểu banner đầu trang."},{"t":"Publishing","d":"Công bố xuất bản trang web lên Internet."},{"t":"Collaborative Editing","d":"Chế độ đồng chỉnh sửa trực tuyến qua Google Drive."}],"txt":"**Kiến thức:** Hiểu cách tiếp cận và giao diện tương tác người dùng của Google Sites; khởi tạo tệp trang web trên Google Drive, làm phần đầu trang (Header), tải Logo, Favicon, xuất bản (Publish) và phân quyền làm việc nhóm. **Năng lực:** Sử dụng phần mềm Google Sites tạo phần đầu trang web chuẩn mỹ thuật. **Phẩm chất:** Tích cực hợp tác nhóm trực tuyến trên môi trường Google Drive. **Đặc điểm của Google Sites:** Công cụ tạo trang web trực tuyến miễn phí của Google, lưu trữ tự động trên Google Drive, giao diện kéo thả trực quan, tự động tối thích ứng giao diện (Responsive) trên điện thoại/máy tính bảng. **Các bước xây dựng phần đầu trang bằng Google Sites:** Đăng nhập Google Drive -> Chọn `Mới` (New) -> `Ứng dụng khác` (More) -> `Google Sites`. Nhập tên tệp lưu trữ dự án trang web trên Google Drive. Nhập tên trang web (Site name) và Tiêu đề trang (Page title). Tải lên ảnh Logo và ảnh Favicon trong mục `Cài đặt` (Settings) -> `Hình ảnh thương hiệu` (Brand images). Thay đổi ảnh nền phần đầu trang (Header background image) và chọn loại biểu banner (`Chỉ tiêu đề`, `Biểu banner nhỏ`, `Biểu banner lớn`, `Bìa`). **Xuất bản & Phân quyền hợp tác:** **Chia sẻ hợp tác:** Thêm email bạn bè vào biểu tượng `Chia sẻ với người khác` để cùng thiết kế. **Xuất bản (Publish):** Đặt địa chỉ web (Web address) và bấm `Xuất bản` để công khai trang web lên Internet. `Google Sites`: Công cụ thiết kế trang web trực tuyến của Google. `Header Banner Types`: Các loại biểu banner đầu trang. `Publishing`: Công bố xuất bản trang web lên Internet. `Collaborative Editing`: Chế độ đồng chỉnh sửa trực tuyến qua Google Drive. Xây dựng phần đầu trang cho dự án \"Những bài ca đi cùng năm tháng\": Tải ảnh hoa sen làm Logo, đặt tiêu đề \"NHỮNG BÀI CA ĐI CÙNG NĂM THÁNG\", chọn ảnh phong cảnh Việt Nam làm biểu banner lớn. **B1:** Mở Google Sites từ Google Drive. **B2:** Đặt tên tệp lưu trữ: `Nhung_bai_ca_nam_thang`. **B3:** Bấm `Thêm logo` -> Tải ảnh logo lên. Bấm `Cài đặt` -> `Favicon` -> Tải ảnh favicon. **B4:** Bấm `Thay đổi hình ảnh` phần Header -> Tải ảnh nền phù hợp. **B5:** Bấm nút `Xuất bản` -> Đặt tên miền con -> Bấm `Xuất bản`. **Lỗi người khác không truy cập được vào trang web đã xuất bản:** Do chưa phân quyền công khai cho mọi người. **Khắc phục:** Vào biểu tượng `Chia sẻ` -> Mục `Trang web đã xuất bản` -> Chuyển từ `Hạn chế` sang `Công khai` (Public). Google Sites tự động lưu trên Google Drive; phần đầu trang gồm Tên web, Logo, Favicon và Tiêu đề; bấm `Xuất bản` để công khai trang web."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B25"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Biết cách xây dựng phần nội dung thân trang và phần chân trang (Footer) với sự hỗ trợ của Google Sites; sử dụng các khối nội dung Layout, chèn văn bản, hình ảnh, video YouTube, tệp Google Drive."},{"x":"**Năng lực:** Thiết kế bố cục nội dung trang web phong phú, cân đối."},{"x":"**Phẩm chất:** Tỉ mỉ, có tính thẩm mỹ trong sắp xếp bố cục."}]}],"key":[{"t":"ul","i":[{"x":"**Xây dựng phần thân trang (Body/Content) bằng Google Sites:**","c":[{"x":"**Sử dụng bảng chọn `Chèn` (Insert):**","c":[{"x":"**Hộp văn bản (Text box):** Chèn đoạn văn bản, tiêu đề."},{"x":"**Hình ảnh (Images):** Tải ảnh từ máy tính hoặc Google Drive."},{"x":"**Khối nội dung (Content Blocks / Layouts):** Các mẫu bố cục có sẵn (1 ảnh + văn bản, 2 ảnh + văn bản, 3 ảnh...)."},{"x":"**Các phần tử nhúng:** Nhúng liên kết URL, mã HTML, Video YouTube, Bản đồ (Google Maps), Tài liệu (Google Docs/Forms)."}]},{"x":"**Thao tác kéo thả (Drag and Drop):** Thay đổi vị trí, kích thước, di chuyển các khối nội dung linh hoạt trên lưới giao diện."}]},{"x":"**Xây dựng phần chân trang (Footer):**","c":[{"x":"Di chuyển con trỏ chuột xuống cuối trang -> Bấm `Thêm chân trang` (Add footer)."},{"x":"Nhập thông tin bản quyền, địa chỉ liên hệ, email. Phần chân trang này sẽ tự động xuất hiện ở tất cả các trang con của website."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Content Blocks / Layouts`: Khối mẫu bố cục nội dung dựng sẵn."},{"x":"`Embed`: Nhúng video YouTube, Google Forms, bản đồ vào trang web."},{"x":"`Footer`: Phần chân trang hiển thị cố định toàn trang."}]}],"ex":[{"t":"ul","i":[{"x":"Chèn khối nội dung 2 cột cho bài ca \"Tiến quân ca\": Cột trái chèn ảnh nhạc sĩ Văn Cao, cột phải chèn lời bài hát và video phát nhạc YouTube."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở trang web dự án trong Google Sites."},{"x":"**B2:** Trong bảng chọn `Chèn`, nháy chọn mẫu `Khối nội dung` (2 khung)."},{"x":"**B3:** Tải ảnh minh họa vào khung trái, nhập văn bản giới thiệu vào khung phải."},{"x":"**B4:** Nháy chọn `YouTube` -> Tìm kiếm video bài hát -> Chèn vào trang."},{"x":"**B5:** Rê chuột xuống cuối trang -> Nhấp `Thêm chân trang` -> Nhập nội dung thông tin liên hệ."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi video YouTube hoặc tệp Google Drive nhúng không xem được từ máy người khác:** Do tệp lưu trên Drive chưa được mở quyền xem công khai."},{"x":"**Khắc phục:** Mở Google Drive -> Chọn tệp video/tài liệu -> Bật quyền `Ai có liên kết cũng có thể xem`."}]}],"rem":[{"t":"ul","i":[{"x":"Google Sites hỗ trợ các `Khối nội dung` có sẵn để chèn văn bản, ảnh, video YouTube; `Chân trang` hiển thị đồng bộ trên mọi trang con."}]}]},"terms":[{"t":"Content Blocks / Layouts","d":"Khối mẫu bố cục nội dung dựng sẵn."},{"t":"Embed","d":"Nhúng video YouTube, Google Forms, bản đồ vào trang web."},{"t":"Footer","d":"Phần chân trang hiển thị cố định toàn trang."}],"txt":"**Kiến thức:** Biết cách xây dựng phần nội dung thân trang và phần chân trang (Footer) với sự hỗ trợ của Google Sites; sử dụng các khối nội dung Layout, chèn văn bản, hình ảnh, video YouTube, tệp Google Drive. **Năng lực:** Thiết kế bố cục nội dung trang web phong phú, cân đối. **Phẩm chất:** Tỉ mỉ, có tính thẩm mỹ trong sắp xếp bố cục. **Xây dựng phần thân trang (Body/Content) bằng Google Sites:** **Sử dụng bảng chọn `Chèn` (Insert):** **Hộp văn bản (Text box):** Chèn đoạn văn bản, tiêu đề. **Hình ảnh (Images):** Tải ảnh từ máy tính hoặc Google Drive. **Khối nội dung (Content Blocks / Layouts):** Các mẫu bố cục có sẵn (1 ảnh + văn bản, 2 ảnh + văn bản, 3 ảnh...). **Các phần tử nhúng:** Nhúng liên kết URL, mã HTML, Video YouTube, Bản đồ (Google Maps), Tài liệu (Google Docs/Forms). **Thao tác kéo thả (Drag and Drop):** Thay đổi vị trí, kích thước, di chuyển các khối nội dung linh hoạt trên lưới giao diện. **Xây dựng phần chân trang (Footer):** Di chuyển con trỏ chuột xuống cuối trang -> Bấm `Thêm chân trang` (Add footer). Nhập thông tin bản quyền, địa chỉ liên hệ, email. Phần chân trang này sẽ tự động xuất hiện ở tất cả các trang con của website. `Content Blocks / Layouts`: Khối mẫu bố cục nội dung dựng sẵn. `Embed`: Nhúng video YouTube, Google Forms, bản đồ vào trang web. `Footer`: Phần chân trang hiển thị cố định toàn trang. Chèn khối nội dung 2 cột cho bài ca \"Tiến quân ca\": Cột trái chèn ảnh nhạc sĩ Văn Cao, cột phải chèn lời bài hát và video phát nhạc YouTube. **B1:** Mở trang web dự án trong Google Sites. **B2:** Trong bảng chọn `Chèn`, nháy chọn mẫu `Khối nội dung` (2 khung). **B3:** Tải ảnh minh họa vào khung trái, nhập văn bản giới thiệu vào khung phải. **B4:** Nháy chọn `YouTube` -> Tìm kiếm video bài hát -> Chèn vào trang. **B5:** Rê chuột xuống cuối trang -> Nhấp `Thêm chân trang` -> Nhập nội dung thông tin liên hệ. **Lỗi video YouTube hoặc tệp Google Drive nhúng không xem được từ máy người khác:** Do tệp lưu trên Drive chưa được mở quyền xem công khai. **Khắc phục:** Mở Google Drive -> Chọn tệp video/tài liệu -> Bật quyền `Ai có liên kết cũng có thể xem`. Google Sites hỗ trợ các `Khối nội dung` có sẵn để chèn văn bản, ảnh, video YouTube; `Chân trang` hiển thị đồng bộ trên mọi trang con."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B26"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Biết cách tạo các trang con (Pages), tạo liên kết giữa các trang và thiết lập bảng chọn trên thanh điều hướng (Navigation Bar) bằng Google Sites."},{"x":"**Năng lực:** Tổ chức cấu trúc cây thư mục trang web khoa học, tạo trải nghiệm điều hướng thuận tiện cho người dùng."},{"x":"**Phẩm chất:** Nâng cao nhận thức về tính tổ chức khoa học trong học tập và công việc."}]}],"key":[{"t":"ul","i":[{"x":"**Quản lý trang và tạo trang con trong Google Sites:**","c":[{"x":"Bảng chọn `Trang` (Pages): Dùng để tạo mới, sắp xếp thứ tự và quản lý hệ thống các trang web trong website."},{"x":"**Tạo trang con (Subpage):** Nháy vào dấu ba chấm `⋮` bên cạnh tên trang chủ/trang cha -> Chọn `Thêm trang con` (Add subpage)."},{"x":"**Cấu trúc hình cây (Tree structure):** Giúp phân cấp thông tin rõ ràng (Trang chủ -> Trang cấp 1 -> Trang cấp 2). Tránh tạo quá nhiều cấp làm người dùng bị rối."}]},{"x":"**Thiết lập Thanh điều hướng (Navigation Settings):**","c":[{"x":"Tự động sinh ra dựa trên danh sách các trang trong bảng chọn `Trang`."},{"x":"**Vị trí hiển thị bảng chọn:**","c":[{"x":"**Đầu (Top):** Bảng chọn hiển thị nằm ngang ở phần đầu trang web (phù hợp giao diện máy tính)."},{"x":"**Bên (Side):** Bảng chọn thu gọn dạng biểu tượng 3 dấu gạch ngang (Hamburger menu) ở góc trái (phù hợp giao diện điện thoại di động)."}]}]},{"x":"**Tạo đường liên kết nội bộ và bên ngoài:**","c":[{"x":"Bôi đen đoạn văn bản hoặc chọn hình ảnh -> Bấm biểu tượng `Chèn liên kết` (Link) -> Chọn trang nội bộ trong danh sách hoặc dán URL trang ngoài."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Pages Panel`: Bảng chọn quản lý trang."},{"x":"`Subpage`: Trang con cấp dưới."},{"x":"`Top Navigation vs Side Navigation`: Thanh điều hướng vị trí Đầu vs Bên."},{"x":"`Internal Link`: Đường liên kết nội bộ giữa các trang trong website."}]}],"ex":[{"t":"ul","i":[{"x":"Tạo trang con \"Tây Nguyên\" thuộc Trang chủ, sau đó tạo trang con \"Bản Đôn\" thuộc trang \"Tây Nguyên\". Viết đoạn giới thiệu Bản Đôn ở trang chủ và chèn liên kết trỏ tới trang Bản Đôn."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở bảng chọn `Trang` ở cột bên phải."},{"x":"**B2:** Nhấp dấu `+` -> Nhập tên \"Nhạc cách mạng\" để tạo trang cấp 1."},{"x":"**B3:** Nhấp `⋮` tại \"Nhạc cách mạng\" -> `Thêm trang con` -> Nhập \"Tiến quân ca\"."},{"x":"**B4:** Vào `Cài đặt` (Settings) -> `Điều hướng` -> Chọn Chế độ `Đầu` hoặc `Bên`."},{"x":"**B5:** Quay về Trang chủ, bôi đen cụm từ \"Tiến quân ca\" -> Bấm biểu tượng Chèn liên kết -> Chọn trang \"Tiến quân ca\"."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi tạo quá nhiều cấp trang con làm thanh điều hướng bị quá tải:**"},{"x":"**Khắc phục:** Chỉ nên tổ chức tối đa 2-3 cấp trang con để giao diện gọn gàng, dễ truy cập."}]}],"rem":[{"t":"ul","i":[{"x":"Bảng chọn `Trang` dùng tạo trang con; Thanh điều hướng có thể đặt ở vị trí `Đầu` hoặc `Bên`; tạo liên kết trỏ chính xác giữa các trang."}]}]},"terms":[{"t":"Pages Panel","d":"Bảng chọn quản lý trang."},{"t":"Subpage","d":"Trang con cấp dưới."},{"t":"Top Navigation vs Side Navigation","d":"Thanh điều hướng vị trí Đầu vs Bên."},{"t":"Internal Link","d":"Đường liên kết nội bộ giữa các trang trong website."}],"txt":"**Kiến thức:** Biết cách tạo các trang con (Pages), tạo liên kết giữa các trang và thiết lập bảng chọn trên thanh điều hướng (Navigation Bar) bằng Google Sites. **Năng lực:** Tổ chức cấu trúc cây thư mục trang web khoa học, tạo trải nghiệm điều hướng thuận tiện cho người dùng. **Phẩm chất:** Nâng cao nhận thức về tính tổ chức khoa học trong học tập và công việc. **Quản lý trang và tạo trang con trong Google Sites:** Bảng chọn `Trang` (Pages): Dùng để tạo mới, sắp xếp thứ tự và quản lý hệ thống các trang web trong website. **Tạo trang con (Subpage):** Nháy vào dấu ba chấm `⋮` bên cạnh tên trang chủ/trang cha -> Chọn `Thêm trang con` (Add subpage). **Cấu trúc hình cây (Tree structure):** Giúp phân cấp thông tin rõ ràng (Trang chủ -> Trang cấp 1 -> Trang cấp 2). Tránh tạo quá nhiều cấp làm người dùng bị rối. **Thiết lập Thanh điều hướng (Navigation Settings):** Tự động sinh ra dựa trên danh sách các trang trong bảng chọn `Trang`. **Vị trí hiển thị bảng chọn:** **Đầu (Top):** Bảng chọn hiển thị nằm ngang ở phần đầu trang web (phù hợp giao diện máy tính). **Bên (Side):** Bảng chọn thu gọn dạng biểu tượng 3 dấu gạch ngang (Hamburger menu) ở góc trái (phù hợp giao diện điện thoại di động). **Tạo đường liên kết nội bộ và bên ngoài:** Bôi đen đoạn văn bản hoặc chọn hình ảnh -> Bấm biểu tượng `Chèn liên kết` (Link) -> Chọn trang nội bộ trong danh sách hoặc dán URL trang ngoài. `Pages Panel`: Bảng chọn quản lý trang. `Subpage`: Trang con cấp dưới. `Top Navigation vs Side Navigation`: Thanh điều hướng vị trí Đầu vs Bên. `Internal Link`: Đường liên kết nội bộ giữa các trang trong website. Tạo trang con \"Tây Nguyên\" thuộc Trang chủ, sau đó tạo trang con \"Bản Đôn\" thuộc trang \"Tây Nguyên\". Viết đoạn giới thiệu Bản Đôn ở trang chủ và chèn liên kết trỏ tới trang Bản Đôn. **B1:** Mở bảng chọn `Trang` ở cột bên phải. **B2:** Nhấp dấu `+` -> Nhập tên \"Nhạc cách mạng\" để tạo trang cấp 1. **B3:** Nhấp `⋮` tại \"Nhạc cách mạng\" -> `Thêm trang con` -> Nhập \"Tiến quân ca\". **B4:** Vào `Cài đặt` (Settings) -> `Điều hướng` -> Chọn Chế độ `Đầu` hoặc `Bên`. **B5:** Quay về Trang chủ, bôi đen cụm từ \"Tiến quân ca\" -> Bấm biểu tượng Chèn liên kết -> Chọn trang \"Tiến quân ca\". **Lỗi tạo quá nhiều cấp trang con làm thanh điều hướng bị quá tải:** **Khắc phục:** Chỉ nên tổ chức tối đa 2-3 cấp trang con để giao diện gọn gàng, dễ truy cập. Bảng chọn `Trang` dùng tạo trang con; Thanh điều hướng có thể đặt ở vị trí `Đầu` hoặc `Bên`; tạo liên kết trỏ chính xác giữa các trang."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B27"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Hiểu ý nghĩa của biểu mẫu trên trang web; biết cách tạo biểu mẫu thu thập ý kiến người dùng bằng Google Forms và nhúng vào trang web Google Sites."},{"x":"**Năng lực:** Thu thập và xử lý thông tin phản hồi từ người dùng trang web."},{"x":"**Phẩm chất:** Tôn trọng ý kiến đóng góp của người đọc để cải thiện sản phẩm."}]}],"key":[{"t":"ul","i":[{"x":"**Ý nghĩa của biểu mẫu trên trang web:** Dùng để khảo sát ý kiến đánh giá, thu thập thông tin đăng ký thành viên, nhận đóng góp phản hồi từ độc giả để nâng cao chất lượng website."},{"x":"**Sử dụng Google Forms tích hợp vào Google Sites:**","c":[{"x":"**B1:** Tạo biểu mẫu khảo sát trong Google Forms (VD: Biểu mẫu \"Thu thập ý kiến đóng góp cho website\")."},{"x":"**B2:** Soạn thảo các câu hỏi: Trắc nghiệm, Hộp kiểm, Đoạn văn ngắn."},{"x":"**B3:** Mở giao diện thiết kế Google Sites -> Chọn bảng chọn `Chèn` -> Cuộn xuống chọn mục `Biểu mẫu` (Forms)."},{"x":"**B4:** Chọn tệp Google Form vừa tạo trong danh sách -> Bấm `Chèn` (Insert)."}]},{"x":"**Đặc điểm tương tác:** Người dùng muốn gửi câu trả lời trên biểu mẫu nhúng Google Form cần đăng nhập tài khoản Google (Gmail). Kết quả phản hồi sẽ tự động lưu về bảng tính Google Sheets của chủ trang web."}]}],"terms":[{"t":"ul","i":[{"x":"`Google Forms`: Công cụ tạo biểu mẫu khảo sát trực tuyến của Google."},{"x":"`Embedded Form`: Biểu mẫu được nhúng trực tiếp vào trang web."},{"x":"`Feedback Survey`: Khảo sát ý kiến phản hồi của người dùng."}]}],"ex":[{"t":"ul","i":[{"x":"Nhúng biểu mẫu \"Góp ý phát triển website Những bài ca đi cùng năm tháng\" chứa các câu hỏi: \"Bạn đánh giá thế nào về giao diện?\", \"Gợi ý bài hát bạn muốn bổ sung?\"."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Truy cập `forms.google.com` -> Tạo mẫu khảo sát mới."},{"x":"**B2:** Thêm câu hỏi \"Ý kiến đóng góp của bạn\" (dạng Đoạn văn)."},{"x":"**B3:** Mở Google Sites -> Chọn trang \"Góp ý / Liên hệ\"."},{"x":"**B4:** Bảng chọn `Chèn` -> Bấm chọn `Biểu mẫu` -> Chọn tệp khảo sát -> Bấm `Chèn`."},{"x":"**B5:** Căn chỉnh kích thước khung hiển thị biểu mẫu cho cân đối."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi biểu mẫu nhúng bị cắt mất nút \"Gửi\" (Submit):** Khung hiển thị `<iframe>` của biểu mẫu bị đặt chiều cao quá ngắn."},{"x":"**Khắc phục:** Kéo nút tròn ở viền dưới khung biểu mẫu trong Google Sites xuống dưới để mở rộng chiều cao hiển thị đầy đủ."}]}],"rem":[{"t":"ul","i":[{"x":"Tạo biểu mẫu bằng Google Forms và nhúng vào Google Sites qua bảng chọn `Chèn` -> `Biểu mẫu` để thu thập ý kiến người dùng."}]}]},"terms":[{"t":"Google Forms","d":"Công cụ tạo biểu mẫu khảo sát trực tuyến của Google."},{"t":"Embedded Form","d":"Biểu mẫu được nhúng trực tiếp vào trang web."},{"t":"Feedback Survey","d":"Khảo sát ý kiến phản hồi của người dùng."}],"txt":"**Kiến thức:** Hiểu ý nghĩa của biểu mẫu trên trang web; biết cách tạo biểu mẫu thu thập ý kiến người dùng bằng Google Forms và nhúng vào trang web Google Sites. **Năng lực:** Thu thập và xử lý thông tin phản hồi từ người dùng trang web. **Phẩm chất:** Tôn trọng ý kiến đóng góp của người đọc để cải thiện sản phẩm. **Ý nghĩa của biểu mẫu trên trang web:** Dùng để khảo sát ý kiến đánh giá, thu thập thông tin đăng ký thành viên, nhận đóng góp phản hồi từ độc giả để nâng cao chất lượng website. **Sử dụng Google Forms tích hợp vào Google Sites:** **B1:** Tạo biểu mẫu khảo sát trong Google Forms (VD: Biểu mẫu \"Thu thập ý kiến đóng góp cho website\"). **B2:** Soạn thảo các câu hỏi: Trắc nghiệm, Hộp kiểm, Đoạn văn ngắn. **B3:** Mở giao diện thiết kế Google Sites -> Chọn bảng chọn `Chèn` -> Cuộn xuống chọn mục `Biểu mẫu` (Forms). **B4:** Chọn tệp Google Form vừa tạo trong danh sách -> Bấm `Chèn` (Insert). **Đặc điểm tương tác:** Người dùng muốn gửi câu trả lời trên biểu mẫu nhúng Google Form cần đăng nhập tài khoản Google (Gmail). Kết quả phản hồi sẽ tự động lưu về bảng tính Google Sheets của chủ trang web. `Google Forms`: Công cụ tạo biểu mẫu khảo sát trực tuyến của Google. `Embedded Form`: Biểu mẫu được nhúng trực tiếp vào trang web. `Feedback Survey`: Khảo sát ý kiến phản hồi của người dùng. Nhúng biểu mẫu \"Góp ý phát triển website Những bài ca đi cùng năm tháng\" chứa các câu hỏi: \"Bạn đánh giá thế nào về giao diện?\", \"Gợi ý bài hát bạn muốn bổ sung?\". **B1:** Truy cập `forms.google.com` -> Tạo mẫu khảo sát mới. **B2:** Thêm câu hỏi \"Ý kiến đóng góp của bạn\" (dạng Đoạn văn). **B3:** Mở Google Sites -> Chọn trang \"Góp ý / Liên hệ\". **B4:** Bảng chọn `Chèn` -> Bấm chọn `Biểu mẫu` -> Chọn tệp khảo sát -> Bấm `Chèn`. **B5:** Căn chỉnh kích thước khung hiển thị biểu mẫu cho cân đối. **Lỗi biểu mẫu nhúng bị cắt mất nút \"Gửi\" (Submit):** Khung hiển thị `<iframe>` của biểu mẫu bị đặt chiều cao quá ngắn. **Khắc phục:** Kéo nút tròn ở viền dưới khung biểu mẫu trong Google Sites xuống dưới để mở rộng chiều cao hiển thị đầy đủ. Tạo biểu mẫu bằng Google Forms và nhúng vào Google Sites qua bảng chọn `Chèn` -> `Biểu mẫu` để thu thập ý kiến người dùng."};

trang trong bảng chọn `Trang`."},{"x":"**B2:** Thao tác kéo thả điều chỉnh thứ tự hiển thị các trang con trên thanh điều hướng."},{"x":"**B3:** Mở biểu tượng `Xem trước` (Preview) -> Chuyển đổi giữa chế độ Phone, Tablet và Large Screen để kiểm tra độ tương thích."},{"x":"**B4:** Nhấp nút `Xuất bản` -> Sao chép đường liên kết trang web công khai nộp bài."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi văn bản trên điện thoại bị tràn hoặc ảnh quá bé:** Do chèn khối hình ảnh tự do không theo khung Layout chuẩn."},{"x":"**Khắc phục:** Ưu tiên sử dụng các `Khối nội dung` (Content Blocks) có sẵn của Google Sites để tự động tối ưu giao diện màn hình di động."}]}],"rem":[{"t":"ul","i":[{"x":"Xây dựng website hoàn chỉnh gồm 3 bước: Chuẩn bị -> Tiến hành thiết kế -> Công bố & Hiệu chỉnh; dùng tính năng `Xem trước` kiểm tra giao diện đa thiết bị trước khi Xuất bản."}]}]},"terms":[{"t":"Full Website Development","d":"Quy trình phát triển website hoàn chỉnh."},{"t":"Preview Mode","d":"Chế độ xem trước giao diện đa thiết bị."},{"t":"Responsive Design Check","d":"Kiểm tra khả năng tương thích giao diện."}],"txt":"**Kiến thức:** Ôn tập và vận dụng tổng hợp toàn bộ quy trình và kỹ năng tạo trang web bằng Google Sites đã học từ Bài 23 đến Bài 27 để hoàn thiện một website chủ đề tự chọn hoàn chỉnh. **Năng lực:** Thiết kế và xuất bản website hoàn chỉnh phục vụ học tập/đời sống. **Phẩm chất:** Tự tin, sáng tạo, tác phong làm việc khoa học, hoàn thành sản phẩm đúng hạn. **Tóm tắt Quy trình chung 3 bước xây dựng website hoàn chỉnh với Google Sites:** **Bước 1: Chuẩn bị:** Định hình ý tưởng, xác định mục đích và đối tượng người dùng. Khảo sát cấu trúc, phác thảo sơ đồ cây các trang con. Thu thập tư liệu văn bản, hình ảnh, video, biểu mẫu. **Bước 2: Tiến hành thiết kế:** Xây dựng phần đầu trang (Header, Logo, Favicon). Xây dựng phần thân trang (Chèn văn bản, ảnh, video, khối nội dung layout). Xây dựng phần chân trang (Footer cố định). Tạo các trang con và thiết lập Thanh điều hướng, tạo các liên kết nội bộ. Nhúng biểu mẫu thu thập ý kiến Google Forms. **Bước 3: Công bố và kiểm thử:** Bấm `Xem trước` (Preview) kiểm tra giao diện trên Máy tính, Máy tính bảng, Điện thoại. Kiểm tra toàn bộ các đường liên kết đảm bảo không có liên kết hỏng. Bấm `Xuất bản` (Publish) và chia sẻ địa chỉ trang web. `Full Website Development`: Quy trình phát triển website hoàn chỉnh. `Preview Mode`: Chế độ xem trước giao diện đa thiết bị. `Responsive Design Check`: Kiểm tra khả năng tương thích giao diện. Sản phẩm hoàn thiện: Website \"Những bài ca đi cùng năm tháng\" gồm Trang chủ, 3 trang con thể loại nhạc, 1 trang biểu mẫu góp ý, thanh điều hướng ngang đẹp mắt, xuất bản công khai trên Internet. **B1:** Kiểm tra toàn bộ hệ thống trang trong bảng chọn `Trang`. **B2:** Thao tác kéo thả điều chỉnh thứ tự hiển thị các trang con trên thanh điều hướng. **B3:** Mở biểu tượng `Xem trước` (Preview) -> Chuyển đổi giữa chế độ Phone, Tablet và Large Screen để kiểm tra độ tương thích. **B4:** Nhấp nút `Xuất bản` -> Sao chép đường liên kết trang web công khai nộp bài. **Lỗi văn bản trên điện thoại bị tràn hoặc ảnh quá bé:** Do chèn khối hình ảnh tự do không theo khung Layout chuẩn. **Khắc phục:** Ưu tiên sử dụng các `Khối nội dung` (Content Blocks) có sẵn của Google Sites để tự động tối ưu giao diện màn hình di động. Xây dựng website hoàn chỉnh gồm 3 bước: Chuẩn bị -> Tiến hành thiết kế -> Công bố & Hiệu chỉnh; dùng tính năng `Xem trước` kiểm tra giao diện đa thiết bị trước khi Xuất bản."};
