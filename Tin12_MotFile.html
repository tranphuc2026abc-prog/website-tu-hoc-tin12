(window.T=window.T||{L:{},Q:{}}).L["ICT12_B01"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Giải thích được sơ lược về khái niệm Trí tuệ nhân tạo (AI); nêu được ví dụ minh hoạ cho một số ứng dụng điển hình của AI."},{"x":"**Năng lực:** Năng lực tự học, giao tiếp, hợp tác và giải quyết vấn đề CNTT."},{"x":"**Phẩm chất:** Chăm chỉ, tích cực tìm tòi công nghệ mới, có trách nhiệm với các vấn đề đạo đức công nghệ."}]}],"key":[{"t":"ul","i":[{"x":"**Khái niệm AI:** Là khả năng của máy tính hoặc hệ thống máy tính mô phỏng các năng lực trí tuệ của con người như suy luận, giải quyết vấn đề, học máy (Learning), hiểu ngôn ngữ tự nhiên, cảm nhận và nhận dạng hình ảnh/âm thanh."},{"x":"**Mốc lịch sử ra đời:** Thuật ngữ AI được đề xuất chính thức tại Hội thảo Dartmouth (Mỹ) năm 1956 với sự tham gia của John McCarthy, Marvin Minsky, Nathaniel Rochester và Claude Shannon."},{"x":"**Phân loại AI theo chức năng:**","c":[{"x":"**AI hẹp (Weak AI / Narrow AI):** Hệ thống AI được thiết kế để giải quyết một nhiệm vụ cụ thể đạt hiệu quả cao (ví dụ: phần mềm chơi cờ vua AlphaZero, hệ chuyên gia chẩn đoán y tế MYCIN, hệ thống nhận dạng khuôn mặt Luxand)."},{"x":"**AI tổng quát (Strong AI / General AI):** Hệ thống AI có trí thông minh ngang tầm hoặc vượt con người, có khả năng tự học, tự thích nghi và thực hiện đa dạng công việc giống như con người (chưa hoàn thiện hoàn toàn trong thực tế)."}]},{"x":"**Các đặc trưng của AI:**","c":[{"x":"Khả năng học (Machine Learning, Deep Learning)."},{"x":"Khả năng suy luận và giải quyết vấn đề dựa trên tri thức và logic."},{"x":"Khả năng hiểu ngôn ngữ tự nhiên (Natural Language Processing)."},{"x":"Khả năng nhận dạng hình ảnh, thị giác máy tính (Computer Vision)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Artificial Intelligence (AI)`: Trí tuệ nhân tạo."},{"x":"`Dartmouth Conference 1956`: Hội thảo Dartmouth năm 1956 - cột mốc sinh ra AI."},{"x":"`Weak AI / Narrow AI`: Trí tuệ nhân tạo hẹp."},{"x":"`Strong AI / General AI`: Trí tuệ nhân tạo tổng quát / mạnh."},{"x":"`MYCIN`: Hệ chuyên gia y tế chẩn đoán bệnh nhiễm trùng máu phát triển tại ĐH Stanford."},{"x":"`Virtual Assistant`: Trợ lý ảo (Siri, Google Assistant, Cortana, Bixby, Alexa)."}]}],"ex":[{"t":"ul","i":[{"x":"**Robot hình người:** Robot Asimo (Honda), Robot ChihiraAico, Robot Sophia."},{"x":"**Ứng dụng Trợ lý ảo:** Siri trên iPhone hiểu lệnh nói bằng tiếng Anh, Cortana trên Windows, Alexa điều khiển thiết bị nhà thông minh."},{"x":"**Chơi cờ:** AlphaGo/AlphaZero thắng đại kiện tướng cờ vua và cờ vây."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Học sinh truy cập Internet mở trình duyệt (Google Chrome/Edge)."},{"x":"**B2:** Trải nghiệm dịch thuật với Google Translate hoặc giao tiếp thử nghiệm với chatbot trợ lý ảo."},{"x":"**B3:** Phân tích các phản hồi của AI: xác định điểm thông minh (hiểu ngữ cảnh) và điểm hạn chế (dịch thô, nhầm ngữ nghĩa)."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi nhầm lẫn giữa AI và Tự động hóa thông thường:** Dây chuyền sản xuất cơ khí cố định không phải là AI vì không có khả năng tự học hay suy luận điều chỉnh."},{"x":"**Khắc phục:** Cần phân biệt rõ: Tự động hóa là chạy theo kịch bản cố định; AI có khả năng thích nghi và đưa ra quyết định tự động dựa trên dữ liệu mới."}]}],"rem":[{"t":"ul","i":[{"x":"Trí tuệ nhân tạo là lĩnh vực khoa học máy tính hướng tới việc xây dựng các máy tính có khả năng suy luận, học hỏi, hiểu ngôn ngữ và giải quyết vấn đề như con người."},{"x":"AI hiện nay chủ yếu là AI hẹp, tập trung vào từng lĩnh vực cụ thể."}]}]},"terms":[{"t":"Artificial Intelligence (AI)","d":"Trí tuệ nhân tạo."},{"t":"Dartmouth Conference 1956","d":"Hội thảo Dartmouth năm 1956 - cột mốc sinh ra AI."},{"t":"Weak AI / Narrow AI","d":"Trí tuệ nhân tạo hẹp."},{"t":"Strong AI / General AI","d":"Trí tuệ nhân tạo tổng quát / mạnh."},{"t":"MYCIN","d":"Hệ chuyên gia y tế chẩn đoán bệnh nhiễm trùng máu phát triển tại ĐH Stanford."},{"t":"Virtual Assistant","d":"Trợ lý ảo (Siri, Google Assistant, Cortana, Bixby, Alexa)."}],"txt":"**Kiến thức:** Giải thích được sơ lược về khái niệm Trí tuệ nhân tạo (AI); nêu được ví dụ minh hoạ cho một số ứng dụng điển hình của AI. **Năng lực:** Năng lực tự học, giao tiếp, hợp tác và giải quyết vấn đề CNTT. **Phẩm chất:** Chăm chỉ, tích cực tìm tòi công nghệ mới, có trách nhiệm với các vấn đề đạo đức công nghệ. **Khái niệm AI:** Là khả năng của máy tính hoặc hệ thống máy tính mô phỏng các năng lực trí tuệ của con người như suy luận, giải quyết vấn đề, học máy (Learning), hiểu ngôn ngữ tự nhiên, cảm nhận và nhận dạng hình ảnh/âm thanh. **Mốc lịch sử ra đời:** Thuật ngữ AI được đề xuất chính thức tại Hội thảo Dartmouth (Mỹ) năm 1956 với sự tham gia của John McCarthy, Marvin Minsky, Nathaniel Rochester và Claude Shannon. **Phân loại AI theo chức năng:** **AI hẹp (Weak AI / Narrow AI):** Hệ thống AI được thiết kế để giải quyết một nhiệm vụ cụ thể đạt hiệu quả cao (ví dụ: phần mềm chơi cờ vua AlphaZero, hệ chuyên gia chẩn đoán y tế MYCIN, hệ thống nhận dạng khuôn mặt Luxand). **AI tổng quát (Strong AI / General AI):** Hệ thống AI có trí thông minh ngang tầm hoặc vượt con người, có khả năng tự học, tự thích nghi và thực hiện đa dạng công việc giống như con người (chưa hoàn thiện hoàn toàn trong thực tế). **Các đặc trưng của AI:** Khả năng học (Machine Learning, Deep Learning). Khả năng suy luận và giải quyết vấn đề dựa trên tri thức và logic. Khả năng hiểu ngôn ngữ tự nhiên (Natural Language Processing). Khả năng nhận dạng hình ảnh, thị giác máy tính (Computer Vision). `Artificial Intelligence (AI)`: Trí tuệ nhân tạo. `Dartmouth Conference 1956`: Hội thảo Dartmouth năm 1956 - cột mốc sinh ra AI. `Weak AI / Narrow AI`: Trí tuệ nhân tạo hẹp. `Strong AI / General AI`: Trí tuệ nhân tạo tổng quát / mạnh. `MYCIN`: Hệ chuyên gia y tế chẩn đoán bệnh nhiễm trùng máu phát triển tại ĐH Stanford. `Virtual Assistant`: Trợ lý ảo (Siri, Google Assistant, Cortana, Bixby, Alexa). **Robot hình người:** Robot Asimo (Honda), Robot ChihiraAico, Robot Sophia. **Ứng dụng Trợ lý ảo:** Siri trên iPhone hiểu lệnh nói bằng tiếng Anh, Cortana trên Windows, Alexa điều khiển thiết bị nhà thông minh. **Chơi cờ:** AlphaGo/AlphaZero thắng đại kiện tướng cờ vua và cờ vây. **B1:** Học sinh truy cập Internet mở trình duyệt (Google Chrome/Edge). **B2:** Trải nghiệm dịch thuật với Google Translate hoặc giao tiếp thử nghiệm với chatbot trợ lý ảo. **B3:** Phân tích các phản hồi của AI: xác định điểm thông minh (hiểu ngữ cảnh) và điểm hạn chế (dịch thô, nhầm ngữ nghĩa). **Lỗi nhầm lẫn giữa AI và Tự động hóa thông thường:** Dây chuyền sản xuất cơ khí cố định không phải là AI vì không có khả năng tự học hay suy luận điều chỉnh. **Khắc phục:** Cần phân biệt rõ: Tự động hóa là chạy theo kịch bản cố định; AI có khả năng thích nghi và đưa ra quyết định tự động dựa trên dữ liệu mới. Trí tuệ nhân tạo là lĩnh vực khoa học máy tính hướng tới việc xây dựng các máy tính có khả năng suy luận, học hỏi, hiểu ngôn ngữ và giải quyết vấn đề như con người. AI hiện nay chủ yếu là AI hẹp, tập trung vào từng lĩnh vực cụ thể."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B02"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Chỉ ra được một số lĩnh vực khoa học công nghệ và đời sống phát triển mạnh mẽ dựa trên thành tựu của AI; đánh giá được tác động, tiềm năng và nguy cơ/giới hạn của AI."},{"x":"**Năng lực:** Đánh giá phản biện công nghệ, sử dụng công cụ AI an toàn và văn minh."},{"x":"**Phẩm chất:** Tôn trọng bản quyền, ứng xử có đạo đức khi sử dụng AI tạo sinh."}]}],"key":[{"t":"ul","i":[{"x":"**Ứng dụng của AI trong các lĩnh vực:**","c":[{"x":"**Y tế:** IBM Watson for Oncology hỗ trợ bác sĩ tư vấn phác đồ điều trị ung thư; AI phân tích ảnh X-quang, MRI để chẩn đoán sớm."},{"x":"**Giáo dục:** Nền tảng học trực tuyến thông minh (Smart Learning), cá nhân hóa lộ trình học tập, theo dõi tiến độ của học sinh."},{"x":"**Tài chính - Ngân hàng:** Tự động hóa duyệt hồ sơ, phát hiện gian lận giao dịch thẻ, chatbot chăm sóc khách hàng 24/7."},{"x":"**Sản xuất & Nông nghiệp (AIoT):** Kết nối IoT và AI giám sát môi trường, tối ưu hóa năng lượng, robot gặt lúa, drone phun thuốc bảo vệ thực vật."},{"x":"**Giao thông:** Xe tự lái (Tesla, Waymo), quản lý tín hiệu giao thông thông minh."}]},{"x":"**AI tạo sinh (Generative AI) & ChatGPT:**","c":[{"x":"Generative AI là nhánh AI tập trung tạo ra nội dung mới (văn bản, hình ảnh, âm thanh, mã nguồn)."},{"x":"ChatGPT (OpenAI): Mô hình ngôn ngữ lớn (LLM) đột phá năm 2022, có khả năng hội thoại tự nhiên, làm thơ, viết mã lập trình, tóm tắt tài liệu."}]},{"x":"**Cảnh báo nguy cơ & Giới hạn của AI:**","c":[{"x":"Nguy cơ mất an toàn thông tin, lộ bí mật riêng tư."},{"x":"Nguy cơ thất nghiệp ở một số ngành nghề thủ công/lặp lại."},{"x":"Lạm dụng AI trong gian lận học thuật, tạo tin giả (Deepfake)."},{"x":"Nguy hiểm khi giao quyền điều khiển tự động cho vũ khí sát thương độc lập."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Generative AI`: Trí tuệ nhân tạo tạo sinh."},{"x":"`ChatGPT / Large Language Model (LLM)`: Chatbot thông minh dựa trên mô hình ngôn ngữ lớn."},{"x":"`IBM Watson for Oncology`: AI chẩn đoán và điều trị ung thư."},{"x":"`AIoT (AI + IoT)`: Sự kết hợp giữa AI và Mạng vạn vật kết nối Internet."},{"x":"`Deepfake`: Công nghệ tạo hình ảnh/video giả mạo tinh vi."}]}],"ex":[{"t":"ul","i":[{"x":"ChatGPT hỗ trợ lập trình viên tìm lỗi code hoặc viết đoạn văn bản gợi ý."},{"x":"Google Maps dự báo tình trạng tắc đường dựa trên dữ liệu vị trí thời gian thực của người dùng."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Tìm kiếm thông tin về cách thức hoạt động của Google Maps hoặc ChatGPT."},{"x":"**B2:** So sánh kết quả phản hồi của AI với tìm kiếm Google truyền thống."},{"x":"**B3:** Thảo luận nhóm về các nguyên tắc sử dụng AI an toàn và trách nhiệm."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi tin tưởng tuyệt đối vào phản hồi của AI:** AI có thể tạo ra thông tin sai lệch nhưng diễn đạt rất thuyết phục (Hiện tượng \"ảo giác AI\" - Hallucination)."},{"x":"**Khắc phục:** Luôn kiểm chứng thông tin từ các nguồn chính thống."}]}],"rem":[{"t":"ul","i":[{"x":"AI mang lại lợi ích to lớn cho y tế, giáo dục, tài chính, giao thông và nông nghiệp."},{"x":"Cần sử dụng AI một cách có đạo đức, có trách nhiệm và luôn kiểm soát rủi ro an toàn thông tin."}]}]},"terms":[{"t":"Generative AI","d":"Trí tuệ nhân tạo tạo sinh."},{"t":"ChatGPT / Large Language Model (LLM)","d":"Chatbot thông minh dựa trên mô hình ngôn ngữ lớn."},{"t":"IBM Watson for Oncology","d":"AI chẩn đoán và điều trị ung thư."},{"t":"AIoT (AI + IoT)","d":"Sự kết hợp giữa AI và Mạng vạn vật kết nối Internet."},{"t":"Deepfake","d":"Công nghệ tạo hình ảnh/video giả mạo tinh vi."}],"txt":"**Kiến thức:** Chỉ ra được một số lĩnh vực khoa học công nghệ và đời sống phát triển mạnh mẽ dựa trên thành tựu của AI; đánh giá được tác động, tiềm năng và nguy cơ/giới hạn của AI. **Năng lực:** Đánh giá phản biện công nghệ, sử dụng công cụ AI an toàn và văn minh. **Phẩm chất:** Tôn trọng bản quyền, ứng xử có đạo đức khi sử dụng AI tạo sinh. **Ứng dụng của AI trong các lĩnh vực:** **Y tế:** IBM Watson for Oncology hỗ trợ bác sĩ tư vấn phác đồ điều trị ung thư; AI phân tích ảnh X-quang, MRI để chẩn đoán sớm. **Giáo dục:** Nền tảng học trực tuyến thông minh (Smart Learning), cá nhân hóa lộ trình học tập, theo dõi tiến độ của học sinh. **Tài chính - Ngân hàng:** Tự động hóa duyệt hồ sơ, phát hiện gian lận giao dịch thẻ, chatbot chăm sóc khách hàng 24/7. **Sản xuất & Nông nghiệp (AIoT):** Kết nối IoT và AI giám sát môi trường, tối ưu hóa năng lượng, robot gặt lúa, drone phun thuốc bảo vệ thực vật. **Giao thông:** Xe tự lái (Tesla, Waymo), quản lý tín hiệu giao thông thông minh. **AI tạo sinh (Generative AI) & ChatGPT:** Generative AI là nhánh AI tập trung tạo ra nội dung mới (văn bản, hình ảnh, âm thanh, mã nguồn). ChatGPT (OpenAI): Mô hình ngôn ngữ lớn (LLM) đột phá năm 2022, có khả năng hội thoại tự nhiên, làm thơ, viết mã lập trình, tóm tắt tài liệu. **Cảnh báo nguy cơ & Giới hạn của AI:** Nguy cơ mất an toàn thông tin, lộ bí mật riêng tư. Nguy cơ thất nghiệp ở một số ngành nghề thủ công/lặp lại. Lạm dụng AI trong gian lận học thuật, tạo tin giả (Deepfake). Nguy hiểm khi giao quyền điều khiển tự động cho vũ khí sát thương độc lập. `Generative AI`: Trí tuệ nhân tạo tạo sinh. `ChatGPT / Large Language Model (LLM)`: Chatbot thông minh dựa trên mô hình ngôn ngữ lớn. `IBM Watson for Oncology`: AI chẩn đoán và điều trị ung thư. `AIoT (AI + IoT)`: Sự kết hợp giữa AI và Mạng vạn vật kết nối Internet. `Deepfake`: Công nghệ tạo hình ảnh/video giả mạo tinh vi. ChatGPT hỗ trợ lập trình viên tìm lỗi code hoặc viết đoạn văn bản gợi ý. Google Maps dự báo tình trạng tắc đường dựa trên dữ liệu vị trí thời gian thực của người dùng. **B1:** Tìm kiếm thông tin về cách thức hoạt động của Google Maps hoặc ChatGPT. **B2:** So sánh kết quả phản hồi của AI với tìm kiếm Google truyền thống. **B3:** Thảo luận nhóm về các nguyên tắc sử dụng AI an toàn và trách nhiệm. **Lỗi tin tưởng tuyệt đối vào phản hồi của AI:** AI có thể tạo ra thông tin sai lệch nhưng diễn đạt rất thuyết phục (Hiện tượng \"ảo giác AI\" - Hallucination). **Khắc phục:** Luôn kiểm chứng thông tin từ các nguồn chính thống. AI mang lại lợi ích to lớn cho y tế, giáo dục, tài chính, giao thông và nông nghiệp. Cần sử dụng AI một cách có đạo đức, có trách nhiệm và luôn kiểm soát rủi ro an toàn thông tin."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B03"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Nêu được chức năng chính của một số thiết bị mạng thông dụng (Hub, Switch, Wi-Fi Access Point, Router, Modem); biết cách kết nối máy tính/điện thoại vào mạng."},{"x":"**Năng lực:** Lựa chọn và kết nối phần cứng mạng cho quy mô gia đình hoặc phòng máy."},{"x":"**Phẩm chất:** Tỉ mỉ, cẩn thận khi thao tác thiết bị phần cứng."}]}],"key":[{"t":"ul","i":[{"x":"**Chức năng các thiết bị mạng:**","c":[{"x":"**Hub:** Thiết bị kết nối trung tâm trong LAN, gửi dữ liệu nhận được tới tất cả các cổng (chế độ Broadcast - hiệu suất thấp, dễ xung đột)."},{"x":"**Switch:** Thiết bị chuyển mạch LAN thông minh, gửi dữ liệu chính xác tới thiết bị nhận dựa trên địa chỉ MAC (chế độ Unicast - hiệu suất cao)."},{"x":"**Wireless Access Point (WAP):** Trạm thu phát sóng Wi-Fi, kết nối các thiết bị không dây vào mạng LAN có dây."},{"x":"**Router (Bộ định tuyến):** Kết nối các mạng khác nhau (ví dụ mạng LAN gia đình với mạng diện rộng Internet), chọn đường đi tối ưu cho các gói dữ liệu."},{"x":"**Modem:** Chuyển đổi tín hiệu giữa tín hiệu số (Digital) của máy tính và tín hiệu tương tự (Analog) của đường truyền viễn thông (Quang/ADSL/3G/4G/5G)."}]},{"x":"**Router Wi-Fi gia đình:** Là thiết bị tích hợp đa chức năng: Router + Switch 4 cổng + WAP + Modem quang."}]}],"terms":[{"t":"ul","i":[{"x":"`Switch vs Hub`: Chuyển mạch thông minh (Switch) vs Bộ chia tín hiệu chung (Hub)."},{"x":"`Router`: Bộ định tuyến điều hướng dữ liệu liên mạng."},{"x":"`Modem (Modulator-Demodulator)`: Bộ biến điệu và giải biến điệu tín hiệu."},{"x":"`Wi-Fi (Wireless Fidelity)`: Công nghệ mạng không dây sóng vô tuyến."},{"x":"`WAP (Wireless Access Point)`: Điểm truy cập không dây."}]}],"ex":[{"t":"ul","i":[{"x":"Sơ đồ mạng phòng máy trường học: Các máy tính kết nối cáp UTP qua cổng RJ45 vào Switch; Switch cắm vào Router Wi-Fi; Router kết nối Modem quang ra nhà mạng."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Kiểm tra dây cáp mạng UTP và đầu cắm RJ45."},{"x":"**B2:** Cắm cáp mạng vào cổng LAN trên máy tính và cổng trên Switch/Router."},{"x":"**B3:** Kiểm tra đèn báo tín hiệu link/act trên cổng mạng."},{"x":"**B4:** Đăng nhập Wi-Fi trên smartphone: Mở Wi-Fi -> Chọn SSID -> Nhập mật khẩu."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi cắm nhầm cổng WAN và LAN trên Router Wi-Fi:** Khiến máy tính không lấy được địa chỉ IP tự động."},{"x":"**Khắc phục:** Cắm dây mạng từ Modem vào cổng WAN (màu xanh); cắm máy tính vào cổng LAN (màu vàng)."}]}],"rem":[{"t":"ul","i":[{"x":"Switch dùng kết nối nội bộ LAN; Router dùng định tuyến giữa các mạng; Modem biến đổi tín hiệu đường truyền."},{"x":"Router Wi-Fi phổ biến trong gia đình tích hợp cả Router, Switch và WAP."}]}]},"terms":[{"t":"Switch vs Hub","d":"Chuyển mạch thông minh (Switch) vs Bộ chia tín hiệu chung (Hub)."},{"t":"Router","d":"Bộ định tuyến điều hướng dữ liệu liên mạng."},{"t":"Modem (Modulator-Demodulator)","d":"Bộ biến điệu và giải biến điệu tín hiệu."},{"t":"Wi-Fi (Wireless Fidelity)","d":"Công nghệ mạng không dây sóng vô tuyến."},{"t":"WAP (Wireless Access Point)","d":"Điểm truy cập không dây."}],"txt":"**Kiến thức:** Nêu được chức năng chính của một số thiết bị mạng thông dụng (Hub, Switch, Wi-Fi Access Point, Router, Modem); biết cách kết nối máy tính/điện thoại vào mạng. **Năng lực:** Lựa chọn và kết nối phần cứng mạng cho quy mô gia đình hoặc phòng máy. **Phẩm chất:** Tỉ mỉ, cẩn thận khi thao tác thiết bị phần cứng. **Chức năng các thiết bị mạng:** **Hub:** Thiết bị kết nối trung tâm trong LAN, gửi dữ liệu nhận được tới tất cả các cổng (chế độ Broadcast - hiệu suất thấp, dễ xung đột). **Switch:** Thiết bị chuyển mạch LAN thông minh, gửi dữ liệu chính xác tới thiết bị nhận dựa trên địa chỉ MAC (chế độ Unicast - hiệu suất cao). **Wireless Access Point (WAP):** Trạm thu phát sóng Wi-Fi, kết nối các thiết bị không dây vào mạng LAN có dây. **Router (Bộ định tuyến):** Kết nối các mạng khác nhau (ví dụ mạng LAN gia đình với mạng diện rộng Internet), chọn đường đi tối ưu cho các gói dữ liệu. **Modem:** Chuyển đổi tín hiệu giữa tín hiệu số (Digital) của máy tính và tín hiệu tương tự (Analog) của đường truyền viễn thông (Quang/ADSL/3G/4G/5G). **Router Wi-Fi gia đình:** Là thiết bị tích hợp đa chức năng: Router + Switch 4 cổng + WAP + Modem quang. `Switch vs Hub`: Chuyển mạch thông minh (Switch) vs Bộ chia tín hiệu chung (Hub). `Router`: Bộ định tuyến điều hướng dữ liệu liên mạng. `Modem (Modulator-Demodulator)`: Bộ biến điệu và giải biến điệu tín hiệu. `Wi-Fi (Wireless Fidelity)`: Công nghệ mạng không dây sóng vô tuyến. `WAP (Wireless Access Point)`: Điểm truy cập không dây. Sơ đồ mạng phòng máy trường học: Các máy tính kết nối cáp UTP qua cổng RJ45 vào Switch; Switch cắm vào Router Wi-Fi; Router kết nối Modem quang ra nhà mạng. **B1:** Kiểm tra dây cáp mạng UTP và đầu cắm RJ45. **B2:** Cắm cáp mạng vào cổng LAN trên máy tính và cổng trên Switch/Router. **B3:** Kiểm tra đèn báo tín hiệu link/act trên cổng mạng. **B4:** Đăng nhập Wi-Fi trên smartphone: Mở Wi-Fi -> Chọn SSID -> Nhập mật khẩu. **Lỗi cắm nhầm cổng WAN và LAN trên Router Wi-Fi:** Khiến máy tính không lấy được địa chỉ IP tự động. **Khắc phục:** Cắm dây mạng từ Modem vào cổng WAN (màu xanh); cắm máy tính vào cổng LAN (màu vàng). Switch dùng kết nối nội bộ LAN; Router dùng định tuyến giữa các mạng; Modem biến đổi tín hiệu đường truyền. Router Wi-Fi phổ biến trong gia đình tích hợp cả Router, Switch và WAP."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B04"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Trình bày được khái niệm giao thức mạng; hiểu về bộ giao thức TCP/IP, địa chỉ IP (IPv4, IPv6), tên miền (DNS) và câu lệnh `ping`."},{"x":"**Năng lực:** Cấu hình và kiểm tra kết nối mạng bằng dòng lệnh."},{"x":"**Phẩm chất:** Ý thức tuân thủ các chuẩn mực giao thức công nghệ."}]}],"key":[{"t":"ul","i":[{"x":"**Khái niệm Giao thức mạng (Network Protocol):** Là tập hợp các quy tắc, quy định bắt buộc các thiết bị mạng phải tuân theo khi truyền thông điệp dữ liệu với nhau."},{"x":"**Bộ giao thức TCP/IP:**","c":[{"x":"**IP (Internet Protocol):** Giao thức tầng mạng, có nhiệm vụ đánh địa chỉ và định tuyến gói tin từ nguồn đến đích."},{"x":"**TCP (Transmission Control Protocol):** Giao thức tầng vận chuyển, đảm bảo truyền dữ liệu tin cậy, đúng thứ tự, không mất mát gói tin."}]},{"x":"**Địa chỉ IP:**","c":[{"x":"**IPv4:** Gồm 32 bit, chia làm 4 octet (mỗi octet 8 bit), biểu diễn dưới dạng 4 số thập phân phân cách bởi dấu chấm (VD: `192.168.1.1`)."},{"x":"**IPv6:** Gồm 128 bit, biểu diễn dưới dạng 8 nhóm số lục phân phân cách bởi dấu hai chấm (VD: `2001:0db8:85a3::8a2e:0370:7334`)."}]},{"x":"**Hệ thống tên miền DNS (Domain Name System):**","c":[{"x":"Dịch chuyển đổi tên miền dễ nhớ (VD: `vietnamtourism.gov.vn`) thành địa chỉ IP số tương ứng để máy tính kết nối."},{"x":"Cơ quan quản lý tên miền tại Việt Nam: VNNIC (Trung tâm Internet Việt Nam thuộc Bộ TT&TT)."}]},{"x":"**Lệnh `ping` (ICMP Protocol):** Dùng để kiểm tra khả năng kết nối mạng giữa hai máy tính hoặc giữa máy tính với website."}]}],"terms":[{"t":"ul","i":[{"x":"`TCP/IP`: Transmission Control Protocol / Internet Protocol."},{"x":"`IPv4 / IPv6`: Địa chỉ IP phiên bản 4 (32-bit) / phiên bản 6 (128-bit)."},{"x":"`DNS (Domain Name System)`: Hệ thống phân giải tên miền."},{"x":"`VNNIC`: Trung tâm Internet Việt Nam."},{"x":"`Ping / ICMP`: Lệnh kiểm tra độ độ trễ và khả năng thông mạng."}]}],"ex":[{"t":"ul","i":[{"x":"Chuyển đổi nhị phân sang thập phân: `11000000.10101000.00001101.11010010` -> `192.168.13.210`."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở Command Prompt trên Windows (`Cmd`)."},{"x":"**B2:** Gõ lệnh `ping google.com` hoặc `ping 8.8.8.8` rồi nhấn Enter."},{"x":"**B3:** Quan sát chỉ số: `bytes=32`, `time=15ms`, `TTL=117`, `Packets: Sent = 4, Received = 4, Lost = 0 (0% loss)`."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi `Request timed out` khi ping:** Do đứt mạng, gõ sai địa chỉ IP/tên miền, hoặc tường lửa máy đích chặn ICMP."},{"x":"**Khắc phục:** Kiểm tra lại dây mạng, IP và tắt tạm tường lửa thử nghiệm."}]}],"rem":[{"t":"ul","i":[{"x":"TCP/IP là bộ giao thức nền tảng của Internet."},{"x":"DNS chuyển đổi tên miền dạng chữ sang IP dạng số; Lệnh `ping` dùng kiểm tra kết nối mạng."}]}]},"terms":[{"t":"TCP/IP","d":"Transmission Control Protocol / Internet Protocol."},{"t":"IPv4 / IPv6","d":"Địa chỉ IP phiên bản 4 (32-bit) / phiên bản 6 (128-bit)."},{"t":"DNS (Domain Name System)","d":"Hệ thống phân giải tên miền."},{"t":"VNNIC","d":"Trung tâm Internet Việt Nam."},{"t":"Ping / ICMP","d":"Lệnh kiểm tra độ độ trễ và khả năng thông mạng."}],"txt":"**Kiến thức:** Trình bày được khái niệm giao thức mạng; hiểu về bộ giao thức TCP/IP, địa chỉ IP (IPv4, IPv6), tên miền (DNS) và câu lệnh `ping`. **Năng lực:** Cấu hình và kiểm tra kết nối mạng bằng dòng lệnh. **Phẩm chất:** Ý thức tuân thủ các chuẩn mực giao thức công nghệ. **Khái niệm Giao thức mạng (Network Protocol):** Là tập hợp các quy tắc, quy định bắt buộc các thiết bị mạng phải tuân theo khi truyền thông điệp dữ liệu với nhau. **Bộ giao thức TCP/IP:** **IP (Internet Protocol):** Giao thức tầng mạng, có nhiệm vụ đánh địa chỉ và định tuyến gói tin từ nguồn đến đích. **TCP (Transmission Control Protocol):** Giao thức tầng vận chuyển, đảm bảo truyền dữ liệu tin cậy, đúng thứ tự, không mất mát gói tin. **Địa chỉ IP:** **IPv4:** Gồm 32 bit, chia làm 4 octet (mỗi octet 8 bit), biểu diễn dưới dạng 4 số thập phân phân cách bởi dấu chấm (VD: `192.168.1.1`). **IPv6:** Gồm 128 bit, biểu diễn dưới dạng 8 nhóm số lục phân phân cách bởi dấu hai chấm (VD: `2001:0db8:85a3::8a2e:0370:7334`). **Hệ thống tên miền DNS (Domain Name System):** Dịch chuyển đổi tên miền dễ nhớ (VD: `vietnamtourism.gov.vn`) thành địa chỉ IP số tương ứng để máy tính kết nối. Cơ quan quản lý tên miền tại Việt Nam: VNNIC (Trung tâm Internet Việt Nam thuộc Bộ TT&TT). **Lệnh `ping` (ICMP Protocol):** Dùng để kiểm tra khả năng kết nối mạng giữa hai máy tính hoặc giữa máy tính với website. `TCP/IP`: Transmission Control Protocol / Internet Protocol. `IPv4 / IPv6`: Địa chỉ IP phiên bản 4 (32-bit) / phiên bản 6 (128-bit). `DNS (Domain Name System)`: Hệ thống phân giải tên miền. `VNNIC`: Trung tâm Internet Việt Nam. `Ping / ICMP`: Lệnh kiểm tra độ độ trễ và khả năng thông mạng. Chuyển đổi nhị phân sang thập phân: `11000000.10101000.00001101.11010010` -> `192.168.13.210`. **B1:** Mở Command Prompt trên Windows (`Cmd`). **B2:** Gõ lệnh `ping google.com` hoặc `ping 8.8.8.8` rồi nhấn Enter. **B3:** Quan sát chỉ số: `bytes=32`, `time=15ms`, `TTL=117`, `Packets: Sent = 4, Received = 4, Lost = 0 (0% loss)`. **Lỗi `Request timed out` khi ping:** Do đứt mạng, gõ sai địa chỉ IP/tên miền, hoặc tường lửa máy đích chặn ICMP. **Khắc phục:** Kiểm tra lại dây mạng, IP và tắt tạm tường lửa thử nghiệm. TCP/IP là bộ giao thức nền tảng của Internet. DNS chuyển đổi tên miền dạng chữ sang IP dạng số; Lệnh `ping` dùng kiểm tra kết nối mạng."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B05"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Thực hiện được chia sẻ tệp, thư mục và máy in trong mạng cục bộ (LAN) trên hệ điều hành Windows; phân quyền truy cập và cài đặt tường lửa an toàn."},{"x":"**Năng lực:** Quản trị chia sẻ tài nguyên dữ liệu mạng LAN an toàn."},{"x":"**Phẩm chất:** Ý thức bảo mật dữ liệu, tránh lộ thông tin cá nhân trên mạng công cộng."}]}],"key":[{"t":"ul","i":[{"x":"**Môi trường mạng LAN:**","c":[{"x":"**Private Network (Mạng riêng/nội bộ):** Mạng gia đình, cơ quan; đáng tin cậy, cho phép bật chia sẻ tài nguyên."},{"x":"**Public Network (Mạng công cộng):** Mạng wifi quán cafe, sân bay; không an toàn, mặc định chặn chia sẻ."}]},{"x":"**Cấp quyền chia sẻ thư mục:**","c":[{"x":"**Read:** Người dùng trên mạng chỉ được xem, mở, sao chép tệp."},{"x":"**Read/Write:** Cho phép người dùng chỉnh sửa, thêm, xóa tệp trong thư mục chia sẻ."}]},{"x":"**Chia sẻ máy in (Printer Sharing):** Cho phép các máy tính trong cùng mạng LAN gửi lệnh in tới một máy in vật lý kết nối với máy chủ in."},{"x":"**Tường lửa (Windows Defender Firewall):** Kiểm soát lưu lượng ra vào mạng; có thể bật/tắt tạm thời trong quá trình cấu hình chia sẻ."}]}],"terms":[{"t":"ul","i":[{"x":"`File Sharing / Directory Sharing`: Chia sẻ tệp và thư mục."},{"x":"`Printer Sharing`: Chia sẻ máy in qua mạng."},{"x":"`Network Profile`: Private Network / Public Network."},{"x":"`Permissions`: Quyền Read / Read-Write."},{"x":"`Windows Defender Firewall`: Tường lửa bảo vệ hệ điều hành Windows."}]}],"ex":[{"t":"ul","i":[{"x":"Đặt tệp trong thư mục `Public` hoặc Click chuột phải chọn `Properties` -> `Sharing` -> `Advanced Sharing` -> Tích chọn `Share this folder`."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Vào `Control Panel` -> `Network and Sharing Center` -> `Advanced sharing settings` -> Chọn `Turn on file and printer sharing` cho Private Network."},{"x":"**B2:** Tạo thư mục cần chia sẻ -> Chuột phải chọn `Properties` -> Thẻ `Sharing` -> `Share...`."},{"x":"**B3:** Chọn đối tượng `Everyone` -> Đặt quyền `Read` hoặc `Read/Write` -> Bấm `Share`."},{"x":"**B4:** Từ máy trạm, bấm `Windows + R` -> Nhập `\\\\<Địa_chỉ_IP_máy_chủ>` để truy cập tài nguyên chia sẻ."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi `System error 53` hoặc đòi Password truy cập:** Do máy chủ bật tính năng Password protected sharing."},{"x":"**Khắc phục:** Vào `Advanced sharing settings` -> Tắt `Password protected sharing` (All Networks)."}]}],"rem":[{"t":"ul","i":[{"x":"Chỉ nên chia sẻ tài nguyên ở mạng Private; phân quyền cẩn thận (Read/Write) để bảo vệ dữ liệu."}]}]},"terms":[{"t":"File Sharing / Directory Sharing","d":"Chia sẻ tệp và thư mục."},{"t":"Printer Sharing","d":"Chia sẻ máy in qua mạng."},{"t":"Network Profile","d":"Private Network / Public Network."},{"t":"Permissions","d":"Quyền Read / Read-Write."},{"t":"Windows Defender Firewall","d":"Tường lửa bảo vệ hệ điều hành Windows."}],"txt":"**Kiến thức:** Thực hiện được chia sẻ tệp, thư mục và máy in trong mạng cục bộ (LAN) trên hệ điều hành Windows; phân quyền truy cập và cài đặt tường lửa an toàn. **Năng lực:** Quản trị chia sẻ tài nguyên dữ liệu mạng LAN an toàn. **Phẩm chất:** Ý thức bảo mật dữ liệu, tránh lộ thông tin cá nhân trên mạng công cộng. **Môi trường mạng LAN:** **Private Network (Mạng riêng/nội bộ):** Mạng gia đình, cơ quan; đáng tin cậy, cho phép bật chia sẻ tài nguyên. **Public Network (Mạng công cộng):** Mạng wifi quán cafe, sân bay; không an toàn, mặc định chặn chia sẻ. **Cấp quyền chia sẻ thư mục:** **Read:** Người dùng trên mạng chỉ được xem, mở, sao chép tệp. **Read/Write:** Cho phép người dùng chỉnh sửa, thêm, xóa tệp trong thư mục chia sẻ. **Chia sẻ máy in (Printer Sharing):** Cho phép các máy tính trong cùng mạng LAN gửi lệnh in tới một máy in vật lý kết nối với máy chủ in. **Tường lửa (Windows Defender Firewall):** Kiểm soát lưu lượng ra vào mạng; có thể bật/tắt tạm thời trong quá trình cấu hình chia sẻ. `File Sharing / Directory Sharing`: Chia sẻ tệp và thư mục. `Printer Sharing`: Chia sẻ máy in qua mạng. `Network Profile`: Private Network / Public Network. `Permissions`: Quyền Read / Read-Write. `Windows Defender Firewall`: Tường lửa bảo vệ hệ điều hành Windows. Đặt tệp trong thư mục `Public` hoặc Click chuột phải chọn `Properties` -> `Sharing` -> `Advanced Sharing` -> Tích chọn `Share this folder`. **B1:** Vào `Control Panel` -> `Network and Sharing Center` -> `Advanced sharing settings` -> Chọn `Turn on file and printer sharing` cho Private Network. **B2:** Tạo thư mục cần chia sẻ -> Chuột phải chọn `Properties` -> Thẻ `Sharing` -> `Share...`. **B3:** Chọn đối tượng `Everyone` -> Đặt quyền `Read` hoặc `Read/Write` -> Bấm `Share`. **B4:** Từ máy trạm, bấm `Windows + R` -> Nhập `\\\\<Địa_chỉ_IP_máy_chủ>` để truy cập tài nguyên chia sẻ. **Lỗi `System error 53` hoặc đòi Password truy cập:** Do máy chủ bật tính năng Password protected sharing. **Khắc phục:** Vào `Advanced sharing settings` -> Tắt `Password protected sharing` (All Networks). Chỉ nên chia sẻ tài nguyên ở mạng Private; phân quyền cẩn thận (Read/Write) để bảo vệ dữ liệu."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B06"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Phân tích được ưu và nhược điểm của giao tiếp trong không gian mạng; thể hiện tính nhân văn và văn hóa ứng xử khi tham gia môi trường mạng."},{"x":"**Năng lực:** Giao tiếp số, hợp tác trực tuyến, ứng xử văn minh."},{"x":"**Phẩm chất:** Tôn trọng người khác, có trách nhiệm với lời nói và hành vi trên mạng xã hội."}]}],"key":[{"t":"ul","i":[{"x":"**Ưu điểm của giao tiếp trên không gian mạng:**","c":[{"x":"Nhanh chóng, tức thời, không bị giới hạn bởi khoảng cách địa lý hay thời gian."},{"x":"Chi phí thấp, hỗ trợ đa dạng hình thức (văn bản, thoại, video, chia sẻ tệp)."},{"x":"Hỗ trợ làm việc nhóm, học trực tuyến hiệu quả (Zoom, Google Meet, MS Teams)."}]},{"x":"**Nhược điểm & Nguy cơ:**","c":[{"x":"Thiếu ngôn ngữ cơ thể, biểu cảm khuôn mặt dễ dẫn đến hiểu nhầm ngữ nghĩa."},{"x":"Nguy cơ lừa đảo, giả mạo danh tính, bắt nạt trên mạng (Cyberbullying)."},{"x":"Dễ lộ thông tin cá nhân, xao nhãng học tập nếu nghiện mạng xã hội."}]},{"x":"**Văn hóa ứng xử nhân văn:**","c":[{"x":"Tôn trọng người giao tiếp, sử dụng ngôn từ lịch sự, văn minh."},{"x":"Không lan truyền tin giả (Fake news), không công kích, xúc phạm cá nhân."},{"x":"Tuân thủ Bộ quy tắc ứng xử trên mạng xã hội do Bộ TT&TT ban hành."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Cyberspace`: Không gian mạng."},{"x":"`Cyberbullying`: Bắt nạt qua mạng."},{"x":"`Netiquette`: Quy tắc ứng xử văn minh trên mạng."},{"x":"`Fake News`: Tin giả, tin sai sự thật."}]}],"ex":[{"t":"ul","i":[{"x":"Trải nghiệm học trực tuyến qua Zoom trong giai đoạn dịch bệnh giúp đảm bảo tiến độ học tập mà không cần đến trường."}]}],"steps":[{"t":"ul","i":[{"x":"**B1:** Thảo luận tình huống ứng xử khi gặp bình luận tiêu cực trên mạng."},{"x":"**B2:** Đánh giá các phương án giải quyết: Xóa bình luận, chặn người dùng, báo cáo vi phạm (Report), hoặc trao đổi lịch sự."},{"x":"**B3:** Rút ra bài học văn hóa giao tiếp trực tuyến."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi chia sẻ thông tin chưa kiểm chứng lên mạng xã hội:** Dẫn đến vi phạm Luật An ninh mạng."},{"x":"**Khắc phục:** Áp dụng nguyên tắc \"Suy nghĩ trước khi đăng/chia sẻ\" (Think before you share)."}]}],"rem":[{"t":"ul","i":[{"x":"Giao tiếp không gian mạng mang lại sự tiện lợi vượt trội nhưng cần đề phòng hiểu nhầm và nguy cơ an toàn."},{"x":"Tôn trọng, lịch sự và nhân văn là nguyên tắc cốt lõi khi tham gia không gian mạng."}]}]},"terms":[{"t":"Cyberspace","d":"Không gian mạng."},{"t":"Cyberbullying","d":"Bắt nạt qua mạng."},{"t":"Netiquette","d":"Quy tắc ứng xử văn minh trên mạng."},{"t":"Fake News","d":"Tin giả, tin sai sự thật."}],"txt":"**Kiến thức:** Phân tích được ưu và nhược điểm của giao tiếp trong không gian mạng; thể hiện tính nhân văn và văn hóa ứng xử khi tham gia môi trường mạng. **Năng lực:** Giao tiếp số, hợp tác trực tuyến, ứng xử văn minh. **Phẩm chất:** Tôn trọng người khác, có trách nhiệm với lời nói và hành vi trên mạng xã hội. **Ưu điểm của giao tiếp trên không gian mạng:** Nhanh chóng, tức thời, không bị giới hạn bởi khoảng cách địa lý hay thời gian. Chi phí thấp, hỗ trợ đa dạng hình thức (văn bản, thoại, video, chia sẻ tệp). Hỗ trợ làm việc nhóm, học trực tuyến hiệu quả (Zoom, Google Meet, MS Teams). **Nhược điểm & Nguy cơ:** Thiếu ngôn ngữ cơ thể, biểu cảm khuôn mặt dễ dẫn đến hiểu nhầm ngữ nghĩa. Nguy cơ lừa đảo, giả mạo danh tính, bắt nạt trên mạng (Cyberbullying). Dễ lộ thông tin cá nhân, xao nhãng học tập nếu nghiện mạng xã hội. **Văn hóa ứng xử nhân văn:** Tôn trọng người giao tiếp, sử dụng ngôn từ lịch sự, văn minh. Không lan truyền tin giả (Fake news), không công kích, xúc phạm cá nhân. Tuân thủ Bộ quy tắc ứng xử trên mạng xã hội do Bộ TT&TT ban hành. `Cyberspace`: Không gian mạng. `Cyberbullying`: Bắt nạt qua mạng. `Netiquette`: Quy tắc ứng xử văn minh trên mạng. `Fake News`: Tin giả, tin sai sự thật. Trải nghiệm học trực tuyến qua Zoom trong giai đoạn dịch bệnh giúp đảm bảo tiến độ học tập mà không cần đến trường. **B1:** Thảo luận tình huống ứng xử khi gặp bình luận tiêu cực trên mạng. **B2:** Đánh giá các phương án giải quyết: Xóa bình luận, chặn người dùng, báo cáo vi phạm (Report), hoặc trao đổi lịch sự. **B3:** Rút ra bài học văn hóa giao tiếp trực tuyến. **Lỗi chia sẻ thông tin chưa kiểm chứng lên mạng xã hội:** Dẫn đến vi phạm Luật An ninh mạng. **Khắc phục:** Áp dụng nguyên tắc \"Suy nghĩ trước khi đăng/chia sẻ\" (Think before you share). Giao tiếp không gian mạng mang lại sự tiện lợi vượt trội nhưng cần đề phòng hiểu nhầm và nguy cơ an toàn. Tôn trọng, lịch sự và nhân văn là nguyên tắc cốt lõi khi tham gia không gian mạng."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B07"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Hiểu và giải thích được cấu trúc cơ bản của một trang web dưới dạng HTML; sử dụng được các thẻ tiêu đề `<h1>`-`<h6>`, thẻ đoạn văn `<p>`, thẻ ngắt dòng `<br>`, đường kẻ ngang `<hr>`."},{"x":"**Năng lực:** Soạn thảo mã HTML chuẩn cấu trúc bằng phần mềm Notepad++/Sublime Text."},{"x":"**Phẩm chất:** Kiên trì, cẩn thận với từng cú pháp mã lệnh."}]}],"key":[{"t":"ul","i":[{"x":"**Khái niệm HTML (HyperText Markup Language):** Ngôn ngữ đánh dấu siêu văn bản, dùng để tạo và dựng cấu trúc cho trang web. Tệp HTML có phần mở rộng `.html` hoặc `.htm`."},{"x":"**Phần tử HTML (HTML Element):** Được định nghĩa bởi thẻ mở `<tag>`, nội dung và thẻ đóng `</tag>`. Một số thẻ đơn không có thẻ đóng như `<br>`, `<hr>`, `<img>`."},{"x":"**Cấu trúc chuẩn của một tệp HTML:**"}]},{"t":"code","l":"html","x":"  <!DOCTYPE html>\n  <html>\n  <head>\n      <meta charset=\"UTF-8\">\n      <title>Tiêu đề trang web</title>\n  </head>\n  <body>\n      <!-- Nội dung hiển thị trên trang web nằm ở đây -->\n  </body>\n  </html>"},{"t":"ul","i":[{"x":"**Các thẻ định dạng cấu trúc văn bản cơ bản:**","c":[{"x":"`<h1>` đến `<h6>`: Thẻ tiêu đề (Heading), `<h1>` là cấp lớn nhất, `<h6>` là cấp nhỏ nhất."},{"x":"`<p>`: Thẻ định nghĩa đoạn văn bản (Paragraph)."},{"x":"`<br>`: Thẻ ngắt dòng (Line break)."},{"x":"`<hr>`: Thẻ chèn đường kẻ ngang phân cách (Horizontal rule)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`HTML (HyperText Markup Language)`: Ngôn ngữ đánh dấu siêu văn bản."},{"x":"`Tag / Element`: Thẻ HTML / Phần tử HTML."},{"x":"`Root Element <html>`: Phần tử gốc của cây trang web."},{"x":"`Notepad++ / Sublime Text`: Phần mềm soạn thảo mã nguồn chuyên nghiệp."}]}],"ex":[{"t":"code","l":"html","x":"<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Trang web đầu tiên</title>\n</head>\n<body>\n    <h1>Chào mừng đến với môn Tin học 12</h1>\n    <p>Đây là đoạn văn bản đầu tiên.<br>Dòng này được xuống dòng bằng thẻ br.</p>\n    <hr>\n</body>\n</html>"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở phần mềm Notepad++ hoặc Text Editor."},{"x":"**B2:** Soạn thảo khung cấu trúc HTML5 chuẩn."},{"x":"**B3:** Thêm các thẻ `<h1>`, `<p>`, `<hr>` vào phần `<body>`."},{"x":"**B4:** Chọn `File` -> `Save As` -> Đặt tên `index.html` (Encoding: UTF-8)."},{"x":"**B5:** Nháy đôi chuột vào tệp `index.html` để xem kết quả hiển thị trên trình duyệt web."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi hiển thị sai phông chữ tiếng Việt (lỗi vỡ font):** Do thiếu thẻ khai báo bảng mã Unicode."},{"x":"**Khắc phục:** Đặt thẻ `<meta charset=\"UTF-8\">` bên trong cặp thẻ `<head></head>` và lưu tệp dưới dạng UTF-8."}]}],"rem":[{"t":"ul","i":[{"x":"HTML là ngôn ngữ đánh dấu dựng cấu trúc trang web; tệp HTML gồm 2 phần chính: `<head>` (thông tin bổ trợ) và `<body>` (nội dung hiển thị)."}]}]},"terms":[{"t":"HTML (HyperText Markup Language)","d":"Ngôn ngữ đánh dấu siêu văn bản."},{"t":"Tag / Element","d":"Thẻ HTML / Phần tử HTML."},{"t":"Root Element <html>","d":"Phần tử gốc của cây trang web."},{"t":"Notepad++ / Sublime Text","d":"Phần mềm soạn thảo mã nguồn chuyên nghiệp."}],"txt":"**Kiến thức:** Hiểu và giải thích được cấu trúc cơ bản của một trang web dưới dạng HTML; sử dụng được các thẻ tiêu đề `<h1>`-`<h6>`, thẻ đoạn văn `<p>`, thẻ ngắt dòng `<br>`, đường kẻ ngang `<hr>`. **Năng lực:** Soạn thảo mã HTML chuẩn cấu trúc bằng phần mềm Notepad++/Sublime Text. **Phẩm chất:** Kiên trì, cẩn thận với từng cú pháp mã lệnh. **Khái niệm HTML (HyperText Markup Language):** Ngôn ngữ đánh dấu siêu văn bản, dùng để tạo và dựng cấu trúc cho trang web. Tệp HTML có phần mở rộng `.html` hoặc `.htm`. **Phần tử HTML (HTML Element):** Được định nghĩa bởi thẻ mở `<tag>`, nội dung và thẻ đóng `</tag>`. Một số thẻ đơn không có thẻ đóng như `<br>`, `<hr>`, `<img>`. **Cấu trúc chuẩn của một tệp HTML:**   <!DOCTYPE html>\n  <html>\n  <head>\n      <meta charset=\"UTF-8\">\n      <title>Tiêu đề trang web</title>\n  </head>\n  <body>\n      <!-- Nội dung hiển thị trên trang web nằm ở đây -->\n  </body>\n  </html> **Các thẻ định dạng cấu trúc văn bản cơ bản:** `<h1>` đến `<h6>`: Thẻ tiêu đề (Heading), `<h1>` là cấp lớn nhất, `<h6>` là cấp nhỏ nhất. `<p>`: Thẻ định nghĩa đoạn văn bản (Paragraph). `<br>`: Thẻ ngắt dòng (Line break). `<hr>`: Thẻ chèn đường kẻ ngang phân cách (Horizontal rule). `HTML (HyperText Markup Language)`: Ngôn ngữ đánh dấu siêu văn bản. `Tag / Element`: Thẻ HTML / Phần tử HTML. `Root Element <html>`: Phần tử gốc của cây trang web. `Notepad++ / Sublime Text`: Phần mềm soạn thảo mã nguồn chuyên nghiệp. <!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Trang web đầu tiên</title>\n</head>\n<body>\n    <h1>Chào mừng đến với môn Tin học 12</h1>\n    <p>Đây là đoạn văn bản đầu tiên.<br>Dòng này được xuống dòng bằng thẻ br.</p>\n    <hr>\n</body>\n</html> **B1:** Mở phần mềm Notepad++ hoặc Text Editor. **B2:** Soạn thảo khung cấu trúc HTML5 chuẩn. **B3:** Thêm các thẻ `<h1>`, `<p>`, `<hr>` vào phần `<body>`. **B4:** Chọn `File` -> `Save As` -> Đặt tên `index.html` (Encoding: UTF-8). **B5:** Nháy đôi chuột vào tệp `index.html` để xem kết quả hiển thị trên trình duyệt web. **Lỗi hiển thị sai phông chữ tiếng Việt (lỗi vỡ font):** Do thiếu thẻ khai báo bảng mã Unicode. **Khắc phục:** Đặt thẻ `<meta charset=\"UTF-8\">` bên trong cặp thẻ `<head></head>` và lưu tệp dưới dạng UTF-8. HTML là ngôn ngữ đánh dấu dựng cấu trúc trang web; tệp HTML gồm 2 phần chính: `<head>` (thông tin bổ trợ) và `<body>` (nội dung hiển thị)."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B08"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Sử dụng được các thẻ HTML định dạng văn bản: in đậm `<b>`, `<strong>`, in nghiêng `<i>`, `<em>`, gạch chân `<u>`, chỉ số trên `<sup>`, chỉ số dưới `<sub>`."},{"x":"**Năng lực:** Thiết kế nội dung văn bản trang web sinh động, nhấn mạnh thông tin cốt lõi."},{"x":"**Phẩm chất:** Tỉ mỉ, có thẩm mỹ trong trình bày văn bản."}]}],"key":[{"t":"ul","i":[{"x":"**Phân biệt thẻ định dạng kiểu hiển thị và thẻ nhấn mạnh ngữ nghĩa:**","c":[{"x":"`<b>` (Bold) và `<i>` (Italic): Định dạng chữ in đậm/in nghiêng đơn thuần về mặt hiển thị thị giác."},{"x":"`<strong>` và `<em>` (Emphasized): Vừa định dạng in đậm/in nghiêng vừa mang ý nghĩa ngữ nghĩa (Semantic) nhấn mạnh mức độ quan trọng cho máy tìm kiếm (SEO) và trình đọc màn hình."}]},{"x":"**Các thẻ định dạng ký tự khác:**","c":[{"x":"`<u>` (Underline): Định dạng chữ gạch chân."},{"x":"`<sup>` (Superscript): Chỉ số trên (ví dụ biểu thức $X^2$, $E=mc^2$)."},{"x":"`<sub>` (Subscript): Chỉ số dưới (ví dụ công thức hóa học $H_2O$, $CO_2$)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Semantic Tags`: Thẻ ngữ nghĩa (`<strong>`, `<em>`)."},{"x":"`Visual Formatting Tags`: Thẻ định dạng thị giác (`<b>`, `<i>`, `<u>`)."},{"x":"`Superscript / Subscript`: Chỉ số trên `<sup>` / Chỉ số dưới `<sub>`."}]}],"ex":[{"t":"ul","i":[{"x":"Công thức Toán & Hóa trong HTML:"}]},{"t":"code","l":"html","x":"<p>Công thức toán học: (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></p>\n<p>Công thức hóa học của nước: H<sub>2</sub>O</p>\n<p>Lưu ý: <strong>Nộp bài trước 17h00!</strong></p>"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở tệp HTML đã tạo ở Bài 7 bằng Notepad++."},{"x":"**B2:** Đưa các từ/cụm từ cần nhấn mạnh vào trong các cặp thẻ `<b>`, `<i>`, `<strong>`, `<em>`."},{"x":"**B3:** Soạn thảo đoạn văn có chỉ số toán học/hóa học bằng `<sup>` và `<sub>`."},{"x":"**B4:** Lưu tệp và F5 trên trình duyệt để kiểm tra kết quả."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi lồng thẻ sai thứ tự:** Mở thẻ A rồi mở thẻ B nhưng lại đóng thẻ A trước thẻ B (`<b><i>văn bản</b></i>`)."},{"x":"**Khắc phục:** Đảm bảo nguyên tắc \"Thẻ nào mở sau thì đóng trước\" (`<b><i>văn bản</i></b>`)."}]}],"rem":[{"t":"ul","i":[{"x":"Các thẻ `<b>`, `<i>`, `<u>`, `<strong>`, `<em>`, `<sup>`, `<sub>` giúp định dạng kiểu chữ và nhấn mạnh ngữ nghĩa văn bản trong HTML."}]}]},"terms":[{"t":"Semantic Tags","d":"Thẻ ngữ nghĩa (`<strong>`, `<em>`)."},{"t":"Visual Formatting Tags","d":"Thẻ định dạng thị giác (`<b>`, `<i>`, `<u>`)."},{"t":"Superscript / Subscript","d":"Chỉ số trên `<sup>` / Chỉ số dưới `<sub>`."}],"txt":"**Kiến thức:** Sử dụng được các thẻ HTML định dạng văn bản: in đậm `<b>`, `<strong>`, in nghiêng `<i>`, `<em>`, gạch chân `<u>`, chỉ số trên `<sup>`, chỉ số dưới `<sub>`. **Năng lực:** Thiết kế nội dung văn bản trang web sinh động, nhấn mạnh thông tin cốt lõi. **Phẩm chất:** Tỉ mỉ, có thẩm mỹ trong trình bày văn bản. **Phân biệt thẻ định dạng kiểu hiển thị và thẻ nhấn mạnh ngữ nghĩa:** `<b>` (Bold) và `<i>` (Italic): Định dạng chữ in đậm/in nghiêng đơn thuần về mặt hiển thị thị giác. `<strong>` và `<em>` (Emphasized): Vừa định dạng in đậm/in nghiêng vừa mang ý nghĩa ngữ nghĩa (Semantic) nhấn mạnh mức độ quan trọng cho máy tìm kiếm (SEO) và trình đọc màn hình. **Các thẻ định dạng ký tự khác:** `<u>` (Underline): Định dạng chữ gạch chân. `<sup>` (Superscript): Chỉ số trên (ví dụ biểu thức $X^2$, $E=mc^2$). `<sub>` (Subscript): Chỉ số dưới (ví dụ công thức hóa học $H_2O$, $CO_2$). `Semantic Tags`: Thẻ ngữ nghĩa (`<strong>`, `<em>`). `Visual Formatting Tags`: Thẻ định dạng thị giác (`<b>`, `<i>`, `<u>`). `Superscript / Subscript`: Chỉ số trên `<sup>` / Chỉ số dưới `<sub>`. Công thức Toán & Hóa trong HTML: <p>Công thức toán học: (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></p>\n<p>Công thức hóa học của nước: H<sub>2</sub>O</p>\n<p>Lưu ý: <strong>Nộp bài trước 17h00!</strong></p> **B1:** Mở tệp HTML đã tạo ở Bài 7 bằng Notepad++. **B2:** Đưa các từ/cụm từ cần nhấn mạnh vào trong các cặp thẻ `<b>`, `<i>`, `<strong>`, `<em>`. **B3:** Soạn thảo đoạn văn có chỉ số toán học/hóa học bằng `<sup>` và `<sub>`. **B4:** Lưu tệp và F5 trên trình duyệt để kiểm tra kết quả. **Lỗi lồng thẻ sai thứ tự:** Mở thẻ A rồi mở thẻ B nhưng lại đóng thẻ A trước thẻ B (`<b><i>văn bản</b></i>`). **Khắc phục:** Đảm bảo nguyên tắc \"Thẻ nào mở sau thì đóng trước\" (`<b><i>văn bản</i></b>`). Các thẻ `<b>`, `<i>`, `<u>`, `<strong>`, `<em>`, `<sup>`, `<sub>` giúp định dạng kiểu chữ và nhấn mạnh ngữ nghĩa văn bản trong HTML."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B09"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Sử dụng được thẻ HTML tạo danh sách có thứ tự `<ol>`, danh sách không có thứ tự `<ul>`, danh sách lồng nhau; tạo bảng `<table>` với các thẻ `<tr>`, `<td>`, `<th>`, gộp ô `rowspan`, `colspan`."},{"x":"**Năng lực:** Biểu diễn dữ liệu dạng danh mục và bảng biểu khoa học trên trang web."},{"x":"**Phẩm chất:** Tư duy logic, sắp xếp thông tin ngăn nắp."}]}],"key":[{"t":"ul","i":[{"x":"**Tạo danh sách trong HTML:**","c":[{"x":"**Danh sách không có thứ tự (`<ul>` - Unordered List):** Các mục hiển thị dưới dạng dấu chấm tròn (`bullet`). Mỗi mục đặt trong cặp thẻ `<li>` (List Item)."},{"x":"**Danh sách có thứ tự (`<ol>` - Ordered List):** Các mục được đánh số thứ tự (1, 2, 3... hoặc a, b, c... với thuộc tính `type=\"a\"`)."},{"x":"**Danh sách lồng nhau:** Đặt một danh sách `<ol>` hoặc `<ul>` bên trong một thẻ `<li>` của danh sách cha."}]},{"x":"**Tạo bảng trong HTML (`<table>`):**","c":[{"x":"`<table>`: Thẻ bao quanh toàn bộ bảng."},{"x":"`<caption>`: Tiêu đề của bảng."},{"x":"`<tr>` (Table Row): Định nghĩa một hàng trong bảng."},{"x":"`<th>` (Table Header): Thẻ định dạng ô tiêu đề cột/hàng (chữ in đậm, căn giữa)."},{"x":"`<td>` (Table Data): Thẻ định nghĩa ô chứa dữ liệu thông thường."},{"x":"**Gộp ô trong bảng:**","c":[{"x":"`colspan=\"n\"`: Gộp $n$ cột liên tiếp trên cùng một hàng."},{"x":"`rowspan=\"m\"`: Gộp $m$ hàng liên tiếp trên cùng một cột."}]}]}]}],"terms":[{"t":"ul","i":[{"x":"`Unordered List <ul>`: Danh sách không thứ tự."},{"x":"`Ordered List <ol>`: Danh sách có thứ tự."},{"x":"`Table Elements`: `<table>`, `<tr>`, `<th>`, `<td>`, `<caption>`."},{"x":"`Colspan / Rowspan`: Thuộc tính gộp cột / gộp hàng."}]}],"ex":[{"t":"code","l":"html","x":"<table border=\"1\">\n  <caption>Lịch hoạt động CLB</caption>\n  <tr>\n    <th rowspan=\"2\">STT</th>\n    <th colspan=\"2\">Thời gian</th>\n  </tr>\n  <tr>\n    <th>Sáng</th>\n    <th>Chiều</th>\n  </tr>\n</table>"}],"steps":[{"t":"ul","i":[{"x":"**Nhiệm vụ 1 (Tạo danh sách câu lạc bộ):**","c":[{"x":"**B1:** Tạo thẻ `<h2>Danh sách CLB</h2>`."},{"x":"**B2:** Mở thẻ `<ul>`."},{"x":"**B3:** Tạo `<li>THỂ THAO</li>`, bên trong lồng `<ol type=\"1\"><li>Bóng đá</li></ol>`."},{"x":"**B4:** Đóng các thẻ `</ul>`."}]},{"x":"**Nhiệm vụ 2 (Tạo bảng lịch hoạt động):**","c":[{"x":"**B1:** Mở thẻ `<table border=\"1\">`."},{"x":"**B2:** Viết hàng 1 `<tr>` chứa các thẻ `<th>` kèm `rowspan`/`colspan`."},{"x":"**B3:** Viết các hàng dữ liệu `<tr>` chứa `<td>`."},{"x":"**B4:** Lưu tệp thành `CLB.html`."}]}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi vỡ khung bảng khi gộp ô:** Quên xóa bỏ các ô `<td>` dư thừa ở các hàng/cột bị gộp."},{"x":"**Khắc phục:** Khi gộp $n$ ô bằng `colspan` hoặc `rowspan`, phải giảm bớt $n-1$ thẻ `<td>` tương ứng ở các vị trí bị lấn chiếm."}]}],"rem":[{"t":"ul","i":[{"x":"`<ul>` và `<ol>` dùng tạo danh sách; `<table>`, `<tr>`, `<td>`, `<th>` dùng tạo bảng; `colspan` gộp cột, `rowspan` gộp hàng."}]}]},"terms":[{"t":"Unordered List <ul>","d":"Danh sách không thứ tự."},{"t":"Ordered List <ol>","d":"Danh sách có thứ tự."},{"t":"Table Elements","d":"`<table>`, `<tr>`, `<th>`, `<td>`, `<caption>`."},{"t":"Colspan / Rowspan","d":"Thuộc tính gộp cột / gộp hàng."}],"txt":"**Kiến thức:** Sử dụng được thẻ HTML tạo danh sách có thứ tự `<ol>`, danh sách không có thứ tự `<ul>`, danh sách lồng nhau; tạo bảng `<table>` với các thẻ `<tr>`, `<td>`, `<th>`, gộp ô `rowspan`, `colspan`. **Năng lực:** Biểu diễn dữ liệu dạng danh mục và bảng biểu khoa học trên trang web. **Phẩm chất:** Tư duy logic, sắp xếp thông tin ngăn nắp. **Tạo danh sách trong HTML:** **Danh sách không có thứ tự (`<ul>` - Unordered List):** Các mục hiển thị dưới dạng dấu chấm tròn (`bullet`). Mỗi mục đặt trong cặp thẻ `<li>` (List Item). **Danh sách có thứ tự (`<ol>` - Ordered List):** Các mục được đánh số thứ tự (1, 2, 3... hoặc a, b, c... với thuộc tính `type=\"a\"`). **Danh sách lồng nhau:** Đặt một danh sách `<ol>` hoặc `<ul>` bên trong một thẻ `<li>` của danh sách cha. **Tạo bảng trong HTML (`<table>`):** `<table>`: Thẻ bao quanh toàn bộ bảng. `<caption>`: Tiêu đề của bảng. `<tr>` (Table Row): Định nghĩa một hàng trong bảng. `<th>` (Table Header): Thẻ định dạng ô tiêu đề cột/hàng (chữ in đậm, căn giữa). `<td>` (Table Data): Thẻ định nghĩa ô chứa dữ liệu thông thường. **Gộp ô trong bảng:** `colspan=\"n\"`: Gộp $n$ cột liên tiếp trên cùng một hàng. `rowspan=\"m\"`: Gộp $m$ hàng liên tiếp trên cùng một cột. `Unordered List <ul>`: Danh sách không thứ tự. `Ordered List <ol>`: Danh sách có thứ tự. `Table Elements`: `<table>`, `<tr>`, `<th>`, `<td>`, `<caption>`. `Colspan / Rowspan`: Thuộc tính gộp cột / gộp hàng. <table border=\"1\">\n  <caption>Lịch hoạt động CLB</caption>\n  <tr>\n    <th rowspan=\"2\">STT</th>\n    <th colspan=\"2\">Thời gian</th>\n  </tr>\n  <tr>\n    <th>Sáng</th>\n    <th>Chiều</th>\n  </tr>\n</table> **Nhiệm vụ 1 (Tạo danh sách câu lạc bộ):** **B1:** Tạo thẻ `<h2>Danh sách CLB</h2>`. **B2:** Mở thẻ `<ul>`. **B3:** Tạo `<li>THỂ THAO</li>`, bên trong lồng `<ol type=\"1\"><li>Bóng đá</li></ol>`. **B4:** Đóng các thẻ `</ul>`. **Nhiệm vụ 2 (Tạo bảng lịch hoạt động):** **B1:** Mở thẻ `<table border=\"1\">`. **B2:** Viết hàng 1 `<tr>` chứa các thẻ `<th>` kèm `rowspan`/`colspan`. **B3:** Viết các hàng dữ liệu `<tr>` chứa `<td>`. **B4:** Lưu tệp thành `CLB.html`. **Lỗi vỡ khung bảng khi gộp ô:** Quên xóa bỏ các ô `<td>` dư thừa ở các hàng/cột bị gộp. **Khắc phục:** Khi gộp $n$ ô bằng `colspan` hoặc `rowspan`, phải giảm bớt $n-1$ thẻ `<td>` tương ứng ở các vị trí bị lấn chiếm. `<ul>` và `<ol>` dùng tạo danh sách; `<table>`, `<tr>`, `<td>`, `<th>` dùng tạo bảng; `colspan` gộp cột, `rowspan` gộp hàng."};

yệt. **Các loại đường dẫn (Path):** **Đường dẫn tuyệt đối (Absolute Path):** Chỉ định địa chỉ đầy đủ bao gồm cả giao thức và tên miền (VD: `https://www.google.com/`). Dùng khi liên kết tới trang web bên ngoài. **Đường dẫn tương đối (Relative Path):** Chỉ định vị trí tệp tính từ thư mục hiện hành. Cùng thư mục: `href=\"thong_tin.html\"`. Thư mục con: `href=\"project/product.html\"`. Thư mục cha (lên 1 cấp): `href=\"../index.html\"`. **Liên kết đến một vị trí trong cùng trang web (Anchor Link):** **B1:** Đặt mã định danh cho phần tử đích bằng thuộc tính `id` (VD: `<h2 id=\"lich_hd\">Lịch hoạt động</h2>`). **B2:** Tạo liên kết tới mã định danh đó bằng dấu `#` (VD: `<a href=\"#lich_hd\">Xem lịch</a>`). `Hyperlink / Anchor Tag <a>`: Siêu liên kết / Thẻ liên kết. `href attribute`: Thuộc tính chứa địa chỉ liên kết. `Absolute Path vs Relative Path`: Đường dẫn tuyệt đối vs Đường dẫn tương đối. `ID Selector / Anchor Link`: Liên kết nội bộ trang bằng mã định danh `#id`. <!-- Liên kết ngoài -->\n<a href=\"https://www.google.com\" target=\"_blank\">Tìm kiếm trên Google</a>\n\n<!-- Liên kết tương đối đến trang cùng thư mục -->\n<a href=\"thong_tin.html\">Xem thông tin chi tiết</a>\n\n<!-- Liên kết nội bộ trong cùng trang -->\n<a href=\"#phan_cuoi\">Cuộn xuống phần cuối trang</a> **Nhiệm vụ 1 (Liên kết trong trang):** Thêm thuộc tính `id=\"lich_CLB\"` vào bảng trong tệp `CLB.html`, sau đó thêm `<a href=\"#lich_CLB\">Theo dõi lịch</a>` ở đầu trang. **Nhiệm vụ 2 (Liên kết trang khác):** Tạo tệp `thong_tin.html`. Trong tệp `CLB.html`, chèn `<a href=\"thong_tin.html\">Thông tin CLB</a>`. **Lỗi `404 Not Found` do sai đường dẫn tương đối:** Gõ sai tên tệp, sai chữ hoa/thường hoặc thiếu kí tự `../` khi ra khỏi thư mục cha. **Khắc phục:** Kiểm tra kỹ cấu trúc thư mục chứa các tệp `.html` và đặt tên tệp thống nhất viết thường không dấu. Thẻ `<a>` với thuộc tính `href` dùng tạo siêu liên kết; phân biệt rõ đường dẫn tuyệt đối (trang ngoài) và tương đối (trang trong nội bộ)."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B11"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Sử dụng các thẻ `<img>`, `<video>`, `<audio>`, `<iframe>` để chèn hình ảnh, video, âm thanh và khung nội tuyến vào trang web; tùy chỉnh thuộc tính kích thước và điều khiển."},{"x":"**Năng lực:** Thiết kế trang web đa phương tiện phong phú, tương tác cao."},{"x":"**Phẩm chất:** Tôn trọng bản quyền nội dung hình ảnh, âm thanh đa phương tiện."}]}],"key":[{"t":"ul","i":[{"x":"**Chèn hình ảnh (`<img>`):**","c":[{"x":"Thẻ đơn. Cú pháp: `<img src=\"duong_dan_anh\" alt=\"van_ban_thay_the\" width=\"600\" height=\"400\">`."},{"x":"Thuộc tính bắt buộc: `src` (đường dẫn tệp ảnh)."},{"x":"Thuộc tính `alt`: Hiển thị văn bản thay thế nếu ảnh bị lỗi không tải được."}]},{"x":"**Chèn âm thanh (`<audio>`) và Video (`<video>`):**","c":[{"x":"Cú pháp: `<video src=\"video.mp4\" controls width=\"500\" poster=\"anh_bia.jpg\"></video>`."},{"x":"Thuộc tính `controls`: Hiển thị thanh điều khiển (Phát, Dừng, Âm lượng)."},{"x":"Thuộc tính `autoplay`: Tự động phát khi tải trang."},{"x":"Thẻ con `<source>`: Dùng khi cung cấp nhiều định dạng tệp khác nhau (`.mp4`, `.webm`, `.mp3`, `.ogg`) cho trình duyệt chọn lựa."}]},{"x":"**Khung nội tuyến (`<iframe>` - Inline Frame):**","c":[{"x":"Dùng để nhúng một trang web khác hoặc nội dung khác vào trong một vùng của trang web hiện tại."},{"x":"Kết hợp `<iframe>` và thẻ `<a>`: Đặt mã định danh `name=\"myFrame\"` cho `<iframe>`, thẻ liên kết dùng thuộc tính `target=\"myFrame\"` để mở trang web đích ngay trong khung nhìn iframe đó."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Image Tag <img>`: Thẻ chèn hình ảnh (`src`, `alt`, `width`, `height`)."},{"x":"`Audio & Video Tags`: Thẻ chèn tệp âm thanh và video (`controls`, `autoplay`, `poster`)."},{"x":"`Inline Frame <iframe>`: Khung nội tuyến nhúng trang web."},{"x":"`Target Attribute`: Thuộc tính chỉ định khung hiển thị đích cho liên kết."}]}],"ex":[{"t":"code","l":"html","x":"<!-- Chèn ảnh -->\n<img src=\"images/thethao.png\" alt=\"CLB Thể Thao\" width=\"400\">\n\n<!-- Chèn khung nội tuyến và liên kết điều khiển -->\n<a href=\"the_thao.html\" target=\"content_frame\">Xem CLB Thể Thao</a> | \n<a href=\"nghe_thuat.html\" target=\"content_frame\">Xem CLB Nghệ Thuật</a>\n<br><br>\n<iframe name=\"content_frame\" width=\"100%\" height=\"400px\" src=\"the_thao.html\"></iframe>"}],"steps":[{"t":"ul","i":[{"x":"**Nhiệm vụ 1:** Tạo thư mục `images`, sao chép ảnh vào. Dùng thẻ `<img>` chèn vào `the_thao.html`."},{"x":"**Nhiệm vụ 2:** Chèn tệp nhạc `quoc_ca.mp3` bằng thẻ `<audio controls src=\"quoc_ca.mp3\"></audio>`."},{"x":"**Nhiệm vụ 3:** Trong `index.html`, tạo phần tử `<iframe name=\"view_box\"></iframe>`, tạo các thẻ `<a>` với `target=\"view_box\"`."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi ảnh bị méo tỷ lệ:** Tự thiết lập cả `width` và `height` không theo đúng tỷ lệ gốc của ảnh."},{"x":"**Khắc phục:** Chỉ nên thiết lập một trong hai thuộc tính (`width` hoặc `height`), trình duyệt sẽ tự động điều chỉnh thuộc tính còn lại theo tỷ lệ chuẩn."}]}],"rem":[{"t":"ul","i":[{"x":"`<img>` chèn ảnh, `<audio>` chèn nhạc, `<video>` chèn phim, `<iframe>` tạo khung nội tuyến nhúng trang."}]}]},"terms":[{"t":"Image Tag <img>","d":"Thẻ chèn hình ảnh (`src`, `alt`, `width`, `height`)."},{"t":"Audio & Video Tags","d":"Thẻ chèn tệp âm thanh và video (`controls`, `autoplay`, `poster`)."},{"t":"Inline Frame <iframe>","d":"Khung nội tuyến nhúng trang web."},{"t":"Target Attribute","d":"Thuộc tính chỉ định khung hiển thị đích cho liên kết."}],"txt":"**Kiến thức:** Sử dụng các thẻ `<img>`, `<video>`, `<audio>`, `<iframe>` để chèn hình ảnh, video, âm thanh và khung nội tuyến vào trang web; tùy chỉnh thuộc tính kích thước và điều khiển. **Năng lực:** Thiết kế trang web đa phương tiện phong phú, tương tác cao. **Phẩm chất:** Tôn trọng bản quyền nội dung hình ảnh, âm thanh đa phương tiện. **Chèn hình ảnh (`<img>`):** Thẻ đơn. Cú pháp: `<img src=\"duong_dan_anh\" alt=\"van_ban_thay_the\" width=\"600\" height=\"400\">`. Thuộc tính bắt buộc: `src` (đường dẫn tệp ảnh). Thuộc tính `alt`: Hiển thị văn bản thay thế nếu ảnh bị lỗi không tải được. **Chèn âm thanh (`<audio>`) và Video (`<video>`):** Cú pháp: `<video src=\"video.mp4\" controls width=\"500\" poster=\"anh_bia.jpg\"></video>`. Thuộc tính `controls`: Hiển thị thanh điều khiển (Phát, Dừng, Âm lượng). Thuộc tính `autoplay`: Tự động phát khi tải trang. Thẻ con `<source>`: Dùng khi cung cấp nhiều định dạng tệp khác nhau (`.mp4`, `.webm`, `.mp3`, `.ogg`) cho trình duyệt chọn lựa. **Khung nội tuyến (`<iframe>` - Inline Frame):** Dùng để nhúng một trang web khác hoặc nội dung khác vào trong một vùng của trang web hiện tại. Kết hợp `<iframe>` và thẻ `<a>`: Đặt mã định danh `name=\"myFrame\"` cho `<iframe>`, thẻ liên kết dùng thuộc tính `target=\"myFrame\"` để mở trang web đích ngay trong khung nhìn iframe đó. `Image Tag <img>`: Thẻ chèn hình ảnh (`src`, `alt`, `width`, `height`). `Audio & Video Tags`: Thẻ chèn tệp âm thanh và video (`controls`, `autoplay`, `poster`). `Inline Frame <iframe>`: Khung nội tuyến nhúng trang web. `Target Attribute`: Thuộc tính chỉ định khung hiển thị đích cho liên kết. <!-- Chèn ảnh -->\n<img src=\"images/thethao.png\" alt=\"CLB Thể Thao\" width=\"400\">\n\n<!-- Chèn khung nội tuyến và liên kết điều khiển -->\n<a href=\"the_thao.html\" target=\"content_frame\">Xem CLB Thể Thao</a> | \n<a href=\"nghe_thuat.html\" target=\"content_frame\">Xem CLB Nghệ Thuật</a>\n<br><br>\n<iframe name=\"content_frame\" width=\"100%\" height=\"400px\" src=\"the_thao.html\"></iframe> **Nhiệm vụ 1:** Tạo thư mục `images`, sao chép ảnh vào. Dùng thẻ `<img>` chèn vào `the_thao.html`. **Nhiệm vụ 2:** Chèn tệp nhạc `quoc_ca.mp3` bằng thẻ `<audio controls src=\"quoc_ca.mp3\"></audio>`. **Nhiệm vụ 3:** Trong `index.html`, tạo phần tử `<iframe name=\"view_box\"></iframe>`, tạo các thẻ `<a>` với `target=\"view_box\"`. **Lỗi ảnh bị méo tỷ lệ:** Tự thiết lập cả `width` và `height` không theo đúng tỷ lệ gốc của ảnh. **Khắc phục:** Chỉ nên thiết lập một trong hai thuộc tính (`width` hoặc `height`), trình duyệt sẽ tự động điều chỉnh thuộc tính còn lại theo tỷ lệ chuẩn. `<img>` chèn ảnh, `<audio>` chèn nhạc, `<video>` chèn phim, `<iframe>` tạo khung nội tuyến nhúng trang."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B12"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Sử dụng thẻ `<form>` và các thẻ thành phần `<input>`, `<textarea>`, `<select>`, `<button>` để tạo biểu mẫu thu thập dữ liệu từ người dùng."},{"x":"**Năng lực:** Thiết kế giao diện tương tác người dùng (đăng ký, đăng nhập, khảo sát)."},{"x":"**Phẩm chất:** Cẩn trọng trong thiết kế trường dữ liệu và bảo mật mật khẩu."}]}],"key":[{"t":"ul","i":[{"x":"**Khái niệm Biểu mẫu (`<form>`):** Dùng để thu thập thông tin phản hồi, dữ liệu nhập vào từ người dùng trên trang web và gửi về máy chủ xử lý."},{"x":"**Cấu trúc thẻ `<form>`:**","c":[{"x":"Cú pháp: `<form action=\"xu_ly.php\" method=\"POST\"> ... </form>`."},{"x":"Thuộc tính `action`: Địa chỉ tệp/trang nhận dữ liệu xử lý."},{"x":"Thuộc tính `method`: Phương thức gửi dữ liệu (`GET` hoặc `POST`)."}]},{"x":"**Các loại phần tử nhập dữ liệu (`<input>`):**","c":[{"x":"`type=\"text\"`: Ô nhập văn bản một dòng (Họ tên, địa chỉ)."},{"x":"`type=\"password\"`: Ô nhập mật khẩu (ký tự bị che thành dấu chấm)."},{"x":"`type=\"radio\"`: Nút chọn một trong nhiều lựa chọn (Giới tính: Nam/Nữ). Cần chung thuộc tính `name`."},{"x":"`type=\"checkbox\"`: Ô tích chọn nhiều lựa chọn độc lập (Sở thích)."},{"x":"`type=\"file\"`: Tải tệp tin từ máy tính lên trang web."},{"x":"`type=\"submit\"`: Nút gửi dữ liệu biểu mẫu."},{"x":"`type=\"reset\"`: Nút xóa làm lại dữ liệu nhập."}]},{"x":"**Các thẻ phần tử biểu mẫu khác:**","c":[{"x":"`<textarea rows=\"4\" cols=\"50\">`: Ô nhập văn bản nhiều dòng (Góp ý, nội dung)."},{"x":"`<select>` và `<option>`: Danh sách cuộn chọn giá trị (Tỉnh/Thành phố)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`Form Element <form>`: Thẻ biểu mẫu tương tác."},{"x":"`Input Types`: `text`, `password`, `radio`, `checkbox`, `file`, `submit`, `reset`."},{"x":"`Textarea`: Vùng nhập văn bản nhiều dòng."},{"x":"`Select & Option`: Bảng chọn thả xuống (Dropdown list)."}]}],"ex":[{"t":"code","l":"html","x":"<form action=\"#\" method=\"POST\">\n    <label>Họ và tên:</label>\n    <input type=\"text\" name=\"txtHoTen\"><br>\n    <label>Giới tính:</label>\n    <input type=\"radio\" name=\"gender\" value=\"Nam\"> Nam\n    <input type=\"radio\" name=\"gender\" value=\"Nu\"> Nữ<br>\n    <label>Góp ý:</label><br>\n    <textarea name=\"txtGopY\" rows=\"3\"></textarea><br>\n    <input type=\"submit\" value=\"Gửi thông tin\">\n</form>"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở thẻ `<form>`."},{"x":"**B2:** Soạn thảo các nhãn `<label>` và phần tử nhập liệu `<input type=\"...\">`."},{"x":"**B3:** Tạo nút `Submit` để gửi biểu mẫu."},{"x":"**B4:** Nhúng trang biểu mẫu vừa tạo vào khung `<iframe>` của trang chính bài học trước."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi chọn được nhiều nút Radio cùng lúc:** Quên không đặt chung thuộc tính `name` cho các ô Radio trong cùng một nhóm."},{"x":"**Khắc phục:** Đặt thuộc tính `name` giống hệt nhau cho tất cả các lựa chọn Radio thuộc cùng 1 câu hỏi (VD: `name=\"gioitinh\"`)."}]}],"rem":[{"t":"ul","i":[{"x":"Biểu mẫu `<form>` chứa các phần tử `<input>`, `<textarea>`, `<select>` giúp thu thập dữ liệu người dùng trên trang web."}]}]},"terms":[{"t":"Form Element <form>","d":"Thẻ biểu mẫu tương tác."},{"t":"Input Types","d":"`text`, `password`, `radio`, `checkbox`, `file`, `submit`, `reset`."},{"t":"Textarea","d":"Vùng nhập văn bản nhiều dòng."},{"t":"Select & Option","d":"Bảng chọn thả xuống (Dropdown list)."}],"txt":"**Kiến thức:** Sử dụng thẻ `<form>` và các thẻ thành phần `<input>`, `<textarea>`, `<select>`, `<button>` để tạo biểu mẫu thu thập dữ liệu từ người dùng. **Năng lực:** Thiết kế giao diện tương tác người dùng (đăng ký, đăng nhập, khảo sát). **Phẩm chất:** Cẩn trọng trong thiết kế trường dữ liệu và bảo mật mật khẩu. **Khái niệm Biểu mẫu (`<form>`):** Dùng để thu thập thông tin phản hồi, dữ liệu nhập vào từ người dùng trên trang web và gửi về máy chủ xử lý. **Cấu trúc thẻ `<form>`:** Cú pháp: `<form action=\"xu_ly.php\" method=\"POST\"> ... </form>`. Thuộc tính `action`: Địa chỉ tệp/trang nhận dữ liệu xử lý. Thuộc tính `method`: Phương thức gửi dữ liệu (`GET` hoặc `POST`). **Các loại phần tử nhập dữ liệu (`<input>`):** `type=\"text\"`: Ô nhập văn bản một dòng (Họ tên, địa chỉ). `type=\"password\"`: Ô nhập mật khẩu (ký tự bị che thành dấu chấm). `type=\"radio\"`: Nút chọn một trong nhiều lựa chọn (Giới tính: Nam/Nữ). Cần chung thuộc tính `name`. `type=\"checkbox\"`: Ô tích chọn nhiều lựa chọn độc lập (Sở thích). `type=\"file\"`: Tải tệp tin từ máy tính lên trang web. `type=\"submit\"`: Nút gửi dữ liệu biểu mẫu. `type=\"reset\"`: Nút xóa làm lại dữ liệu nhập. **Các thẻ phần tử biểu mẫu khác:** `<textarea rows=\"4\" cols=\"50\">`: Ô nhập văn bản nhiều dòng (Góp ý, nội dung). `<select>` và `<option>`: Danh sách cuộn chọn giá trị (Tỉnh/Thành phố). `Form Element <form>`: Thẻ biểu mẫu tương tác. `Input Types`: `text`, `password`, `radio`, `checkbox`, `file`, `submit`, `reset`. `Textarea`: Vùng nhập văn bản nhiều dòng. `Select & Option`: Bảng chọn thả xuống (Dropdown list). <form action=\"#\" method=\"POST\">\n    <label>Họ và tên:</label>\n    <input type=\"text\" name=\"txtHoTen\"><br>\n    <label>Giới tính:</label>\n    <input type=\"radio\" name=\"gender\" value=\"Nam\"> Nam\n    <input type=\"radio\" name=\"gender\" value=\"Nu\"> Nữ<br>\n    <label>Góp ý:</label><br>\n    <textarea name=\"txtGopY\" rows=\"3\"></textarea><br>\n    <input type=\"submit\" value=\"Gửi thông tin\">\n</form> **B1:** Mở thẻ `<form>`. **B2:** Soạn thảo các nhãn `<label>` và phần tử nhập liệu `<input type=\"...\">`. **B3:** Tạo nút `Submit` để gửi biểu mẫu. **B4:** Nhúng trang biểu mẫu vừa tạo vào khung `<iframe>` của trang chính bài học trước. **Lỗi chọn được nhiều nút Radio cùng lúc:** Quên không đặt chung thuộc tính `name` cho các ô Radio trong cùng một nhóm. **Khắc phục:** Đặt thuộc tính `name` giống hệt nhau cho tất cả các lựa chọn Radio thuộc cùng 1 câu hỏi (VD: `name=\"gioitinh\"`). Biểu mẫu `<form>` chứa các phần tử `<input>`, `<textarea>`, `<select>` giúp thu thập dữ liệu người dùng trên trang web."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B13"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Hiểu được khái niệm, vai trò và ý nghĩa của mẫu định dạng CSS (Cascading Style Sheets) trong việc thiết kế trình bày trang web; nắm được 3 cách thiết lập CSS."},{"x":"**Năng lực:** Tách biệt giữa nội dung (HTML) và định dạng trình bày (CSS)."},{"x":"**Phẩm chất:** Tư duy quản lý mã nguồn hệ thống khoa học, tối ưu."}]}],"key":[{"t":"ul","i":[{"x":"**Khái niệm CSS (Cascading Style Sheets):** Là ngôn ngữ quy định cách các phần tử HTML hiển thị trên màn hình (màu sắc, phông chữ, khoảng cách, bố cục)."},{"x":"**Vai trò của CSS:**","c":[{"x":"Tách biệt công việc nhập nội dung (HTML) và công việc trang trí định dạng (CSS)."},{"x":"Tiết kiệm thời gian: Chỉ cần chỉnh sửa một tệp CSS ngoài (`.css`) có thể thay đổi giao diện của toàn bộ website gồm hàng trăm trang web."},{"x":"Giúp trang web tải nhanh hơn và nhất quán về phong cách thiết kế."}]},{"x":"**Cấu trúc một quy tắc CSS (CSS Rule):**","c":[{"x":"Cú pháp: `Bộ_chọn { Thuộc_tính: Giá_trị; }` (VD: `h1 { color: red; font-size: 20px; }`)."},{"x":"**Bộ chọn (Selector):** Chỉ định phần tử HTML cần áp dụng định dạng."},{"x":"**Khối khai báo (Declaration Block):** Đặt trong cặp dấu ngoặc nhọn `{}` chứa các cặp `Thuộc_tính: Giá_trị;`."}]},{"x":"**3 cách nhúng CSS vào trang HTML:**","c":[{"x":"**CSS nội tuyến (Inline CSS):** Viết trực tiếp trong thuộc tính `style=\"...\"` của thẻ HTML."},{"x":"**CSS trong (Internal CSS):** Viết bên trong cặp thẻ `<style></style>` đặt tại phần `<head>` của trang HTML."},{"x":"**CSS ngoài (External CSS):** Viết trong tệp `.css` độc lập và liên kết vào trang HTML bằng thẻ `<link rel=\"stylesheet\" href=\"style.css\">`. (Cách tối ưu nhất)."}]}]}],"terms":[{"t":"ul","i":[{"x":"`CSS (Cascading Style Sheets)`: Tập mẫu định dạng xếp chồng."},{"x":"`Selector`: Bộ chọn CSS."},{"x":"`Inline / Internal / External CSS`: CSS nội tuyến / CSS trong / CSS ngoài."},{"x":"`<link rel=\"stylesheet\">`: Thẻ liên kết tệp CSS bên ngoài vào trang HTML."}]}],"ex":[{"t":"code","l":"css","x":"/* Tệp style.css độc lập */\np {\n    color: brown;\n    font-size: 14px;\n    text-align: justify;\n}"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Tạo tệp mới `mystyle.css` trong cùng thư mục với trang HTML."},{"x":"**B2:** Soạn thảo các quy tắc CSS cho thẻ `body`, `h1`, `p`."},{"x":"**B3:** Mở tệp HTML, chèn `<link rel=\"stylesheet\" href=\"mystyle.css\">` vào trong phần `<head>`."},{"x":"**B4:** Lưu cả 2 tệp và kiểm tra sự thay đổi giao diện trên trình duyệt."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi viết sai dấu phân cách trong CSS:** Dùng dấu bằng `=` thay vì dấu hai chấm `:` hoặc dùng dấu phẩy `,` cuối câu lệnh thay dấu chấm phẩy `;`."},{"x":"**Khắc phục:** Tuân thủ chuẩn cú pháp CSS: `{ thuộc-tính: giá-trị; }`."}]}],"rem":[{"t":"ul","i":[{"x":"CSS định dạng trang trí giao diện; có 3 cách thiết lập: CSS ngoài (tốt nhất), CSS trong và CSS nội tuyến."}]}]},"terms":[{"t":"CSS (Cascading Style Sheets)","d":"Tập mẫu định dạng xếp chồng."},{"t":"Selector","d":"Bộ chọn CSS."},{"t":"Inline / Internal / External CSS","d":"CSS nội tuyến / CSS trong / CSS ngoài."},{"t":"<link rel=\"stylesheet\">","d":"Thẻ liên kết tệp CSS bên ngoài vào trang HTML."}],"txt":"**Kiến thức:** Hiểu được khái niệm, vai trò và ý nghĩa của mẫu định dạng CSS (Cascading Style Sheets) trong việc thiết kế trình bày trang web; nắm được 3 cách thiết lập CSS. **Năng lực:** Tách biệt giữa nội dung (HTML) và định dạng trình bày (CSS). **Phẩm chất:** Tư duy quản lý mã nguồn hệ thống khoa học, tối ưu. **Khái niệm CSS (Cascading Style Sheets):** Là ngôn ngữ quy định cách các phần tử HTML hiển thị trên màn hình (màu sắc, phông chữ, khoảng cách, bố cục). **Vai trò của CSS:** Tách biệt công việc nhập nội dung (HTML) và công việc trang trí định dạng (CSS). Tiết kiệm thời gian: Chỉ cần chỉnh sửa một tệp CSS ngoài (`.css`) có thể thay đổi giao diện của toàn bộ website gồm hàng trăm trang web. Giúp trang web tải nhanh hơn và nhất quán về phong cách thiết kế. **Cấu trúc một quy tắc CSS (CSS Rule):** Cú pháp: `Bộ_chọn { Thuộc_tính: Giá_trị; }` (VD: `h1 { color: red; font-size: 20px; }`). **Bộ chọn (Selector):** Chỉ định phần tử HTML cần áp dụng định dạng. **Khối khai báo (Declaration Block):** Đặt trong cặp dấu ngoặc nhọn `{}` chứa các cặp `Thuộc_tính: Giá_trị;`. **3 cách nhúng CSS vào trang HTML:** **CSS nội tuyến (Inline CSS):** Viết trực tiếp trong thuộc tính `style=\"...\"` của thẻ HTML. **CSS trong (Internal CSS):** Viết bên trong cặp thẻ `<style></style>` đặt tại phần `<head>` của trang HTML. **CSS ngoài (External CSS):** Viết trong tệp `.css` độc lập và liên kết vào trang HTML bằng thẻ `<link rel=\"stylesheet\" href=\"style.css\">`. (Cách tối ưu nhất). `CSS (Cascading Style Sheets)`: Tập mẫu định dạng xếp chồng. `Selector`: Bộ chọn CSS. `Inline / Internal / External CSS`: CSS nội tuyến / CSS trong / CSS ngoài. `<link rel=\"stylesheet\">`: Thẻ liên kết tệp CSS bên ngoài vào trang HTML. /* Tệp style.css độc lập */\np {\n    color: brown;\n    font-size: 14px;\n    text-align: justify;\n} **B1:** Tạo tệp mới `mystyle.css` trong cùng thư mục với trang HTML. **B2:** Soạn thảo các quy tắc CSS cho thẻ `body`, `h1`, `p`. **B3:** Mở tệp HTML, chèn `<link rel=\"stylesheet\" href=\"mystyle.css\">` vào trong phần `<head>`. **B4:** Lưu cả 2 tệp và kiểm tra sự thay đổi giao diện trên trình duyệt. **Lỗi viết sai dấu phân cách trong CSS:** Dùng dấu bằng `=` thay vì dấu hai chấm `:` hoặc dùng dấu phẩy `,` cuối câu lệnh thay dấu chấm phẩy `;`. **Khắc phục:** Tuân thủ chuẩn cú pháp CSS: `{ thuộc-tính: giá-trị; }`. CSS định dạng trang trí giao diện; có 3 cách thiết lập: CSS ngoài (tốt nhất), CSS trong và CSS nội tuyến."};

(window.T=window.T||{L:{},Q:{}}).L["ICT12_B14"]={"sec":{"obj":[{"t":"ul","i":[{"x":"**Kiến thức:** Sử dụng được các thuộc tính CSS định dạng phông chữ, màu chữ, căn lề và khoảng cách dòng văn bản; hiểu về tính kế thừa và thứ tự ưu tiên của CSS."},{"x":"**Năng lực:** Áp dụng thuộc tính CSS trình bày văn bản chuyên nghiệp."},{"x":"**Phẩm chất:** Tỉ mỉ, có gu thẩm mỹ trình bày văn bản số."}]}],"key":[{"t":"ul","i":[{"x":"**Các thuộc tính định dạng phông chữ (Font Properties):**","c":[{"x":"`font-family`: Quy định họ phông chữ (VD: `Arial, sans-serif`, `Times New Roman, serif`). Phân loại: Phông có chân (`serif`), phông không chân (`sans-serif`), phông đơn cách (`monospace`)."},{"x":"`font-size`: Cỡ chữ (đơn vị `px`, `pt`, `em`, `rem`, `%`)."},{"x":"`font-weight`: Độ đậm của chữ (`normal`, `bold`, `100`-`900`)."},{"x":"`font-style`: Kiểu chữ (`normal`, `italic`)."}]},{"x":"**Các thuộc tính định dạng đoạn văn bản (Text Properties):**","c":[{"x":"`color`: Màu chữ."},{"x":"`text-align`: Căn lề văn bản (`left`, `right`, `center`, `justify`)."},{"x":"`line-height`: Khoảng cách giữa các dòng trong đoạn văn."},{"x":"`text-indent`: Độ lùi đầu dòng của đoạn văn."},{"x":"`text-decoration`: Đường gạch văn bản (`none`, `underline`, `line-through`)."}]},{"x":"**Tính kế thừa (Inheritance) & Ưu tiên trong CSS:**","c":[{"x":"Các phần tử con sẽ tự động kế thừa một số thuộc tính CSS từ phần tử cha (như `color`, `font-family`)."},{"x":"Thứ tự ưu tiên áp dụng: CSS nội tuyến > CSS trong > CSS ngoài > Mặc định trình duyệt."}]}]}],"terms":[{"t":"ul","i":[{"x":"`font-family`: Họ phông chữ (Serif, Sans-serif, Monospace)."},{"x":"`font-size / font-weight / font-style`: Cỡ chữ / Độ đậm / Kiểu nghiêng."},{"x":"`text-align / line-height`: Căn lề / Khoảng cách dòng."},{"x":"`CSS Inheritance`: Tính kế thừa CSS từ phần tử cha sang phần tử con."}]}],"ex":[{"t":"code","l":"css","x":"body {\n    font-family: Arial, Helvetica, sans-serif;\n    color: #333333;\n}\nh1 {\n    font-size: 24px;\n    text-align: center;\n    color: navy;\n}\np {\n    font-size: 14px;\n    line-height: 1.5;\n    text-indent: 20px;\n}"}],"steps":[{"t":"ul","i":[{"x":"**B1:** Mở tệp `style.css`."},{"x":"**B2:** Đặt phông chữ không chân `font-family: sans-serif;` cho thẻ `body` để áp dụng toàn trang."},{"x":"**B3:** Định dạng thẻ `h1` căn giữa, màu xanh; định dạng thẻ `p` lùi đầu dòng và giãn dòng `1.5`."},{"x":"**B4:** Lưu tệp và F5 trình duyệt kiểm tra kết quả."}]}],"err":[{"t":"ul","i":[{"x":"**Lỗi tên phông chữ có khoảng trắng không đặt trong dấu ngoặc:** Viết `font-family: Times New Roman;` khiến trình duyệt không nhận diện đúng."},{"x":"**Khắc phục:** Tên phông chữ có từ 2 từ trở lên phải đặt trong dấu nháy: `font-family: 'Times New Roman', Times, serif;`."}]}],"rem":[{"t":"ul","i":[{"x":"CSS cung cấp các thuộc tính `font-*` và `text-*` để định dạng phông chữ và đoạn văn; phần tử con có tính kế thừa CSS từ phần tử cha."}]}]},"terms":[{"t":"font-family","d":"Họ phông chữ (Serif, Sans-serif, Monospace)."},{"t":"font-size / font-weight / font-style","d":"Cỡ chữ / Độ đậm / Kiểu nghiêng."},{"t":"text-align / line-height","d":"Căn lề / Khoảng cách dòng."},{"t":"CSS Inheritance","d":"Tính kế thừa CSS từ phần tử cha sang phần tử con."}],"txt":"**Kiến thức:** Sử dụng được các thuộc tính CSS định dạng phông chữ, màu chữ, căn lề và khoảng cách dòng văn bản; hiểu về tính kế thừa và thứ tự ưu tiên của CSS. **Năng lực:** Áp dụng thuộc tính CSS trình bày văn bản chuyên nghiệp. **Phẩm chất:** Tỉ mỉ, có gu thẩm mỹ trình bày văn bản số. **Các thuộc tính định dạng phông chữ (Font Properties):** `font-family`: Quy định họ phông chữ (VD: `Arial, sans-serif`, `Times New Roman, serif`). Phân loại: Phông có chân (`serif`), phông không chân (`sans-serif`), phông đơn cách (`monospace`). `font-size`: Cỡ chữ (đơn vị `px`, `pt`, `em`, `rem`, `%`). `font-weight`: Độ đậm của chữ (`normal`, `bold`, `100`-`900`). `font-style`: Kiểu chữ (`normal`, `italic`). **Các thuộc tính định dạng đoạn văn bản (Text Properties):** `color`: Màu chữ. `text-align`: Căn lề văn bản (`left`, `right`, `center`, `justify`). `line-height`: Khoảng cách giữa các dòng trong đoạn văn. `text-indent`: Độ lùi đầu dòng của đoạn văn. `text-decoration`: Đường gạch văn bản (`none`, `underline`, `line-through`). **Tính kế thừa (Inheritance) & Ưu tiên trong CSS:** Các phần tử con sẽ tự động kế thừa một số thuộc tính CSS từ phần tử cha (như `color`, `font-family`). Thứ tự ưu tiên áp dụng: CSS nội tuyến > CSS trong > CSS ngoài > Mặc định trình duyệt. `font-family`: Họ phông chữ (Serif, Sans-serif, Monospace). `font-size / font-weight / font-style`: Cỡ chữ / Độ đậm / Kiểu nghiêng. `text-align / line-height`: Căn lề / Khoảng cách dòng. `CSS Inheritance`: Tính kế thừa CSS từ phần tử cha sang phần tử con. body {\n    font-family: Arial, Helvetica, sans-serif;\n    color: #333333;\n}\nh1 {\n    font-size: 24px;\n    text-align: center;\n    color: navy;\n}\np {\n    font-size: 14px;\n    line-height: 1.5;\n    text-indent: 20px;\n} **B1:** Mở tệp `style.css`. **B2:** Đặt phông chữ không chân `font-family: sans-serif;` cho thẻ `body` để áp dụng toàn trang. **B3:** Định dạng thẻ `h1` căn giữa, màu xanh; định dạng thẻ `p` lùi đầu dòng và giãn dòng `1.5`. **B4:** Lưu tệp và F5 trình duyệt kiểm tra kết quả. **Lỗi tên phông chữ có khoảng trắng không đặt trong dấu ngoặc:** Viết `font-family: Times New Roman;` khiến trình duyệt không nhận diện đúng. **Khắc phục:** Tên phông chữ có từ 2 từ trở lên phải đặt trong dấu nháy: `font-family: 'Times New Roman', Times, serif;`. CSS cung cấp các thuộc tính `font-*` và `text-*` để định dạng phông chữ và đoạn văn; phần tử con có tính kế thừa CSS từ phần tử cha."};
