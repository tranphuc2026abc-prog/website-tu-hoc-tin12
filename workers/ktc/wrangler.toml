name = "ktc-ai-tutor"
main = "worker.mjs"
compatibility_date = "2026-11-24"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGIN = "https://tranphuc2026abc-prog.github.io"
GROQ_MODEL = "llama-3.1-8b-instant"
GROQ_REQUESTS_PER_MINUTE = "25"
GROQ_REQUESTS_PER_DAY = "500"
GROQ_TOKENS_PER_MINUTE = "5500"
GROQ_TOKENS_PER_DAY = "450000"

[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
