name: Bằng chứng giao diện Tin học THPT

on:
  pull_request:
    branches: [chuan-hoa/du-lieu]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - 'index.html'
      - 'course.html'
      - 'data/**'
      - 'scripts/build_all_grades.py'
      - 'scripts/build_multigrade.py'
      - 'tests/ui-evidence.js'
      - 'docs/ui/**'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dựng dữ liệu nguồn
        run: |
          python scripts/build_all_grades.py nguon
          python scripts/build_single.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cài Playwright trên runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Chụp ảnh và đo giao diện
        env:
          PW: playwright
        run: node tests/ui-evidence.js
      - name: Lưu ảnh và số đo làm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bang-chung-giao-dien-${{ github.run_id }}
          path: docs/ui/anh/
          if-no-files-found: warn
          retention-days: 30
