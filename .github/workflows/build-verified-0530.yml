name: Build reviewed exam 2025-0530
on:
  push:
    branches: [feat/verify-2025-0530]
    paths: [.github/workflows/build-verified-0530.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - name: Build and validate
        run: |
          python scripts/build_verified_exam_batch.py --codes 0530 --layout-dir data/exams/layout/2025
          python scripts/validate_graduation_exams.py
          python tests/test_graduation_ocr.py
          node --test tests/graduation-core.test.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/exams/ocr-progress.json")
          progress = json.loads(path.read_text(encoding="utf-8"))
          if not any(row["year"] == 2025 and row["code"] == "0530" for row in progress["verified_papers"]):
              progress["verified_papers"].append({"year": 2025, "code": "0530", "questions": 30, "scored_per_track": 28})
              for key in ("verified_questions", "confirmed_duplicates_in_verified_bank", "answers_2025_matched_questions"):
                  progress[key] += 30
              progress["remaining"] = [
                  row for row in progress["remaining"] if (row["year"], row["code"]) != (2025, "0530")
              ]
              path.write_text(json.dumps(progress, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/exams
          git commit -m 'Publish 30 verified questions for 2025-0530'
          git push origin HEAD:refs/heads/feat/verify-2025-0530
