name: KTC knowledge index
on:
  workflow_dispatch:
  push:
    branches: [feature/ktc-ai-tutor, main]
    paths:
      - 'data/lessons/**'
      - 'data/catalog*.js'
      - 'scripts/build_ktc_index.py'
      - 'tests/test_ktc_corpus.py'
      - '.github/workflows/ktc-index.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/test_ktc_corpus.py
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install sentence-transformers==3.4.1
      - run: python scripts/build_ktc_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: ktc-index
          path: data/ktc/grade-*.json
          if-no-files-found: error
