name: Build verified 2025-0525 from reviewed source

on:
  push:
    branches:
      - feat/verify-2025-0525-source-review
    paths:
      - .github/workflows/build-verified-0525.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow

      - name: Build 0525 from manually reviewed 30-question mapping
        run: python scripts/build_verified_exam_batch.py --codes 0525 --layout-dir data/exams/layout/2025

      - name: Validate exams and test grading
        run: |
          python scripts/validate_graduation_exams.py
          node --test tests/graduation-core.test.cjs
          python tests/test_graduation_ocr.py

      - name: Save verified question bank and source images on review branch
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/exams/
          if ! git diff --cached --quiet; then
            git commit -m 'feat(exams): release verified 2025-0525 with 30 original questions'
            git push origin "HEAD:${GH_REF_NAME}"
          else
            echo "No new files to commit"
          fi
