name: Build verified 2025-0527 from reviewed source
on:
  push:
    branches: [feat/verify-2025-0527-source-review]
    paths: [.github/workflows/build-verified-0527.yml]
permissions:
  contents: write
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Build reviewed 2025-0527 and test
        run: |
          python scripts/build_verified_exam_batch.py --codes 0527 --layout-dir data/exams/layout/2025
          python scripts/validate_graduation_exams.py
          node --test tests/graduation-core.test.cjs
          python tests/test_graduation_ocr.py
      - name: Commit verified JSON and source images
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/exams/
          if ! git diff --cached --quiet; then
            git commit -m 'feat(exams): verified 2025-0527 with 30 questions'
            git push origin "HEAD:${GH_REF_NAME}"
          fi
