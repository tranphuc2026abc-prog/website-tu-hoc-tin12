name: Prepare graduation exam review batch

on:
  pull_request:
    paths:
      - .github/workflows/exam-review-batch.yml
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of pending papers to prepare (1–8)
        default: "8"
        type: string
      paper:
        description: Optional pending paper (YYYY-NNNN)
        type: string
      start_offset:
        description: Zero-based offset in the remaining papers (0, 8, 16, ...)
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and OCR tools
        run: |
          python -m pip install pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-vie
      - name: Validate published exams before preparing review evidence
        run: |
          python scripts/validate_graduation_exams.py
          python -m unittest discover -s tests -p test_graduation_ocr.py
          node --test tests/graduation-core.test.cjs
      - name: Render sources and prepare OCR for visual review
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '8' }}
          REVIEW_PAPER: ${{ inputs.paper || '' }}
          START_OFFSET: ${{ inputs.start_offset || '0' }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          import pymupdf

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def render(pdf_path, destination, expected_pages=None, ocr=False):
              destination.mkdir(parents=True)
              with pymupdf.open(pdf_path) as pdf:
                  if not len(pdf) or (expected_pages is not None and len(pdf) != expected_pages):
                      raise ValueError(f"Unexpected page count in {pdf_path}: {len(pdf)}")
                  for index, page in enumerate(pdf, start=1):
                      image = destination / f"page-{index:02}.png"
                      page.get_pixmap(dpi=220, alpha=False).save(image)
                      if ocr:
                          result = subprocess.run(
                              ["tesseract", str(image), "stdout", "-l", "vie+eng", "--psm", "3"],
                              text=True, encoding="utf-8", capture_output=True,
                              check=True, timeout=90,
                          )
                          if not result.stdout.strip():
                              raise ValueError(f"Empty OCR output for {image}")
                          image.with_suffix(".ocr.txt").write_text(result.stdout, encoding="utf-8")
                  return len(pdf)

          size = int(os.environ["BATCH_SIZE"])
          offset = int(os.environ["START_OFFSET"])
          if offset < 0:
              raise ValueError("start_offset must be >= 0")
          if not 1 <= size <= 8:
              raise ValueError("batch_size must be between 1 and 8")
          data = Path("data/exams")
          manifest = read_json(data / "manifest.json")
          checkpoint = data / "ocr-progress.json"
          remaining = sorted(
              (str(row["year"]), row["code"]) for row in read_json(checkpoint)["remaining"]
          )
          published = {
              (year, code)
              for year, papers in manifest["papers"].items()
              for code in papers
          }
          originals = {
              (year, code)
              for year, papers in manifest["files"].items()
              for code in papers
          }
          if len(remaining) != len(set(remaining)) or set(remaining) != originals - published:
              raise ValueError("Checkpoint and manifest disagree about pending papers")
          output = Path("exam-review-artifacts")
          output.mkdir()
          shutil.copyfile(checkpoint, output / checkpoint.name)
          report = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "status": "pending_visual_and_answer_review",
              "start_offset": offset,
              "batch_size": size,
              "total_remaining": len(remaining),
              "selected_codes": [],
              "answers": {},
              "papers": [],
          }
          target_paper = os.environ['REVIEW_PAPER'].strip()
          selected = remaining[offset:offset + size]
          if target_paper:
              selected = [item for item in remaining if '-'.join(item) == target_paper]
              if not selected:
                  raise ValueError(f'Paper is not pending: {target_paper}')
          if not selected:
              raise ValueError(f"No remaining papers at offset {offset}; total {len(remaining)}")
          for year, code in selected:
              report["selected_codes"].append(f"{year}-{code}")
              if code in manifest.get("papers", {}).get(year, {}):
                  raise ValueError(f"Published paper still appears as pending: {year}-{code}")
              if year not in report["answers"]:
                  answer = Path(manifest["answers"][year])
                  pages = render(answer, output / year / "answers")
                  report["answers"][year] = {"path": str(answer), "sha256": digest(answer), "pages": pages}
                  for page_image in sorted((output / year / "answers").glob("page-*.png")):
                      result = subprocess.run(
                          ["tesseract", str(page_image), "stdout", "-l", "vie+eng", "--psm", "6"],
                          text=True, encoding="utf-8", capture_output=True,
                          check=True, timeout=90,
                      )
                      page_image.with_suffix(".ocr.txt").write_text(result.stdout, encoding="utf-8")
              source = Path(manifest["files"][year][code])
              target = output / year / code
              pages = render(source, target, expected_pages=4, ocr=True)
              draft = data / "ocr-drafts" / year / f"{code}.json"
              read_json(draft)
              shutil.copyfile(draft, target / "existing-ocr-draft.json")
              files = {item.name: digest(item) for item in sorted(target.iterdir())}
              report["papers"].append({
                  "year": year, "code": code, "source": str(source), "pages": pages,
                  "source_sha256": digest(source), "files_sha256": files,
              })
              print(f"Prepared {year}-{code}: {pages} pages for visual review")
          (output / "NEXT-STEPS.txt").write_text(
              "Review the original PDF images against OCR text and official answer columns.\\n"
              "Do not mark a paper verified from OCR alone.\\n"
              "This package is source evidence, not a released exam.\\n"
              f"Prepared {len(report['papers'])} codes; remaining total {len(remaining)}.\\n",
              encoding="utf-8",
          )
          (output / "batch-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: graduation-exam-review-batch
          path: exam-review-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Write GitHub Actions summary
        if: always()
        run: |
          echo '## Graduation exam review on Ubuntu' >> "$GITHUB_STEP_SUMMARY"
          if [ -f exam-review-artifacts/batch-report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("exam-review-artifacts/batch-report.json").read_text(encoding="utf-8"))
          print(f"- Remaining papers at run start: {r['total_remaining']}")
          print(f"- Offset: {r['start_offset']}; prepared: {len(r['papers'])}")
          print("- Prepared codes: " + ", ".join(r["selected_codes"]))
          print("- Status: source evidence prepared; **not verified or released**")
          PY
          else
            echo '- Review package not generated; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

  export-remaining-2026:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/export-2025-0529'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render original review images for remaining 2026 sources
        run: |
          python -m pip install pymupdf
          python - <<'PY'
          import json
          from pathlib import Path
          import pymupdf

          manifest = json.loads(Path("data/exams/manifest.json").read_text())
          output = Path("review-evidence")
          matrix = pymupdf.Matrix(2.4, 2.4)

          def render(source, stem, landscape=False):
              directory = (output / stem).parent
              directory.mkdir(parents=True, exist_ok=True)
              with pymupdf.open(source) as pdf:
                  for number, page in enumerate(pdf, 1):
                      if landscape and page.rect.height > page.rect.width:
                          page.set_rotation((page.rotation + 90) % 360)
                      name = f"{stem}-{number:02}"
                      pix = page.get_pixmap(matrix=matrix, colorspace=pymupdf.csGRAY)
                      png = pix.tobytes("png")
                      if len(png) <= 700_000:
                          (output / f"{name}.png").write_bytes(png)
                          continue
                      rect = page.rect
                      for index in range(3):
                          band = pymupdf.Rect(
                              rect.x0, rect.y0 + rect.height * index / 3 - 8,
                              rect.x1, rect.y0 + rect.height * (index + 1) / 3 + 8,
                          )
                          page.get_pixmap(matrix=matrix, clip=band, colorspace=pymupdf.csGRAY).save(
                              output / f"{name}-{index + 1}.png"
                          )

          render(manifest["answers"]["2026"], "2026/answers", landscape=True)
          for value in range(509, 549):
              code = f"{value:04}"
              render(manifest["files"]["2026"][code], f"2026-{code}/exam")
              print(f"Rendered 2026-{code}")
          PY
      - name: Publish the review images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-evidence
          git commit -m 'Render 2026 exams 0509 through 0548 and official answer pages'
          git push origin HEAD:refs/heads/review/evidence-2026-0509-0548
