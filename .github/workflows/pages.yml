name: Validate and deploy Tin hoc 12

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      KTC_MODEL_DIR: ${{ github.workspace }}/.ktc-model/
    outputs:
      exam_manifest_sha: ${{ steps.exam-manifest.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate and build source data
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f data/catalog.js
          test -f data/catalog-10.js
          test -f data/catalog-11.js
          test -f tests/e2e.js
          test -d nguon
          python scripts/build_all_grades.py nguon
          python scripts/build_single.py
          python - <<'PY'
          from pathlib import Path
          from json import loads
          portal = Path("index.html").read_text(encoding="utf-8")
          course = Path("course.html").read_text(encoding="utf-8")
          single = Path("Tin12_MotFile.html").read_text(encoding="utf-8")
          assert all(f'course.html?grade={g}' in portal for g in (10, 11, 12))
          assert 'assets/js/course-loader.js' in course
          assert '<main id="app"' in single
          assert 'assets/js/course-loader.js' not in single
          for grade, expected in ((10, 34), (11, 31), (12, 28)):
              path = Path("data") / (f"catalog-{grade}.js" if grade < 12 else "catalog.js")
              text = path.read_text(encoding="utf-8")
              assert text.count('"id":"ICT%d_B' % grade) == expected, f"Grade {grade} catalog lesson count"
          print("Portal and all three catalogs passed static checks.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache pinned MiniLM files
        uses: actions/cache@v4
        with:
          path: .ktc-model
          key: ktc-minilm-${{ hashFiles('assets/js/ktc-encoder.mjs', 'scripts/fetch_ktc_model.py') }}

      - name: Build static KTC index and validate Worker
        run: |
          python scripts/fetch_ktc_model.py
          python tests/test_ktc_corpus.py
          python scripts/build_ktc_index.py
          node --test tests/ktc-worker.test.mjs
          npx wrangler deploy --config workers/ktc/wrangler.toml --dry-run --outdir "${RUNNER_TEMP}/ktc-worker"

      - name: Evaluate KTC retrieval on all 93 lessons
        run: node tests/evaluate_ktc.mjs "${RUNNER_TEMP}/ktc-retrieval-results.json"

      - name: Archive KTC retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktc-retrieval-${{ github.sha }}
          path: ${{ runner.temp }}/ktc-retrieval-results.json
          if-no-files-found: ignore

      - name: Archive versioned KTC index
        uses: actions/upload-artifact@v4
        with:
          name: ktc-index-${{ github.sha }}
          path: data/ktc/grade-*.json
          if-no-files-found: error

      - name: Run browser end-to-end tests over HTTP
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: node tests/e2e.js http

      - name: Validate graduation PDFs and browser flow
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: |
          python scripts/validate_graduation_exams.py
          node --test tests/graduation-core.test.cjs
          python tests/test_graduation_ocr.py
          node tests/graduation-e2e.js

      - name: Record the validated exam manifest digest
        id: exam-manifest
        run: echo "sha=$(sha256sum data/exams/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Stage public website files
        env:
          KTC_API_URL: ${{ vars.KTC_API_URL }}
        run: bash scripts/package_pages.sh _site

      - name: Smoke test packaged KTC in Chromium
        run: |
          python -m http.server 8877 --bind 127.0.0.1 --directory _site &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..10}; do
            curl --fail --silent http://127.0.0.1:8877/tro-ly-ai.html >/dev/null && break
            sleep 1
          done
          node tests/ktc-browser.test.mjs http://127.0.0.1:8877/

      - name: Update the production KTC Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.KTC_API_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KTC_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.KTC_CLOUDFLARE_ACCOUNT_ID || secrets.KTC_CLOUDFLARE_ACCOUNT_ID }}
          KTC_API_URL: ${{ vars.KTC_API_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config workers/ktc/wrangler.toml --keep-vars
          curl --fail --silent --show-error --retry 3 --max-time 15 "${KTC_API_URL%/}/health"

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the new exam manifest on GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.validate.outputs.exam_manifest_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 \
              "${PAGE_URL%/}/data/exams/manifest.json?revision=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/exam-manifest.json \
              && printf '%s  %s\n' "$EXPECTED_SHA" /tmp/exam-manifest.json | sha256sum --check; then
              exit 0
            fi
            sleep 5
          done
          echo "The public exam manifest did not match the validated artifact." >&2
          exit 1
