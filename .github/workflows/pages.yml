name: Validate and deploy Tin hoc 12

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      exam_manifest_sha: ${{ steps.exam-manifest.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate and build source data
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f data/catalog.js
          test -f data/catalog-10.js
          test -f data/catalog-11.js
          test -f tests/e2e.js
          test -d nguon
          python scripts/build_all_grades.py nguon
          python scripts/build_single.py
          python - <<'PY'
          from pathlib import Path
          from json import loads
          portal = Path("index.html").read_text(encoding="utf-8")
          course = Path("course.html").read_text(encoding="utf-8")
          single = Path("Tin12_MotFile.html").read_text(encoding="utf-8")
          assert all(f'course.html?grade={g}' in portal for g in (10, 11, 12))
          assert 'assets/js/course-loader.js' in course
          assert '<main id="app"' in single
          assert 'assets/js/course-loader.js' not in single
          for grade, expected in ((10, 34), (11, 31), (12, 28)):
              path = Path("data") / (f"catalog-{grade}.js" if grade < 12 else "catalog.js")
              text = path.read_text(encoding="utf-8")
              assert text.count('"id":"ICT%d_B' % grade) == expected, f"Grade {grade} catalog lesson count"
          print("Portal and all three catalogs passed static checks.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests over HTTP
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: node tests/e2e.js http

      - name: Validate graduation PDFs and browser flow
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: |
          python scripts/validate_graduation_exams.py
          node --test tests/graduation-core.test.cjs
          python tests/test_graduation_ocr.py
          node tests/graduation-e2e.js

      - name: Record the validated exam manifest digest
        id: exam-manifest
        run: echo "sha=$(sha256sum data/exams/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Stage public website files
        run: bash scripts/package_pages.sh _site

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the new exam manifest on GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.validate.outputs.exam_manifest_sha }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 \
              "${PAGE_URL%/}/data/exams/manifest.json?revision=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/exam-manifest.json \
              && printf '%s  %s\n' "$EXPECTED_SHA" /tmp/exam-manifest.json | sha256sum --check; then
              exit 0
            fi
            sleep 5
          done
          echo "The public exam manifest did not match the validated artifact." >&2
          exit 1
