name: Validate and deploy Tin hoc 12

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate and build source data
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f data/catalog.js
          test -f tests/e2e.js
          test -d nguon
          python scripts/build_data.py nguon
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'assets/css/style.css' in html
          assert 'data/catalog.js' in html
          assert 'assets/js/app.js' in html
          catalog = Path("data/catalog.js").read_text(encoding="utf-8")
          assert len(re.findall(r'"id":"ICT12_B\d{2}"', catalog)) >= 28, "Catalog appears to lack lesson IDs"
          print("Static file and catalog checks passed.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests over HTTP
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: node tests/e2e.js http

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
