name: Validate and deploy Tin hoc 12 (preview)

on:
  push:
    branches: [feature/student-accounts-teacher-dashboard]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the same lock as the production workflow so the two deployments
# cannot overwrite each other's Pages artifact concurrently.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Checkout stable main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate preview source and build data
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f assets/js/supabase-config.js
          test -f assets/js/supabase-cloud.js
          test -f assets/js/teacher-dashboard.js
          test -f data/catalog.js
          test -f tests/e2e.js
          test -d nguon
          python scripts/build_data.py nguon
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          for item in ("assets/css/style.css", "data/catalog.js", "assets/js/app.js",
                       "assets/js/supabase-config.js", "assets/js/supabase-cloud.js",
                       "assets/js/teacher-dashboard.js"):
              assert item in html, f"Missing script/style reference: {item}"
          catalog = Path("data/catalog.js").read_text(encoding="utf-8")
          assert all(f'"ICT12_B{i:02d}"' in catalog for i in range(1, 29)), "Catalog appears to lack lesson IDs"
          print("Preview static file and catalog checks passed.")
          PY

      - name: Validate stable main site
        working-directory: stable
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f data/catalog.js
          test -d nguon
          python ../scripts/build_data.py nguon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests for preview
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: node tests/e2e.js http

      - name: Assemble stable site plus isolated preview
        run: |
          mkdir -p site/preview
          rsync -a --exclude='.git' --exclude='node_modules' stable/ site/
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='stable' --exclude='site' ./ site/preview/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy preview without replacing the stable root site
        id: deployment
        uses: actions/deploy-pages@v4
