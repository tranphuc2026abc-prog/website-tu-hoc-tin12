name: Validate and deploy Tin hoc 12

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate and build source data
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f data/catalog.js
          test -f data/catalog-10.js
          test -f data/catalog-11.js
          test -f tests/e2e.js
          test -d nguon
          python scripts/build_all_grades.py nguon
          python - <<'PY'
          from pathlib import Path
          from json import loads
          portal = Path("index.html").read_text(encoding="utf-8")
          course = Path("course.html").read_text(encoding="utf-8")
          assert all(f'course.html?grade={g}' in portal for g in (10, 11, 12))
          assert 'assets/js/course-loader.js' in course
          for grade, expected in ((10, 34), (11, 31), (12, 28)):
              path = Path("data") / (f"catalog-{grade}.js" if grade < 12 else "catalog.js")
              text = path.read_text(encoding="utf-8")
              assert text.count('"id":"ICT%d_B' % grade) == expected, f"Grade {grade} catalog lesson count"
          print("Portal and all three catalogs passed static checks.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests over HTTP
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
        run: node tests/e2e.js http

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
